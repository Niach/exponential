<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><script src="slop.js"></script><script src="parts.js"></script><style>body{padding:28px 32px;width:1000px}.g{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:16px}.g img{width:100%;border-radius:18px;background:#111}.g .c{text-align:center}.g .n{font-size:12px;color:oklch(.7 0 0);margin-top:6px}</style></head><body>
<h1>Prompted mascots · one style</h1><p class="sub" style="margin-top:6px" id="sub"></p>
<div class="g" id="g"></div>
<script>const subs=['towel','cat','cloud','cactus','toaster','mushroom'];const g=document.getElementById('g');
for(const s of [4,1]) for(const k of subs){g.innerHTML+=`<div class="c"><img src="gen/${k}-${s}.png"><div class="n">${k} · ${s} step${s>1?'s':''}</div></div>`}
</script></body></html>
