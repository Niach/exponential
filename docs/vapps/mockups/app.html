<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><script src="slop.js"></script><script src="parts.js"></script><style>.rec{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid oklch(1 0 0/6%)}.rec .ph{width:64px;height:64px;border-radius:12px;flex:none}.rec .n{font-weight:600;font-size:15px}.rec .m{font-size:13px;color:oklch(.7 0 0)}</style></head><body><div class="phone">{{statusbar}}
<div class="nav"><div class="circ">{{back}}</div><div class="title">Recipe box</div><div class="circ">{{people}}</div></div>
<div class="content" style="gap:12px">
  <div class="pillbtn" style="height:44px;border-radius:12px;gap:10px;color:oklch(.6 0 0);font-weight:400">{{search}} Search recipes</div>
  <div class="band">This week <span class="count">3</span></div>
  <div class="rec"><div class="ph" style="background:linear-gradient(135deg,#F472B6,#BE185D)"></div><div><div class="n">Lemon pasta</div><div class="m">20 min · from Lena's photo</div></div></div><div class="rec"><div class="ph" style="background:linear-gradient(135deg,#FACC15,#A16207)"></div><div><div class="n">Shakshuka</div><div class="m">35 min · Sunday</div></div></div><div class="rec"><div class="ph" style="background:linear-gradient(135deg,#4ADE80,#15803D)"></div><div><div class="n">Green curry</div><div class="m">40 min</div></div></div>
  <div class="band">Saved <span class="count">24</span></div>
  <div class="rec"><div class="ph" style="background:linear-gradient(135deg,#60A5FA,#1D4ED8)"></div><div><div class="n">Oma's Apfelstrudel</div><div class="m">90 min</div></div></div><div class="rec"><div class="ph" style="background:linear-gradient(135deg,#FB923C,#B45309)"></div><div><div class="n">Chili sin carne</div><div class="m">50 min</div></div></div>
</div>
<div class="bar" style="align-items:flex-end">
  <div class="pillbtn primary" style="height:52px;border-radius:26px;gap:8px;font-size:15px">{{camera}} From photo</div>
  <div style="display:flex;align-items:flex-end;gap:6px"><div style="background:oklch(1 0 0/10%);border:1px solid oklch(1 0 0/12%);border-radius:14px 14px 14px 4px;padding:8px 12px;font-size:13px;margin-bottom:10px;backdrop-filter:blur(8px)">Ask Momo</div><span data-slop="{&quot;body&quot;: &quot;bean&quot;, &quot;hue&quot;: 5, &quot;eyes&quot;: &quot;round&quot;, &quot;mouth&quot;: &quot;smile&quot;, &quot;extra&quot;: &quot;beret&quot;, &quot;tilt&quot;: 6}" data-size="66" style="display:inline-flex"></span></div>
</div>
</div></body></html>
