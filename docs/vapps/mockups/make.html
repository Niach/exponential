<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><script src="slop.js"></script><script src="parts.js"></script></head><body><div class="phone">{{statusbar}}
<div class="nav"><div style="width:44px"></div><div class="title"></div><div class="pillbtn" style="font-size:14px">Skip</div></div>
<div class="content" style="gap:10px">
  <div style="text-align:center;margin-top:4px"><h1>Make your slop</h1><p class="sub" style="margin-top:6px">It builds things for you. Tap parts to change them.</p></div>
  <div style="display:flex;justify-content:center;margin:14px 0 2px"><span data-slop="{&quot;body&quot;: &quot;bean&quot;, &quot;hue&quot;: 5, &quot;eyes&quot;: &quot;round&quot;, &quot;mouth&quot;: &quot;smile&quot;, &quot;extra&quot;: &quot;beret&quot;, &quot;tilt&quot;: -3}" data-size="190" style="display:inline-flex"></span></div>
  <div style="display:flex;justify-content:center;gap:8px"><div class="pillbtn" style="height:40px;gap:8px;font-size:14px">{{shuffle}} Shuffle</div></div>
  <div class="rows" style="margin-top:6px">
    <div class="pickrow"><span>Body</span><span class="v">Bean {{chev}}</span></div>
    <div class="pickrow"><span>Color</span><span class="v"><span class="swatches"><span class="sw" style="background:#F87171"></span><span class="sw" style="background:#FB923C"></span><span class="sw" style="background:#FACC15"></span><span class="sw" style="background:#4ADE80"></span><span class="sw" style="background:#2DD4BF"></span><span class="sw on" style="background:#60A5FA"></span><span class="sw" style="background:#A78BFA"></span><span class="sw" style="background:#F472B6"></span></span></span></div>
    <div class="pickrow"><span>Eyes</span><span class="v">Round {{chev}}</span></div>
    <div class="pickrow"><span>Extra</span><span class="v">Beret {{chev}}</span></div>
  </div>
  <div class="box" style="margin-top:8px;padding:12px 14px"><div style="font-size:12px;color:oklch(.65 0 0)">Name</div><div style="font-size:20px;font-weight:600;margin-top:2px">Momo<span style="opacity:.5;font-weight:300">|</span></div></div>
  <div class="btn primary" style="height:52px;border-radius:26px;font-size:16px">Hatch Momo</div>
  <p class="sub" style="text-align:center;font-size:13px">Momo lives on your phone. Building needs a computer with Claude or ChatGPT. You can add that later.</p>
</div></div></body></html>
