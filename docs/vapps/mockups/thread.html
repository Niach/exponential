<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><script src="slop.js"></script><script src="parts.js"></script></head><body><div class="phone">{{statusbar}}
<div class="nav"><div class="circ">{{back}}</div><div class="title"><span style="display:inline-flex;align-items:center;gap:8px"><span data-slop="{&quot;body&quot;: &quot;bean&quot;, &quot;hue&quot;: 5, &quot;eyes&quot;: &quot;round&quot;, &quot;mouth&quot;: &quot;smile&quot;, &quot;extra&quot;: &quot;beret&quot;, &quot;tilt&quot;: -3}" data-size="30" style="display:inline-flex"></span>Recipe box</span></div><div class="pillbtn" style="font-size:14px">Open</div></div>
<div class="content" style="gap:12px">
  <div class="bubble">Make me a recipe box where I save recipes from photos</div>
  <div class="msg"><div class="av"><span data-slop="{&quot;body&quot;: &quot;bean&quot;, &quot;hue&quot;: 5, &quot;eyes&quot;: &quot;round&quot;, &quot;mouth&quot;: &quot;smile&quot;, &quot;extra&quot;: &quot;beret&quot;, &quot;tilt&quot;: -3}" data-size="38" style="display:inline-flex"></span></div><div style="flex:1"><div class="who">Momo</div><div class="txt">Love it. Two ways this could look, pick one:</div>
    <div class="card" style="margin-top:10px;padding:10px">
      <div style="font-size:12px;color:oklch(.65 0 0);margin-bottom:8px;display:flex;align-items:center;gap:6px">{{sparkle}} Shape it</div>
      <div class="tiles">
        <div class="tile pick" data-fake="b,h,w,h,w" data-acc="#F472B6"><div class="cap">Big photos</div><div style="position:absolute;right:8px;top:8px;width:22px;height:22px;border-radius:50%;background:#fff;color:#111;display:flex;align-items:center;justify-content:center">{{check}}</div></div>
        <div class="tile" data-fake="b,,w,,w,,w" data-acc="#F472B6"><div class="cap">Simple list</div></div>
      </div>
      <div class="row" style="padding:10px 2px 2px"><div class="body"><div class="t" style="font-weight:500">Something else…</div></div><div class="trail">{{chev}}</div></div>
      <div class="btn primary" style="margin-top:8px">Go with Big photos</div>
    </div>
  </div></div>
  <div class="box"><div class="ph">Tell Momo more…</div><div class="tools">{{plus}}{{camera}}{{mic}}<div class="send">{{send}}</div></div></div>
</div></div></body></html>
