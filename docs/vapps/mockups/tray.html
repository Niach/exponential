<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><script src="slop.js"></script><script src="parts.js"></script><style>body{padding:24px;background:#2a2a30}.pop{width:360px;background:linear-gradient(#0e0e12,#15151a);border:1px solid oklch(1 0 0/12%);border-radius:16px;padding:8px 14px 12px;box-shadow:0 20px 60px rgba(0,0,0,.6)}.pop .row{padding:10px 2px}.sw2{width:36px;height:22px;border-radius:11px;background:#22C55E;position:relative}.sw2:after{content:'';position:absolute;right:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff}</style></head><body>
<div style="width:360px;display:flex;justify-content:center;margin-bottom:6px;color:#fff;font-size:12px;opacity:.6">▲</div>
<div class="pop">
  <div class="row"><div class="body"><div class="t">Slops on Danny's Mac</div><div class="s"><span class="dot"></span>awake · Claude signed in · 62% left this week</div></div></div>
  <div class="row"><div class="lead"><span data-slop="{&quot;body&quot;: &quot;bean&quot;, &quot;hue&quot;: 5, &quot;eyes&quot;: &quot;round&quot;, &quot;mouth&quot;: &quot;smile&quot;, &quot;extra&quot;: &quot;beret&quot;, &quot;tilt&quot;: -3}" data-size="36" style="display:inline-flex"></span></div><div class="body"><div class="t">Momo · Recipe box</div><div class="s">awake · 2 people inside</div></div><div class="trail green">●</div></div>
  <div class="row"><div class="lead"><span data-slop="Nuni:5" data-size="36" style="display:inline-flex"></span></div><div class="body"><div class="t">Nuni · Trip planner</div><div class="s">building · 4 min</div></div><div class="trail"><span class="spin"></span></div></div>
  <div class="row"><div class="lead"><span data-slop="{&quot;body&quot;: &quot;drop&quot;, &quot;hue&quot;: 1, &quot;eyes&quot;: &quot;sleepy&quot;, &quot;mouth&quot;: &quot;flat&quot;, &quot;extra&quot;: &quot;none&quot;, &quot;tilt&quot;: 4}" data-size="36" style="display:inline-flex"></span></div><div class="body"><div class="t">Pim · Chore wheel</div><div class="s">asleep</div></div><div class="trail muted">Wake</div></div>
  <div class="row"><div class="lead">{{eye}}</div><div class="body"><div class="t">Look around every hour</div><div class="s">last look 12 min ago</div></div><div class="trail"><div class="sw2"></div></div></div>
  <div style="display:flex;gap:8px;margin-top:8px"><div class="btn sm" style="flex:1">Open in Exponential</div><div class="btn sm" style="flex:1">Pause all</div></div>
</div></body></html>
