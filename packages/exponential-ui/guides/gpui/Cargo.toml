[package]
name = "exponential-ui-guide-gpui"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# A third-party app: its own workspace, outside apps/desktop's build graph.
[workspace]

[dependencies]
# The SDK. The painter wants the core at its own revision, so an app takes
# both from the release tag on github.com/Niach/exponential
# (`tag = "eui-v0.20.0"`). Path dependencies stand in for it here. The gpui
# pins below follow the painter README's "gpui revisions" (gated by
# check-gpui-revs.ts): the exact gpui-pre snapshot gpui-component pins.
eui-core = { path = "../../../../apps/desktop/crates/eui-core" }
eui-gpui = { path = "../../../../apps/desktop/crates/eui-gpui" }
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = "=0.9.0"
gpui-component-assets = { package = "gpui-kit-assets", version = "=0.9.0" }

[profile.dev.package."*"]
debug = false
