# VAPP-4 spike: the UniFFI facade over `crates/vapp-spike`. A STANDALONE
# workspace on purpose — uniffi (+ clap/goblin behind its `cli` feature) must not
# enter apps/desktop/Cargo.lock, which CI builds with `cargo test --locked`.
[workspace]

[package]
name = "vapp-spike-ffi"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "vapp_spike_ffi"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
default = []
cli = ["uniffi/cli"]

[dependencies]
vapp-spike = { path = "../../apps/desktop/crates/vapp-spike" }
uniffi = { version = "0.32" }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
