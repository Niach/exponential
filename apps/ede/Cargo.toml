# eDE, the Exponential Desktop Environment (#NEW-10): a Wayland compositor plus
# a shell drawn in eUI. Its own Cargo workspace, apart from apps/desktop: the
# compositor never links gpui, and eDE depends on the shared libraries, never
# the other way round (plan v5, chat 196b5162). The shell (`ede-shell`) and
# the control plane (`ede-protocol`) are members of apps/desktop since #EDE-51.
[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.2.14"
license = "Apache-2.0"

[workspace.dependencies]
# Pinned to a Smithay master rev (65aa86f, 2026-11-04) for the fixes after
# 0.7.0: the CRTC-reservation leak, XWayland large transfers + IconicState,
# dmabuf import release, `XWayland::spawn_with_inherited_env`. A rev pin,
# never a floating branch. Drop the git pin for the crates.io release at
# smithay 0.8. `default-features = false` keeps the graph to what each crate
# names. The udev/DRM + libinput backend is the `udev` feature on
# ede-compositor, so a dev box without those headers still builds winit.
smithay = { git = "https://github.com/Smithay/smithay", rev = "65aa86fa5236e41775c313408102a5d5c2d1e2ca", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
