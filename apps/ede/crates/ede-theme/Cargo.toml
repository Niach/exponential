[package]
autobins = false
name = "ede-theme"
description = "Exponential Desktop's theme bridge (#EDE-19): GTK 3/4, Qt (qt5ct/qt6ct or Qt's gtk3 platform theme), cursor and icon settings generated from the design tokens, so foreign apps match the shell"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde_json = "1"
toml.workspace = true

[dev-dependencies]
tempfile = "3"

# The installed name (Exponential Desktop); the crate keeps its ede- name.
[[bin]]
name = "exponential-theme"
path = "src/main.rs"
