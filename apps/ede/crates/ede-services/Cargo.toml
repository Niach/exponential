[package]
autobins = false
name = "ede-services"
description = "Exponential Desktop's services (#EDE-13): one per domain over the daemons the distro runs (NetworkManager, BlueZ, PipeWire, UPower, logind, udisks2, apt, fwupd), each with two faces, a genUI data source over a unix socket and MCP tools on eMCP's loopback server, the same grants and audit"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
ede-protocol = { path = "../../../desktop/crates/ede-protocol" }
# The MCP face: eMCP's loopback server (grants, callers) and audit rules.
emcp = { path = "../../../desktop/crates/emcp" }
# #LOGS-2: only the `exponential-services serve` binary initialises it;
# ede-shell links this crate as a library and never does (the IDE has its
# own crates/observability).
ede-observability = { path = "../ede-observability" }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
serde.workspace = true
serde_json = "1"
tracing.workspace = true
tracing-subscriber.workspace = true
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# The installed name (Exponential Desktop); the crate keeps its ede- name.
[[bin]]
name = "exponential-services"
path = "src/main.rs"
