[package]
autobins = false
name = "ede-session"
description = "Exponential Desktop's login session: environment, systemd user units, crash recovery and safe mode around ede-compositor"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
# The theme bridge's environment (#EDE-19: XCURSOR_* for the compositor's cursor).
ede-theme = { path = "../ede-theme" }
# SIGTERM from the login manager stops the compositor and the units (#EDE-40).
libc = "0.2"
# #LOGS-2: logging + Sentry (through the server's tunnel).
ede-observability = { path = "../ede-observability" }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3"

# The installed name (Exponential Desktop); the crate keeps its ede- name.
[[bin]]
name = "exponential-session"
path = "src/main.rs"
