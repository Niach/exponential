[package]
name = "ede-compositor"
description = "eDE's Wayland compositor (smithay): floating windows with edge snapping, layer-shell, winit for development"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[features]
default = ["winit"]
# Nested in a window on X11 or Wayland (Cinnamon/X11 for development).
winit = ["smithay/backend_winit"]

[dependencies]
smithay = { workspace = true, features = ["wayland_frontend", "desktop", "renderer_gl", "renderer_pixman"] }
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
bitflags = "2"

[dev-dependencies]
wayland-client = "0.31.10"
wayland-protocols = { version = "0.32.8", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.8", features = ["client"] }
tempfile = "3"
