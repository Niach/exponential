[package]
autobins = false
name = "ede-ui"
description = "Exponential Desktop's eUI-on-disk runtime: shell documents and the theme in ~/.config/exponential-desktop/ui, validated by eui-core, hot reloaded, every edit a git commit"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

# A library for the shell (#NEW-108) and the ede-tools MCP (#NEW-115), plus
# a small CLI. eui-core does the validating; history is the git CLI in the
# ui directory (no libgit2 to build).
[dependencies]
eui-core = { path = "../../../desktop/crates/eui-core" }
serde.workspace = true
serde_json = "1"
# macOS needs a backend feature; zed used to turn on `macos_fsevent` for
# the whole graph, gpui-pre does not.
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }

# The supervisor dies with the compositor that started it (PR_SET_PDEATHSIG).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# The installed name (Exponential Desktop); the crate keeps its ede- name.
[[bin]]
name = "exponential-ui"
path = "src/main.rs"
