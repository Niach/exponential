[package]
name = "ede-observability"
description = "Exponential Desktop's crash, performance and log reporting (Sentry SDK, through the Exponential server's tunnel) and the local frame-time summary"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
# #LOGS-2. No default features: no native-tls, no built-in transport (every
# envelope goes through `transport::Tunnel`, our own server's
# `/api/monitoring`), no Sentry minidumps (native crashes: `crash-monitor`
# below). `logs` = structured logs, `tracing` =
# sentry-tracing's span/log/error/breadcrumb layers.
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "debug-images", "panic", "logs", "tracing"] }
# The tunnel's HTTP: the same reqwest the eMCP crate already puts in this
# graph, rustls on ring only (`rustls-no-provider`: reqwest's `rustls`
# feature would turn on aws-lc-rs for every rustls user).
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde_json = "1"
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# #ERR-12: native crashes (signals, aborts) as events on the next launch;
# the IDE's crate, by path (one implementation for every binary).
crash-monitor = { path = "../../../desktop/crates/crash-monitor" }

[dev-dependencies]
tempfile = "3"
