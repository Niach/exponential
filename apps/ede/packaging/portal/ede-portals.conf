# xdg-desktop-portal >= 1.18 reads <XDG_CURRENT_DESKTOP>-portals.conf: eDE
# serves screen capture, remote control, global shortcuts and appearance;
# the GTK backend everything else (file chooser, app chooser, print, …).
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=ede
org.freedesktop.impl.portal.Screenshot=ede
org.freedesktop.impl.portal.RemoteDesktop=ede
org.freedesktop.impl.portal.GlobalShortcuts=ede
org.freedesktop.impl.portal.Settings=ede;gtk
