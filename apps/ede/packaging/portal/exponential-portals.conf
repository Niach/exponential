# xdg-desktop-portal >= 1.18 reads <XDG_CURRENT_DESKTOP>-portals.conf: Exponential Desktop
# serves screen capture, remote control, global shortcuts and appearance;
# the GTK backend everything else (file chooser, app chooser, print, …).
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=exponential
org.freedesktop.impl.portal.Screenshot=exponential
org.freedesktop.impl.portal.RemoteDesktop=exponential
org.freedesktop.impl.portal.GlobalShortcuts=exponential
org.freedesktop.impl.portal.Settings=exponential;gtk
