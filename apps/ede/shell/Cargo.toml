# eDE's shell workspace (#EDE-10): `ede-shell` draws the shell (panel, menu,
# switcher, notifications…) from genUI documents on disk with gpui + eui-gpui.
# A SECOND Cargo workspace next to apps/ede: the compositor workspace never
# links gpui (a shell crash must not take the session down, and the
# compositor must not need Vulkan), and this one takes the SDK crates by path
# like a third party would (packages/exponential-ui/guides/gpui is the model).
# The gpui pins follow eui-gpui's README ("gpui revisions"): zed floats in the
# manifest and Cargo.lock is the pin; check-gpui-revs.ts gates it.
[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.2.2"
license = "Apache-2.0"

[workspace.dependencies]
eui-core = { path = "../../desktop/crates/eui-core" }
eui-gpui = { path = "../../desktop/crates/eui-gpui", default-features = false }
ede-protocol = { path = "../crates/ede-protocol" }
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed" }
# Wayland only: the shell is a layer-shell client of ede-compositor; `x11`
# would pull libxkbcommon-x11 in for nothing. `--windowed` on macOS takes the
# Mac backend through gpui_platform's own cfg.
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "wayland", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "da4f93696dc2b2b4d91bcc42412b9053a3d24de8" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "da4f93696dc2b2b4d91bcc42412b9053a3d24de8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# zed's ztracing is GPL-3.0-or-later; every app linking gpui at this revision
# swaps in the SDK's no-op shims (apps/desktop/Cargo.toml says why).
[patch."https://github.com/zed-industries/zed"]
ztracing = { path = "../../desktop/crates/ztracing" }
ztracing_macro = { path = "../../desktop/crates/ztracing_macro" }

# The same vendored gpui-component the IDE paints with (#EXP-1620), so the
# shell and the IDE draw one look.
[patch."https://github.com/longbridge/gpui-component"]
gpui-component = { path = "../../desktop/vendor/gpui-component" }

# The IDE's dev profile, so a shared CARGO_TARGET_DIR reuses its artefacts
# and dev-profile layout is not painfully slow (apps/desktop/Cargo.toml).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package]
gpui = { opt-level = 3, debug = false }
gpui_platform = { opt-level = 3, debug = false }
gpui_macros = { opt-level = 3, debug = false }
taffy = { opt-level = 3, debug = false }
resvg = { opt-level = 3, debug = false }
rustybuzz = { opt-level = 3, debug = false }
ttf-parser = { opt-level = 3, debug = false }
smol = { opt-level = 3, debug = false }
tree-sitter = { opt-level = 3, debug = false }
ropey = { opt-level = 3, debug = false }
sum_tree = { opt-level = 3, debug = false }
lsp-types = { opt-level = 3, debug = false }
markdown = { opt-level = 3, debug = false }
xml5ever = { opt-level = 3, debug = false }
