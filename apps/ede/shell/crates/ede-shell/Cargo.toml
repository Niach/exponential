[package]
name = "ede-shell"
description = "eDE's shell: genUI documents on disk drawn in wlr-layer-shell surfaces (gpui + eui-gpui), its own process next to ede-compositor"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
eui-core.workspace = true
eui-gpui.workspace = true
ede-protocol.workspace = true
ede-ui = { path = "../../../crates/ede-ui" }
# The services data source (#EDE-13): /services/<domain> in every document.
ede-services = { path = "../../../crates/ede-services" }
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The IDE's fonts and Lucide icons, embedded like apps/desktop/crates/app/src/assets.rs does.
rust-embed = "8"
# localtime_r for the clock.
libc = "0.2"
# The switcher's thumbnails: captures as PNG data URLs.
png = "0.17"
base64 = "0.22"
# Notifications and the tray over the session bus (zbus like the IDE's voice tray; blocking calls from the main loop).
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
futures-util = { version = "0.3", default-features = false }
# ede-sealed (#EDE-17): PAM through the system libpam, opened at run time.
libloading = "0.8"
# The settings pages (#EDE-14) edit compositor.toml.
toml = "0.8"

[dev-dependencies]
tempfile = "3"
