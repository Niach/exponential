# EXP-1280: R8 over the linked Exponential UI painter (`:ui-compose`) needs the bigger heap (VAPP-89).
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# #EXP-1844: a daemon idle for 30 min stops (default 3 h): an ended session's
# daemon no longer holds 4 GB for hours (the session-end cgroup kill, #EXP-1868,
# takes the ones still busy).
org.gradle.daemon.idletimeout=1800000
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# #PERF-11: genUI's core is linked into the app's one native library
# (libexponential_mobile_ffi.so, app/build.gradle.kts `buildMobileFfi`), so the
# included `:ui-compose` neither builds nor packages its own .so.
exponential.uiFfi.linkedByHost=true
