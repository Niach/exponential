<!doctype html>
<html lang="en" style="color-scheme: dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <title>App</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <!-- The window is the app surface's box (runner.json): the surface, its container and its root are the
         window's height, the page scrolls inside the shell, never the window (no chrome of the runner's own). -->
    <style>
      html, body { height: 100dvh; margin: 0; overflow: hidden; overscroll-behavior: none; background: #09090b; }
      #root { height: 100dvh; }
      .xui-s-app > .xui-container, .xui-s-app > .xui-container > .xui-el { height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
