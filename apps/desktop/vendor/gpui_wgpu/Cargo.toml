[package]
name = "gpui_wgpu"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lib]
path = "src/gpui_wgpu.rs"

[features]
default = []
font-kit = ["dep:font-kit"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", default-features = false }
anyhow = "1.0.86"
bytemuck = "1"
collections = { git = "https://github.com/zed-industries/zed" }
cosmic-text = "0.19.0"
etagere = "0.2"
itertools = "0.14.0"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
parking_lot = "0.12.1"
profiling = "1"
raw-window-handle = "0.6"
smallvec = { version = "1.6", features = ["union", "const_new"] }
swash = "0.2.6"
unicode-bidi = { version = "0.3.18", default-features = false, features = ["hardcoded-data"] }
unicode-segmentation = "1.10"
# Exponential patch (#EDE-65): Emoji_Presentation for the emoji face pick.
unicode-properties = { version = "0.1.4", default-features = false, features = ["emoji"] }
gpui_util = { git = "https://github.com/zed-industries/zed" }
wgpu = "29.0.4"

# Optional: only needed on platforms with multiple font sources (e.g. Linux)
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
pollster = "0.4.0"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2.120"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
wgpu = { version = "29.0.4", features = ["webgl"] }
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
