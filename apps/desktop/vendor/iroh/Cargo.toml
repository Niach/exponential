[package]
edition = "2024"
rust-version = "1.91"
name = "iroh"
version = "1.4.1"
authors = [
    "dignifiedquire <me@dignifiedquire.com>",
    "n0 team",
]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "p2p quic connections dialed by public key"
readme = "README.md"
keywords = [
    "quic",
    "networking",
    "holepunching",
    "p2p",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/n0-computer/iroh"
resolver = "2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "iroh_docsrs",
]

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "iroh_base::*",
    "iroh_dns::*",
    "iroh_relay::*",
    "iroh_metrics::*",
    "n0_error::*",
    "n0_watcher::*",
    "noq::*",
    "noq_proto::*",
    "noq_udp::*",
    "bytes::*",
    "http::*",
    "serde_core::*",
    "tokio::*",
    "url::*",
    "rustls::*",
    "futures_core::stream::Stream",
    "futures_lite::stream::Boxed",
]

[features]
default = [
    "metrics",
    "fast-apple-datapath",
    "portmapper",
    "tls-ring",
]
fast-apple-datapath = ["noq/fast-apple-datapath"]
metrics = [
    "iroh-metrics/metrics",
    "iroh-relay/metrics",
]
platform-verifier = ["iroh-relay/platform-verifier"]
portmapper = ["dep:portmapper"]
qlog = ["noq/qlog"]
test-utils = [
    "iroh-relay/test-utils",
    "iroh-relay/server",
    "dep:axum",
    "dep:simple-dns",
]
tls-aws-lc-rs = [
    "noq/aws-lc-rs",
    "iroh-relay/tls-aws-lc-rs",
    "iroh-dns/tls-aws-lc-rs",
]
tls-ring = [
    "noq/ring",
    "iroh-relay/tls-ring",
    "iroh-dns/tls-ring",
]
unstable-custom-transports = []
unstable-net-report = []

[lib]
name = "iroh"
crate-type = [
    "lib",
    "cdylib",
]
path = "src/lib.rs"

