[workspace]
# #EDE-51: Exponential Desktop's control plane (crates/ede-protocol) and its
# shell (crates/ede-shell) are members too: one workspace, one lock with the IDE
# and the SDK crates they link; the compositor workspace in apps/ede takes
# ede-protocol by path and never links gpui.
members = ["crates/*"]
# #EXP-1484 / #EXP-1620: the vendored, patched iroh and gpui-component (see
# the [patch] sections below) are third-party crates, not ours.
exclude = ["vendor/iroh", "vendor/gpui-component", "vendor/gpui-pre-wgpu"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.14.150"
# The whole repo is Apache-2.0 (EXP-352; verbatim text in the repo-root LICENSE).
# Every crate inherits this via `license.workspace = true`, except the vendored
# gpui-markdown-editor which pins its own explicit Apache-2.0.
license = "Apache-2.0"

[workspace.dependencies]
# gpui comes from the `gpui-pre-*` crates.io snapshots of zed's crates, at the
# EXACT snapshot gpui-kit's gpui-component release is built against (gpui-kit
# pins `=` versions; any snapshot may change gpui's API). The dependency keys
# keep the crate names (`gpui`, `gpui_platform`, `gpui_macros`), so no source
# changes with the package rename. On a gpui-component bump: read the snapshot
# out of gpui-kit's workspace Cargo.toml at the release tag and move every
# `gpui-pre*` requirement together. `pinned_revs.rs` (crates/app) and
# packages/exponential-ui/release/check-gpui-revs.ts gate the versions in every
# consumer (crates/eui-gpui/README.md "gpui revisions" is the table).
# Current: gpui-component 0.9.0 → gpui-pre 0.3.11 (zed f816e1f, 2026-11-01).
# `stacker` grows the stack for deep element trees; zed made it opt-in
# (#63187) after our previous pin, where it was always on.
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["stacker"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
gpui_macros = { package = "gpui-pre-macros", version = "=0.3.11" }
# Linux/FreeBSD text system (eui-gpui's conformance dev-dependency; vendored
# with the colour-emoji shaping fix, see [patch.crates-io] below).
gpui_wgpu = { package = "gpui-pre-wgpu", version = "=0.3.11" }
# gpui-component (longbridge/gpui-kit) from crates.io, exact version: it pins
# the gpui-pre snapshot above. `tree-sitter-languages` (the §7.8 diff-view
# grammar pack) is declared HERE, not on the ui crate: gpui-component reaches
# the graph through two paths (ui, and theme via terminal), and a feature
# requested by only one of them makes per-crate selections (`cargo test -p
# coding` etc.) resolve a SECOND, featureless gpui-component — a full duplicate
# rlib per target dir (EXP-76). One workspace-level feature set ⇒ one variant.
gpui-component = { version = "=0.9.0", features = ["tree-sitter-languages"] }
# EXP-521: the window-level TextSelection layer (and, since 0.8, `Root`) lives
# in gpui-base; MarkdownView registers as a selection participant directly.
gpui-base = "=0.9.0"
# The SVG icons gpui-component's `IconName` enum is generated from (published
# as gpui-kit-assets since 0.6; the key keeps the old crate name). The app's
# AssetSource delegates icon lookups to it (§3.6 with_assets).
gpui-component-assets = { package = "gpui-kit-assets", version = "=0.9.0" }
# The `icon_named!` proc macro — generates the project-local `ExpIcon` enum
# from `apps/desktop/assets/icons/` (masterplan-v3 §4.7).
gpui-component-macros = "=0.9.0"

# EXP-636: the emulator is rio-vt (MIT) — Rio's embeddable VT core, chosen for
# its sixel/kitty/iTerm2 graphics pipeline (alacritty_terminal has none and its
# maintainers declined it). `pty` (default) OFF: we own the PTY via portable-pty.
# Pinned EXACTLY: the 0.5.x line changes public API between patch releases.
rio-vt = { version = "=0.5.29", default-features = false, features = ["graphics"] }
rio-graphics = { version = "=0.5.29", default-features = false }        # GraphicData/ColorType/texture keys the terminal crate names
image = { version = "0.25", default-features = false }                 # RenderImage frames for inline images; already in the tree via gpui
portable-pty = "0.9"                                                   # resolves 0.9.0
rusqlite = { version = "0.41", features = ["bundled", "serde_json"] }  # feature set matches §5.1
# THE HTTP client for the whole desktop app (EXP-304). It replaced `ureq`
# outright — one stack, not two. ureq is HTTP/1.1-only, which meant the 15
# Electric shape threads each held their own connection: every launch fired 15
# simultaneous cold DNS lookups + TLS handshakes at the instance, and that
# storm is what put ~10s between opening the app and seeing current data.
# reqwest negotiates HTTP/2 over ALPN and multiplexes every shape long-poll AND
# every tRPC call onto ONE connection.
#
# `blocking` keeps the call sites synchronous (§5.3: no async runtime under
# gpui's executors — reqwest's blocking client owns a private runtime on its own
# background thread, which never touches them). rustls, not native-tls, matching
# what ureq used and keeping OpenSSL off the Linux build. hyper/h2/rustls/tokio
# were already compiled into the binary via zed-reqwest and crates/steer, so the
# marginal tree weight is roughly what dropping ureq gives back.
#
# 0.13: `rustls-no-provider` (the ring provider `rustls` below, installed as
# the process default by crates/exp-http, which every client is built
# through: its test fails a client built any other way); the
# roots are the OS trust store (rustls-platform-verifier), 0.13's only rustls
# verifier, no longer the bundled webpki roots.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "http2",
    "rustls-no-provider",
    "gzip",
    "charset",
] }
# Ring only: reqwest's `rustls` feature would turn on aws-lc-rs for EVERY
# rustls user (a C build, and two providers make rustls refuse to pick).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flume = "0.11"
anyhow = "1"
rust-embed = "8"    # embeds assets/ (Inter TTFs, future icons) into the binary — no runtime asset paths (§3.7)
dirs = "6"          # per-user state dir for the DockAreaState layout persistence (§3.3)
open = "5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
# Steer publisher stream/sink combinators (§8) — already a transitive of
# tokio-tungstenite at this exact minor version; adds no new tree weight.
futures-util = "0.3"
# Persistent steer deviceId (§8.2) — uuid 1.x is already in the tree via gpui.
uuid = { version = "1", features = ["v4"] }
# PKCE S256 challenge for the OAuth deep-link code exchange (REV-13) — already
# in the tree transitively (rustls et al.) at this exact minor; no new weight.
sha2 = "0.10"
# §7.5 stop semantics (SIGTERM → grace → SIGKILL): direct signal delivery —
# portable-pty's ChildKiller only speaks SIGHUP. Already in the tree
# transitively (portable-pty, gpui) at this exact major.
libc = "0.2"
# EXP-1252: a moving session's handoff package (`coding::handoff`) is a
# tar.gz — `flate2` is already in the tree (image/zip decoders); `tar`
# (MIT/Apache-2.0) is new; its default `xattr` feature stays off.
flate2 = "1"
tar = { version = "0.4", default-features = false }

# EXP-746: the ONE internal contract for agent sessions (Apache-2.0). Only
# `crates/engine` links it — the adapters speak ACP in-process to the user's
# unmodified agent CLI, so it must stay gpui-free; the crate itself carries zero
# non-dev tokio dependencies and is driven on steer's existing runtime.
# Pinned EXACTLY (`=5.0.0`): the SDK pins its own `-schema`/`-derive`
# companions to exact versions, and its unstable surface may move in a minor —
# a caret range would silently resolve a surface this code does not compile
# against. The wire stays protocol v1 (`Client.v1()`/`Agent.v1()`, the
# `v1::schema` types); `CompactionUpdate` is stable since schema 1.11, so no
# unstable feature. No features: since 3.0 the native transports (`process`,
# `stdio`) and `schemars` are opt-in, and the adapters connect in-process.
agent-client-protocol = "=5.0.0"

# #EXP-1484: iroh 1.4.1 keeps a closed connection's direct path selected while
# another connection to the same peer stays open (a restarted peer redialing),
# so new handshakes go to the dead address. vendor/iroh = 1.4.1 from crates.io
# plus the one-function fix in src/socket/remote_map/remote_state.rs
# (vendor/iroh/PATCHES.md). Drop it once an iroh release carries the fix.
[patch.crates-io]
iroh = { path = "vendor/iroh" }
# #EXP-1620 / #EXP-1739: gpui-component 0.9.0 (gpui-kit's `crates/component`)
# plus the submenu row's trailing value, overlays closing when their anchor is
# lost, a public `PopupMenu::close` and the `test-support` hit-test skip
# (vendor/gpui-component/PATCHES.md). Its siblings (gpui-base, gpui-kit-assets,
# gpui-component-macros) come from crates.io unpatched.
gpui-component = { path = "vendor/gpui-component" }
# #EDE-65: gpui-pre-wgpu 0.3.11 (zed's `crates/gpui_wgpu`, the Linux/FreeBSD
# text system) plus shaping that prefers the colour emoji face for emoji-
# presentation clusters (vendor/gpui-pre-wgpu/PATCHES.md). Upstream still takes
# the first face covering a codepoint, so a monochrome symbol face wins.
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }


[patch."https://github.com/Niach/exponential"]
eui-core = { path = "crates/eui-core" }
eui-gpui = { path = "crates/eui-gpui" }
epilot = { path = "crates/epilot" }
epilot-screen = { path = "crates/epilot-screen" }
emcp = { path = "crates/emcp" }

# Debuginfo is the bulk of a debug tree on this dependency set (EXP-76: ~8GB
# per fresh build, most of it dep debuginfo plus the ~7k .o files macOS's
# split-debuginfo=unpacked keeps around as its containers). Workspace crates
# keep line tables (readable backtraces); dependencies build with none — gpui
# internals are not stepped through here, and full var-info debugging of a dep
# is a one-off `cargo clean -p` away.
# VAPP-86: the mobile facade (`crates/exponential-ui-ffi` → xcframework /
# Android .so) ships smallest with LTO + one codegen unit + stripped symbols;
# `build-ios.sh` / `build-android.sh` select it with `--profile mobile`.
# VAPP-106: `lto` only takes effect when the facade is built as ONE crate
# type (`cargo rustc --crate-type staticlib|cdylib`, what the scripts do):
# with its `[lib] crate-type` listing an rlib too, cargo silently skips LTO.
# `panic` stays "unwind" (Cargo's default): the facade's `catch_unwind`
# boundary (VAPP-103, VAPP-107) turns a core panic into an issue for the host
# instead of a dead app; `abort` would make it a no-op (it would save ~18% of
# the Android .so). `opt-level` stays 3, measured on the arm64 slices with
# LTO, stripped: "s" = -19% iOS / -22% Android for +5..15% on the grid
# layout pass; "z" = -21% / -34% for 2x slower everything. A host that
# prefers size builds with CARGO_PROFILE_MOBILE_OPT_LEVEL=s; the numbers
# are on VAPP-106 and in packages/exponential-ui/release/sizes.json.
[profile.mobile]
inherits = "release"
lto = true
codegen-units = 1
strip = true

# #VAPP-266: the desktop runner's release assets (release-eengine.yml):
# symbols stripped, thin LTO; `log`'s release_max_level_off (the runner's
# Cargo.toml) compiles every log macro out.
[profile.runner]
inherits = "release"
lto = "thin"
strip = true
# #VAPP-271: `strip` would reach the host proc-macro dylibs too, and a stripped
# one no longer loads on macOS (E0463 "can't find crate for `ztracing_macro`"):
# strip only the target binary (scripts/runner-kits/macos.sh, release-eengine.yml).
[profile.runner.build-override]
strip = false

# EXP-1457: the browser's eNet node (`exponential-net-wasm`, built by
# scripts/build-enet-wasm.sh): small over fast, it downloads after sign-in.
[profile.wasm]
inherits = "release"
lto = true
codegen-units = 1
opt-level = "s"

# EXP-1603: eUI Motion's WASM (scripts/build-motion-wasm.sh): size over
# speed (opt-level z keeps it inside the 200 KB gz budget; sampling stays
# far under its 0.5 ms budget).
[profile.motion-wasm]
inherits = "wasm"
opt-level = "z"
panic = "abort"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Dev-profile opt-level overrides for the heavy layout/render/text crates
# (masterplan-v3 §3.7 — adopted from gpui-component's own workspace, which does
# exactly this; without them dev-profile layout is painfully slow). Each entry
# repeats `debug = false` because a named override shadows the `"*"` table —
# per-key fallback from a named entry to `"*"` is not something to rely on.
[profile.dev.package]
gpui = { opt-level = 3, debug = false }
gpui_platform = { opt-level = 3, debug = false }
gpui_macros = { opt-level = 3, debug = false }
taffy = { opt-level = 3, debug = false }
resvg = { opt-level = 3, debug = false }
rustybuzz = { opt-level = 3, debug = false }
ttf-parser = { opt-level = 3, debug = false }
smol = { opt-level = 3, debug = false }
tree-sitter = { opt-level = 3, debug = false }
ropey = { opt-level = 3, debug = false }
sum_tree = { opt-level = 3, debug = false }
# The remainder of gpui-component's own dev list (same rationale, same source).
lsp-types = { opt-level = 3, debug = false }
markdown = { opt-level = 3, debug = false }
xml5ever = { opt-level = 3, debug = false }
