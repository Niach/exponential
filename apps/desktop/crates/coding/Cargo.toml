[package]
name = "coding"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# EXP-1426: the single-account agent core (server-free); this crate re-exports
# the modules that moved there, so every caller keeps its old path.
eagent = { path = "../eagent" }
# eTalk: the voice, call and meeting state machines (packages/etalk/fixtures).
etalk = { path = "../etalk", default-features = false }
# §3.1 dependency direction: coding ──▶ api, terminal (never ui, never steer —
# the launcher returns the session id and the app/ui layer hands it to the
# steer publisher).
api = { path = "../api" }
# Typed issue-status snapshots for the launcher's in_progress flip (EXP-194).
domain = { path = "../domain" }
# default-features = false: this crate only needs the gpui-free terminal
# surface (SpawnSpec, login_path, the TabId/TabKind data types). EXP-773
# retired the PTY coding path, so nothing here reaches the UI half any more;
# `app`/`ui` depend on `terminal` with defaults directly, which is what keeps
# `terminal/gpui` on for the desktop.
terminal = { path = "../terminal", default-features = false }
# EXP-1196: the device's computer-use MCP server (gpui-free, tokio-free). The
# launcher mints a run's grant and wires the entry beside the team servers.
epilot = { path = "../epilot" }
# EXP-1236: the device's code-mode MCP server (scripts over the run's other
# MCP servers), wired into every run beside the team servers.
codemode = { path = "../codemode" }
# EXP-1458: sealed session content (`sealing.rs`): the seal/open primitives
# alone (no iroh node; the node lives in `steer::enet`).
enet-core = { path = "../enet-core", default-features = false }
# EXP-1458: the device MCP gateway (`mcp_gateway.rs`) builds and validates
# `exponential_show` cards before sealing them (the server can no longer see
# the surface): the SAME reducer + core catalog as the TS reference. No
# built-in themes: only the reducer is used.
eui-core = { path = "../eui-core", default-features = false }
# NEW-58: the voice device's screen memory (`get_screenshots`): the
# launcher mints the voice conversation's grant while the IDE captures.
epilot-screen = { path = "../epilot-screen" }
# EXP-1232: the managed Codex download reuses the self-updater's streaming
# `download` (no whole-request deadline, `.part` + rename).
updater = { path = "../updater" }

serde = { workspace = true }
# EXP-530: automations schedule math (latest/next occurrence in the device's
# local zone, DST-aware) — same trimmed feature set as crates/ui.
chrono = { version = "0.4.38", default-features = false, features = ["std", "clock"] }
# EXP-389: parse-check ~/.codex/config.toml before appending trust entries —
# already in the tree transitively (no new crates in the licence inventory).
toml = "0.8"
# EXP-414: bound the doctor's agent shell-outs — a wedged `claude auth status`
# must not stall the CLI daemon's probe loop (and its control channel)
# indefinitely. Already in the tree transitively.
wait-timeout = "0.2"
# Batch-run ids (`exp/batch-<id8>`) — already in the tree via the app crate.
uuid = { workspace = true }
serde_json = { workspace = true }
# EXP-1252: the handoff package of a session moving to another device.
flate2 = { workspace = true }
tar = { workspace = true }
# EXP-562: automation trigger fingerprints. std's DefaultHasher is explicitly
# NOT stable across Rust releases, and a fingerprint that shifts under the
# compiler reseeds every automation on the next build — SHA-256 pins it.
sha2 = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
# §7.5 stop semantics: SIGTERM → grace → SIGKILL (run_launch.rs) —
# portable-pty's ChildKiller only sends SIGHUP.
libc = { workspace = true }
# EXP-300: the reaper logs what it kills — the one record that explains a
# "why did my agent process disappear" report after a quit.
log = "0.4"
# EXP-781: no gpui dep and no `gpui` feature. This crate is gpui-free
# THROUGHOUT (§7.1 "gpui-free-at-its-core state machine") — the thin
# gpui-facing driver the optional dep once carried went with the PTY path
# (EXP-773), and nothing under `src/` has referenced it since.

[dev-dependencies]
# EXP-1458: the MCP gateway tests run a fake upstream on loopback and call
# the gateway over HTTP (both already in the tree via codemode).
tiny_http = { version = "0.12", default-features = false }
reqwest = { workspace = true }
