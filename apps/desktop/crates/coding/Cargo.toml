[package]
name = "coding"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# §3.1 dependency direction: coding ──▶ api, terminal (never ui, never steer —
# the launcher returns the session id and the app/ui layer hands it to the
# steer publisher).
api = { path = "../api" }
# Typed issue-status snapshots for the launcher's in_progress flip (EXP-194).
domain = { path = "../domain" }
# default-features = false: the core only needs the gpui-free terminal surface
# (SpawnSpec, login_path, the TabId/TabKind data types); the `gpui` feature
# below re-enables the UI half for the desktop's spawn_prepared* tail.
terminal = { path = "../terminal", default-features = false }

serde = { workspace = true }
# EXP-530: automations schedule math (latest/next occurrence in the device's
# local zone, DST-aware) — same trimmed feature set as crates/ui.
chrono = { version = "0.4.38", default-features = false, features = ["std", "clock"] }
# EXP-389: parse-check ~/.codex/config.toml before appending trust entries —
# already in the tree transitively (no new crates in the licence inventory).
toml = "0.8"
# EXP-414: bound the doctor's agent shell-outs — a wedged `claude auth status`
# must not stall the CLI daemon's probe loop (and its control channel)
# indefinitely. Already in the tree transitively.
wait-timeout = "0.2"
# Batch-run ids (`exp/batch-<id8>`) — already in the tree via the app crate.
uuid = { workspace = true }
serde_json = { workspace = true }
# EXP-562: automation trigger fingerprints. std's DefaultHasher is explicitly
# NOT stable across Rust releases, and a fingerprint that shifts under the
# compiler reseeds every automation on the next build — SHA-256 pins it.
sha2 = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
# §7.5 stop semantics: SIGTERM → grace → SIGKILL (run_launch.rs) —
# portable-pty's ChildKiller only sends SIGHUP.
libc = { workspace = true }
# EXP-300: the reaper logs what it kills — the one record that explains a
# "why did my agent process disappear" report after a quit.
log = "0.4"
# Only the thin gpui-facing driver (launcher::spawn_prepared) touches gpui —
# the core (git/mcp/prompt/doctor/settings + prepare_launch) is gpui-free and
# headless-testable (§7.1 "gpui-free-at-its-core state machine"). Optional
# behind the default-on `gpui` feature (EXP-403) so the headless CLI links
# the core without gpui.
gpui = { workspace = true, optional = true }

[features]
default = ["gpui"]
gpui = ["dep:gpui", "terminal/gpui"]
