[package]
name = "exponential-ui"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Exponential UI core: the A2UI reducer (core + basic catalog, macros, extensions), runtime themes with recipe resolution, taffy layout with batched measurement, overlay layers and windowed lists — the engine behind the SwiftUI, Compose and gpui painters."
repository = "https://github.com/Niach/exponential"
homepage = "https://ui.exponential.at"
documentation = "https://ui.exponential.at"
readme = "README.md"
keywords = ["a2ui", "generative-ui", "taffy", "layout", "theme"]
categories = ["gui", "rendering::engine"]
# VAPP-86: a STANDALONE, publishable crate (VAPP-91 publishes it). It depends on
# nothing from the Exponential app's crates; the app links it like a third party.
# Tests and benches read the shared fixtures from packages/exponential-ui and
# stay out of the published package.
exclude = ["tests/", "benches/", "examples/"]

[features]
default = []
# Rust-side text shaping on the system fonts (cosmic-text + fontdb): the
# prototype of the "no measure upcalls at all" path. Off by default — hosts
# measure through the batched protocol; the desktop painter measures in-process.
shaping = ["dep:cosmic-text"]

[dependencies]
# The exact version gpui pins (apps/desktop/Cargo.lock) — ONE taffy in the tree.
taffy = "=0.12.2"
serde = { version = "1", features = ["derive"] }
# `preserve_order`: JSON objects keep SOURCE order like the TS reference
# (media blocks apply in source order, tokenizer prefix tables, issue order).
# The desktop workspace already unifies it on through gpui; this makes the
# standalone crate (tests, the FFI, crates.io) behave the same.
# `float_roundtrip`: numbers parse to the nearest double like JS
# `JSON.parse` (round 2 display strings: 123456789012345680000).
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
indexmap = { version = "2", features = ["serde"] }
# VAPP-91: the host API resolves URLs exactly like JS `new URL` (WHATWG);
# the version already in apps/desktop/Cargo.lock, ONE url in the tree.
url = "2.5"
cosmic-text = { version = "0.19", optional = true }
# VAPP-103: the recursive passes (reduce, macro expansion, the layout-tree
# build, taffy's descent) grow the stack on the heap when a host thread's
# runs low (iOS secondary threads have 512 KB); the version already in
# apps/desktop/Cargo.lock.
stacker = "0.1"

[dev-dependencies]
