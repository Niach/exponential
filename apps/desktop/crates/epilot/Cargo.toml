[package]
name = "epilot"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "ePilot: computer use as a library. A loopback MCP endpoint whose tools drive the real pointer and keyboard (XTest, CGEvent, SendInput) from fitted screenshots, with the person's input locked and Esc as the abort."
repository = "https://github.com/Niach/exponential"
readme = "README.md"
keywords = ["computer-use", "mcp", "automation", "screenshot", "input"]
categories = ["accessibility", "os"]
# EXP-1425: consumed outside the monorepo as a GIT dependency on a tag
# `epilot-v<version>` (README "Consuming"), never crates.io: the specs are
# compiled in with include_str! from packages/domain-contract/fixtures, which
# a crates.io package would not carry.
publish = false

[dependencies]
# EXP-1273: computer use for coding runs, FOREGROUND only, on our own thin
# backend (`src/backend/`): the OS input APIs the person's own mouse and
# keyboard use (XTest, CGEvent, SendInput), a screenshot of the real screen,
# the person's input locked while the agent works, Esc as the abort. The
# host (IDE or `exponential` daemon) serves ONE loopback MCP endpoint whose
# tools are ours (`src/tools.rs`); no second process, no linked driver.
# gpui-free: the banner the IDE shows is the IDE's, off `set_presence_observer`.
serde = { workspace = true }
serde_json = { workspace = true }
log = "0.4"
uuid = { workspace = true }
# EXP-1492: the loopback MCP endpoint is eMCP's (rmcp's Streamable HTTP),
# through ITS release tag like every other lib (docs/libraries.md); inside
# the desktop workspace the [patch] builds the local crate.
emcp = { git = "https://github.com/Niach/exponential", tag = "emcp-v0.2.0" }
# The screenshot the agent sees: fitted to the model's frame and PNG-encoded.
# Pure Rust, already in the tree.
image = { workspace = true, features = ["png"] }

# X11 through the pure-Rust x11rb (already in the tree via gpui): no libX11
# at load time, so the Linux daemon links it too and answers "no display"
# at runtime on a server. xtest = the input, xinput = the lock (XInput2
# grabs of the person's own devices), randr = the displays.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest", "xinput", "randr"] }

# macOS: CGEvent input + CGDisplay capture + the event tap lock (all in
# core-graphics, already in the tree), the window list off
# CGWindowListCopyWindowInfo, activation through AppKit.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.24", features = ["highsierra"] }
# `ForeignType::as_ptr`, to tag the event source (CGEventSourceSetUserData).
foreign-types = "0.5"
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication", "NSScreen", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSEnumerator", "NSGeometry"] }

# Windows: SendInput + GDI capture + the low-level hooks lock, raw bindings.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[[example]]
name = "serve"
