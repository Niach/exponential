[package]
name = "chat-store-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The UniFFI facade over chat-store (#EDE-114, S3): the phones' chat store (SQLite on protected app storage), its OPEN, search, retention and the eNet catch-up walk (sans I/O: the app carries the frames). Linked into exponential-mobile-ffi."
publish = false

[lib]
name = "chat_store_ffi"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
uniffi = { version = "0.32" }
serde.workspace = true
serde_json.workspace = true

# iOS links the system SQLite (GRDB's, the same image); every other target
# compiles SQLite in (chat-store's `bundled`).
[target.'cfg(target_os = "ios")'.dependencies]
chat-store = { path = "../chat-store", default-features = false, features = ["sqlite"] }
[target.'cfg(not(target_os = "ios"))'.dependencies]
chat-store = { path = "../chat-store" }
