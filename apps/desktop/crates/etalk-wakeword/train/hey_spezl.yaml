# EXP-1424: the "Hey spezl" classifier (spezl's shipped phrase, #YO-1).
# Trained with livekit-wakeword (Apache-2.0) at the revision pinned in
# train.sh, from Piper TTS samples only: no recorded voices. "Hey Claude" is
# never trained (trademark).
model_name: hey_spezl

# Spelling variations, so Piper's English phonemizer says the Bavarian word
# the ways people do ("Schpezl", "Spetzl", "Spezzle").
target_phrases: ["hey spezl", "hey spetzl", "hey shpetzl", "hey spezzle"]

n_samples: 10000
n_samples_val: 2000
n_background_samples: 1000
n_background_samples_val: 250
tts_batch_size: 50

# Near misses that must NOT wake it.
custom_negative_phrases:
  - "spezl"
  - "spetzl"
  - "hey special"
  - "hey pretzel"
  - "hey speckle"
  - "hey spells"
  - "hey spatial"
  - "hey pestle"
  - "hey vessel"
  - "hey hazel"
  - "hey stencil"
  - "pretzel"
  - "they spell"
  - "hey spencer"

noise_scales: [0.98]
noise_scale_ws: [0.98]
length_scales: [0.75, 1.0, 1.25]
slerp_weights: [0.2, 0.35, 0.5, 0.65, 0.8]

data_dir: ./data
output_dir: ./output

augmentation:
  clip_duration: 2.0
  batch_size: 16
  rounds: 2
  background_paths: [./data/backgrounds]
  rir_paths: [./data/rirs]

model:
  model_type: conv_attention
  model_size: small

steps: 30000
learning_rate: 0.0001
weight_decay: 0.01
label_smoothing: 0.05
max_negative_weight: 3000
target_fp_per_hour: 0.2

batch_n_per_class:
  positive: 50
  adversarial_negative: 50
  ACAV100M_sample: 1024
  background_noise: 50
