# EXP-1424: the "Hey spezl" classifier (spezl's shipped phrase, #YO-1).
# Trained with livekit-wakeword (Apache-2.0) at the revision pinned in
# train.sh, from Piper TTS samples only: no recorded voices. "Hey Claude" is
# never trained (trademark).
model_name: hey_spezl

# Spelling variations, so Piper's English phonemizer says the Bavarian word
# the ways people do ("Schpezl", "Spetzl", "Spezzle").
target_phrases: ["hey spezl", "hey spetzl", "hey shpetzl", "hey spezzle"]

n_samples: 25000
n_samples_val: 5000
n_background_samples: 2000
n_background_samples_val: 500
tts_batch_size: 50

# Near misses that must NOT wake it. The generator cycles through ~1,270
# CMUdict neighbours plus this list, so one line here is ~20 of the 25,000
# negative clips (v1: 8 of 10,000, and "hey special" still woke it).
custom_negative_phrases:
  - "spezl"
  - "spetzl"
  - "hey special"
  - "hey pretzel"
  - "hey speckle"
  - "hey spells"
  - "hey spatial"
  - "hey pestle"
  - "hey vessel"
  - "hey hazel"
  - "hey stencil"
  - "pretzel"
  - "they spell"
  - "hey spencer"
  - "special"
  - "hey special one"
  - "hey special offer today"
  - "hey specially"
  - "hey specialist"
  - "they special"
  - "a special"
  - "hey pretzels"
  - "hey pretzel bread"
  - "hey pencil"
  - "hey spazzle"

# NEW-129: how often train.sh repeats a phrase in the list above (livekit-
# wakeword has no per-phrase weight; train.sh expands this key and drops it).
# 150 lines = ~8 % of the negative clips each, ~2,000 clips.
negative_weights:
  "hey special": 150
  "hey pretzel": 150
  "hey special one": 30
  "hey special offer today": 30
  "hey spatial": 30
  "they special": 30
  "special": 30
  "pretzel": 30
  "hey specially": 20
  "hey specialist": 20
  "hey pretzels": 20
  "hey pretzel bread": 20
  "a special": 20

noise_scales: [0.98]
noise_scale_ws: [0.98]
length_scales: [0.75, 1.0, 1.25]
slerp_weights: [0.2, 0.35, 0.5, 0.65, 0.8]

data_dir: ./data
output_dir: ./output

augmentation:
  clip_duration: 2.0
  batch_size: 16
  rounds: 2
  background_paths: [./data/backgrounds]
  rir_paths: [./data/rirs]

model:
  model_type: conv_attention
  model_size: medium

steps: 100000
learning_rate: 0.0001
weight_decay: 0.01
label_smoothing: 0.05
max_negative_weight: 3000
target_fp_per_hour: 0.2

batch_n_per_class:
  positive: 50
  adversarial_negative: 50
  ACAV100M_sample: 1024
  background_noise: 50
