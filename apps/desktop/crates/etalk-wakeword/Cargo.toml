[package]
name = "etalk-wakeword"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "eTalk's wake word: an openWakeWord-compatible detector in pure Rust (tract), gpui-free."
repository = "https://github.com/Niach/exponential"
readme = "README.md"

[dependencies]
# EXP-1424: eTalk's wake-word detector, gpui-free (Exponential's speech
# worker and spezl share it). openWakeWord's pipeline (melspectrogram ONNX →
# Google's speech embedding ONNX → a per-phrase classifier ONNX, the
# classifiers trained with livekit-wakeword) run by tract: pure Rust, no
# ONNX runtime linked or downloaded. The models themselves are pinned
# downloads (`models.rs`, sha256), never in the binary.
tract-onnx = "0.23"

[dev-dependencies]
# The tests and the example fetch livekit-wakeword 0.1.3's crate tarball
# (Apache-2.0: the two front-end models, `hey_livekit.onnx` and its two WAVs)
# by sha256 into the target dir.
sha2 = { workspace = true }
# The example reads its CPU time (getrusage).
libc = { workspace = true }
