[package]
name = "eui-motion-wasm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The wasm-bindgen facade over eui-motion: the web renderers' Motion player (packed f32 frames) and the server-side validator."
repository = "https://github.com/Niach/exponential"
readme = "README.md"
publish = false

[lib]
name = "eui_motion_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
eui-motion = { path = "../eui-motion", version = "0.1.0" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde_json = "1"
