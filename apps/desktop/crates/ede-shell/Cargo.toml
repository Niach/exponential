[package]
autobins = false
name = "ede-shell"
description = "Exponential Desktop's shell: genUI documents on disk drawn in wlr-layer-shell surfaces (gpui + eui-gpui), its own process next to ede-compositor"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
eui-core = { path = "../eui-core" }
eui-gpui = { path = "../eui-gpui", default-features = false }
ede-protocol = { path = "../ede-protocol" }
# The shell core both hosts share (#EDE-50): the reducer, what the documents
# bind, the gpui host (layer-shell surfaces, popups) and the factory documents.
uicore-model = { path = "../uicore-model" }
uicore-data = { path = "../uicore-data" }
uicore-gpui = { path = "../uicore-gpui" }
# #EDE-56: Local desktops (elocal), the accounts (api) and their teams (sync, no gpui).
api = { path = "../api" }
elocal = { path = "../elocal" }
eagent = { path = "../eagent" }
sync = { path = "../sync", default-features = false }
flume.workspace = true
ede-ui = { path = "../../../ede/crates/ede-ui" }
# The services data source (#EDE-13): /services/<domain> in every document.
ede-services = { path = "../../../ede/crates/ede-services" }
gpui.workspace = true
# Wayland only (#EDE-51): the shell is a layer-shell client of exponential-compositor; the
# IDE's workspace line adds `x11`, which this crate never needs (`-p ede-shell` resolves
# its own features; a `--workspace` build unifies them, which is fine).
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "wayland", "runtime_shaders"] }
gpui-component.workspace = true
gpui-component-assets.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The IDE's fonts and Lucide icons (apps/desktop/assets), embedded like crates/app/src/assets.rs does.
rust-embed = "8"
# localtime_r for the clock.
libc = "0.2"
# The switcher's thumbnails: captures as PNG data URLs.
png = "0.17"
base64 = "0.22"
# Notifications and the tray over the session bus (zbus like the IDE's voice tray; blocking calls from the main loop).
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
futures-util = { version = "0.3", default-features = false }
# ede-sealed (#EDE-17): PAM through the system libpam, opened at run time.
libloading = "0.8"
# The settings pages (#EDE-14) edit compositor.toml.
toml = "0.8"
# The theme bridge's choice for the Theme page (#EDE-19).
ede-theme = { path = "../../../ede/crates/ede-theme" }

[dev-dependencies]
tempfile = "3"

# The installed names (Exponential Desktop); the crate keeps its ede- name.
[[bin]]
name = "exponential-shell"
path = "src/main.rs"

[[bin]]
name = "exponential-sealed"
path = "src/bin/ede-sealed/main.rs"
