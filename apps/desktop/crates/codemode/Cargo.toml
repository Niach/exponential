[package]
name = "codemode"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# EXP-1507: code mode lives in eMCP (`emcp::codemode`, the `codemode`
# feature); this crate re-exports it so the coding launcher, the IDE and the
# `exponential` daemon keep their `codemode::` paths, and installs the one
# thing emcp cannot link: the contract's `expToolDisplay` rows.
emcp = { path = "../emcp", features = ["codemode"] }
domain = { path = "../domain" }

[dev-dependencies]
serde_json = { workspace = true }
