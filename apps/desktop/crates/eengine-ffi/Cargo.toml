[package]
name = "eengine-ffi"
version = "0.1.1"
edition.workspace = true
license.workspace = true
publish = false
description = "The UniFFI facade over the Engine for Swift and Kotlin: Engine and AppInstance objects over the host's providers (record store, blobs, vault, windows, capabilities, consent) as callback interfaces. Painting stays native."
repository = "https://github.com/Niach/exponential"
homepage = "https://exponential.at/sdk/apps/"
readme = "README.md"
exclude = ["tests/", "bindings/", "out/", "*.sh"]

[lib]
name = "eengine_ffi"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
# The default store is the SQLite one (an app's records on the device, no
# account). `hub` serves the capabilities to on-device agents over MCP Proxy's
# loopback hub (tokio, hyper, rmcp: the bulk of the binary). No Voice, P2P or
# eui-gen: the Engine leaves those modules out unless a host asks.
default = ["sqlite"]
cli = ["uniffi/cli"]
sqlite = ["eengine/sqlite"]
hub = ["eengine/hub", "dep:emcp"]

[dependencies]
# The same lib (tag `eengine-v*`), so a path dependency.
eengine = { path = "../eengine", default-features = false }
# genUI's record row and delta (the store's JSON), at the tag eengine names.
eui-core = { git = "https://github.com/Niach/exponential", tag = "eui-v0.19.0", default-features = false }
emcp = { git = "https://github.com/Niach/exponential", tag = "emcp-v0.2.0", optional = true }
# The version already in apps/desktop/Cargo.lock (genUI's, P2P's and Voice's facades): ONE uniffi in the tree.
uniffi = { version = "0.32" }
# #LOGS-2: spans around the FFI entry points (no subscriber = no cost).
tracing = { version = "0.1", default-features = false, features = ["std"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
