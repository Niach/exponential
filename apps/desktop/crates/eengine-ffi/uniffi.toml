[bindings.swift]
module_name = "ExponentialEngineFFI"

[bindings.kotlin]
package_name = "at.exponential.engine.ffi"
cdylib_name = "eengine_ffi"
# Binding and .so ship together (one AAR, one build-android.sh run), as in
# exponential-ui-ffi: skip the per-call checksum probes at load.
omit_checksums = true
