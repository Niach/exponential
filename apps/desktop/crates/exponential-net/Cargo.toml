[package]
name = "exponential-net"
version = "0.1.0"
edition = "2021"
# MIT OR Apache-2.0 (not the workspace's Apache-2.0): eNet is consumed by
# spezl, an MIT app; iroh itself is MIT OR Apache-2.0.
license = "MIT OR Apache-2.0"
description = "eNet: Exponential's p2p, end-to-end encrypted networking core on iroh 1.x (chat, blobs, signed gossip records, call datagrams, sealed push payloads)."
repository = "https://github.com/Niach/exponential"
readme = "README.md"
keywords = ["iroh", "p2p", "quic", "e2ee"]

[lib]
name = "exponential_net"

[features]
default = []
# The persistent blob store (redb + files) for native hosts; the default is
# the in-memory store (the only one in browsers).
fs-store = ["iroh-blobs/fs-store"]

[dependencies]
# default features OFF: no portmapper, no metrics; `tls-ring` = the rustls
# crypto provider (`presets::Minimal`), the one that also builds for wasm.
iroh = { version = "1.4", default-features = false, features = ["tls-ring"] }
iroh-gossip = { version = "0.101", default-features = false, features = ["net"] }
iroh-blobs = { version = "0.104", default-features = false }
iroh-tickets = "1"
n0-future = "0.3"
tokio = { version = "1", default-features = false, features = ["sync"] }
bytes = "1"
data-encoding = "2"
thiserror = "2"
tracing = "0.1"
# push sealing: X25519 via curve25519-dalek's Montgomery ladder (the version
# iroh-base already pulls), HKDF-SHA256, ChaCha20-Poly1305 (no `getrandom`
# feature: nonces are derived, randomness comes from getrandom below).
curve25519-dalek = "5"
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
getrandom = "0.4"

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
# The browser's crypto.getRandomValues (getrandom 0.4 needs only the feature).
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
