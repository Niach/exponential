[bindings.swift]
module_name = "ExponentialTalkFFI"

[bindings.kotlin]
package_name = "at.exponential.talk.ffi"
cdylib_name = "etalk_ffi"
# Binding and .so ship together (one AAR, one build-android.sh run), as in
# exponential-ui-ffi: skip the per-call checksum probes at load.
omit_checksums = true
# The binding ships to Android (minSdk 26): pick the cleaner by SDK_INT
# (java.lang.ref.Cleaner is API 33+, JNA's below) instead of probing for the
# class, which lint refuses as NewApi (#VAPP-291, as eNet and the Engine). The
# host Kotlin suite compiles against tests/kotlin/android-stubs (run-binding-tests.sh).
android = true
android_cleaner = true
