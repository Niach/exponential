[bindings.swift]
module_name = "ExponentialNetFFI"

[bindings.kotlin]
package_name = "at.exponential.net.ffi"
cdylib_name = "exponential_net_ffi"
# Binding and .so ship together (one AAR, one build-android.sh run), as in
# exponential-ui-ffi: skip the per-call checksum probes at load.
omit_checksums = true
# The binding only ships in the Android app (minSdk 26): pick the cleaner by
# SDK_INT (java.lang.ref.Cleaner is API 33+, JNA's below) instead of probing
# for the class, which lint refuses as NewApi.
android = true
android_cleaner = true
