# #EXP-2174 / #EXP-2194: the CI runner (`ci_job` device commands), shared by
# the headless daemon (crates/cli) and the desktop app (crates/ui). It owns the
# job's process: a systemd user scope per step (memory cap, lowest CPU weight,
# idle scheduling), the Linux namespace sandbox that hides the app's data
# directory from a job (#EXP-2181), pause while a game or full-screen app runs,
# and the drain a ready update waits on (#EXP-2144).
[package]
name = "ci-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
api = { path = "../api" }
ecode = { path = "../ecode", default-features = false, features = ["exponential", "runner"] }
serde = { workspace = true }
serde_json = { workspace = true }
libc = { workspace = true }
log = "0.4"
dirs = { workspace = true }

# The full-screen probe reads EWMH properties over the pure-Rust x11rb (already
# in the tree via gpui).
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

# Only the sandbox test runs this helper (the app and the daemon re-enter their
# own executable with `__ci-sandbox`).
[[bin]]
name = "ci-sandbox-helper"
path = "src/bin/ci-sandbox-helper.rs"
test = false
doc = false
