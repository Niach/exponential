[package]
name = "domain"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# #EDE-65 lane O: `chat_document` shapes the shared chat model's rows (serde only, no gpui).
uicore-model = { path = "../uicore-model" }
# VAPP-261: the Engine owns O1's outbox now; `app_records` re-exports it.
eengine = { path = "../eengine" }
serde.workspace = true
# VAPP-120: `preserve_order`: an action's args render in the GIVEN key order
# (`app_actions::action_consent`, like the TS reference's JSON.stringify).
serde_json = { workspace = true, features = ["preserve_order"] }
# EXP-825: the image-message embed/marker patterns (moved here from steer).
regex = "1"
# NEW-53: `voice::parse_instant` (the shapes' `created_at` in both Postgres and
# RFC 3339 spellings); same version + features as crates/ui.
chrono = { version = "0.4.38", default-features = false, features = ["std", "clock"] }
# VAPP-110: `apps::slugify` strips diacritics (NFKD), like the TS reference.
unicode-normalization = "0.1"
# VAPP-201: the team time zone (`team_zone`): the IANA tz database, BUNDLED
# on every OS (a Linux zoneinfo may lack the backward aliases such as
# Asia/Calcutta that contract `timeZones.names` uses), so every desktop
# resolves the same names as web, iOS and Android.
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }

