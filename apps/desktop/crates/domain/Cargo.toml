[package]
name = "domain"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
# VAPP-120: `preserve_order`: an action's args render in the GIVEN key order
# (`app_actions::action_consent`, like the TS reference's JSON.stringify).
serde_json = { workspace = true, features = ["preserve_order"] }
# EXP-825: the image-message embed/marker patterns (moved here from steer).
regex = "1"
# NEW-53: `voice::parse_instant` (the shapes' `created_at` in both Postgres and
# RFC 3339 spellings); same version + features as crates/ui.
chrono = { version = "0.4.38", default-features = false, features = ["std", "clock"] }
# VAPP-110: `apps::slugify` strips diacritics (NFKD), like the TS reference.
unicode-normalization = "0.1"

[dev-dependencies]
# VAPP-161: `sourceCases` parse their source with the SDK's own parser.
eui-core = { path = "../eui-core" }
