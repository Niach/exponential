[package]
name = "sync"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
domain = { path = "../domain" }
# For `api::http::shared()` — the ONE HTTP client the whole app uses (EXP-304),
# so shape long-polls and tRPC share a single HTTP/2 connection per host. `api`
# is the gpui-free plain-types crate and does not depend on `sync`, so this edge
# is acyclic.
api = { path = "../api" }
# gpui is allowed ONLY in src/collections.rs and the gpui half of
# src/kill_watch.rs — the thin reactive seam (§3.1: "Only sync::collections
# links gpui"). protocol/client/store/manager (Phase 2) stay gpui-free and
# headless-testable. Optional behind the default-on `gpui` feature (EXP-530)
# so the headless CLI daemon links the engine without gpui.
gpui = { workspace = true, optional = true }
# Phase-2 engine deps (masterplan-v3 §5.1) — all gpui-free.
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
# Blocking HTTP over rustls for the per-shape long-poll loops (§5.3) — no
# async runtime under gpui's executor, and no HTTP cache layer, ever (§5.6a).
reqwest.workspace = true
# The outward ShapeDelta change-notification channel (§5.8) — the collections
# layer drains it on one foreground task.
flume.workspace = true
log = "0.4"

[features]
default = ["gpui"]
gpui = ["dep:gpui"]
