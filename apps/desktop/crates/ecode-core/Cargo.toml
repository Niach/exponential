[package]
name = "ecode-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "eCode's pure core (#EXP-1613): the forge's PR-tree model, checks, the pipeline file, runner scheduling and remotes, a port of packages/ecode's TypeScript reference replaying the same fixtures."
repository = "https://github.com/Niach/exponential"
readme = "README.md"
publish = false

# THE RULE (gated by `tests/dependency_gate.rs`): serde and serde_json only.
# No I/O, no clock, no async, no Exponential crate: Rerusted (#RUST-9) links
# this crate as is.
[dependencies]
serde = { workspace = true }
# `preserve_order`: a pipeline file's objects iterate in SOURCE key order,
# like the TS reference's `Object.entries`.
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
toml = "0.8"
