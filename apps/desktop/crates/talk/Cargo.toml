[package]
name = "talk"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# NEW-53: exponentialTalk's public API and the speech worker's wire. The host
# (the IDE) re-runs its own executable as `<exe> __speech-worker` and talks
# JSON lines over the child's stdio (the `crates/codemode` worker pattern);
# the engines (`crates/voice`) live only in that child, so an ONNX crash or
# a stuck audio device never takes the IDE with it. gpui-free, engine-free.
serde = { workspace = true }
serde_json = { workspace = true }
log = "0.4"
# NEW-55: call audio crosses the JSON-lines wire as base64 of i16 LE PCM.
base64 = "0.22"

# NEW-78: the microphone doctor probe (`src/microphone.rs`): AVCaptureDevice's
# audio authorization + default input device through raw objc2 messages (the
# AVFoundation framework is linked in the module), the async access request
# through a block.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
block2 = "0.6"
# NEW-57: per-app desktop audio (`src/apps/macos.rs`): Core Audio process
# taps + an aggregate device per app. The macOS 14.2 tap functions are looked
# up at run time (the IDE installs on 13.0); these are already in the tree.
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFDictionary"] }

# NEW-78: Windows has no microphone permission to ask for; cpal's default
# input device is the probe (cpal is already in the tree via crates/voice).
[target.'cfg(target_os = "windows")'.dependencies]
cpal = "0.16"
# NEW-57: per-app desktop audio (`src/apps/windows.rs`): WASAPI process
# loopback (ActivateAudioInterfaceAsync + PROCESS_LOOPBACK, build 20348+),
# the audio session enumerator for the live apps, plain WASAPI loopback of
# the default render device below that. windows 0.61 = windows-capture's pin
# (already in the lock); windows-core for the completion handler's
# `#[implement]`.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Wdk_System_SystemServices",
] }
windows-core = "0.61"

# NEW-57: per-app desktop audio on Linux (`src/apps/linux.rs`): PipeWire app
# nodes. pipewire 0.9 = the screen crate's / ashpd's pin (MIT); it links
# libpipewire-0.3 (CI installs libpipewire-0.3-dev). Behind the `pipewire`
# feature (default on: only the IDE executable links `talk`, and it loads
# libpipewire through gpui anyway); off = PulseAudio's monitor via `parec`.
[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.9", optional = true }

[features]
default = ["pipewire"]
# Linux per-app capture through PipeWire (a load-time libpipewire link).
pipewire = ["dep:pipewire"]
