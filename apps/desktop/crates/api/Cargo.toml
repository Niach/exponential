[package]
name = "api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Staging/dev channel: moves the app data dir aside (`exponential-staging` /
# `at.exponential.staging`) so staging and production builds never share
# accounts.json, sync state, or the single-instance socket.
staging = []

[dependencies]
domain = { path = "../domain" }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true }
flume = { workspace = true }
open = { workspace = true }
dirs = { workspace = true }
# §7.7 stable per-install deviceId (a UUID in the local config — steer
# presence) + the PKCE verifier's random halves (login.rs).
uuid = { workspace = true }
# PKCE S256 challenge for the OAuth deep-link code exchange (REV-13).
sha2 = { workspace = true }

# NOTE (locked decision 2026-07-03): secrets are ALWAYS file-based (0600/0700,
# see token_store.rs) — never the OS keyring. The keyring crate was removed:
# its macOS Keychain backend re-prompts on every rebuild of an unsigned dev
# binary, and Secret Service is absent on headless Linux anyway.
