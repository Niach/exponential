[package]
name = "observability"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "tracing", "logs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
log = "0.4"
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true

[dev-dependencies]
# The tunnel test builds its own reqwest client.
exp-http = { path = "../exp-http" }
