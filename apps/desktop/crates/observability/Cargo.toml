[package]
name = "observability"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "tracing", "logs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
log = "0.4"
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
libc.workspace = true
# #ERR-12: native crashes (signals, aborts, SEH) as events on the next launch.
crash-monitor = { path = "../crash-monitor" }
# #EXP-2091: the thread stacks of a process that stopped, without the logger.
stall-watch = { path = "../stall-watch" }

[dev-dependencies]
# The tunnel test builds its own reqwest client.
exp-http = { path = "../exp-http" }

# #ERR-29: a helper process (the speech worker) really crashes: its own `main`.
[[test]]
name = "helper_crash"
harness = false
