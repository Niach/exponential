[package]
name = "exponential-ui-gpui"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Exponential UI gpui painter: paints the core catalog from exponential-ui's resolved frames and visuals as absolute gpui elements (overlays, windowed lists, extension painters, the generic glass controls)."
repository = "https://github.com/Niach/exponential"
homepage = "https://ui.exponential.at"
readme = "README.md"
keywords = ["a2ui", "gpui", "generative-ui"]
# VAPP-90: the desktop painter. It depends on the core and on gpui (plus
# gpui-component where it already paints a control the catalog uses) and on
# NOTHING from the Exponential app's crates (`ui`, `theme`, `domain`, …): the
# IDE links it like a third party and installs its own `Chrome`.
publish = false

[dependencies]
exponential-ui = { path = "../exponential-ui", version = "0.1.0" }
gpui.workspace = true
gpui-component.workspace = true
serde.workspace = true
serde_json.workspace = true
# CSS-aligned break opportunities (UAX #14) for min-content and the
# painter's own line wrapping; already in the lock via cosmic-text.
unicode-linebreak = "0.1.5"

[dev-dependencies]
# `#[gpui::test]` needs test-support; it only widens the TEST build's gpui
# variant (same package id — a compile-time cost, not an identity split).
gpui = { workspace = true, features = ["test-support"] }
# `examples/kitchen_sink.rs` (a real window: the platform backend and
# gpui-component's icon assets, the same crates the IDE links).
gpui_platform.workspace = true
gpui-component-assets.workspace = true

# The conformance harness (packages/exponential-ui/conformance): the painter's
# frames under gpui's REAL Linux text system (cosmic-text), headless, loaded
# with ONLY the conformance font files (no system fonts) so the dump is
# deterministic. Already in the lock (gpui_linux's text system).
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dev-dependencies]
gpui_wgpu = { git = "https://github.com/zed-industries/zed" }

[[example]]
name = "conformance_dump"
path = "examples/conformance_dump.rs"

