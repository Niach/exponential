[package]
name = "steer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# NEW-88: code the call's Opus with the system libopus instead of `opus-rs`
# (`cargo build -p app --features steer/libopus`; needs libopus-dev).
libopus = ["etalk-codec/libopus"]

[dependencies]
# eTalk: the voice, call and meeting state machines (packages/etalk/fixtures).
etalk = { path = "../etalk", default-features = false }
# default-features = false (EXP-403): steer only reads the gpui-free emulator
# surface (TermHandle/screen_lines) — this keeps the crate linkable from the
# headless CLI. The desktop re-enables terminal's gpui half via ui/app.
terminal = { path = "../terminal", default-features = false }
api = { path = "../api" }
# EXP-761: the ONE claude transcript locator (`coding::locate_claude_transcript`)
# — the resume probe and the engine's replay resolve the same file. §3.1:
# coding never depends on steer; steer depending on coding is the direction
# that stays a DAG. (EXP-781 retired coding's `gpui` feature — the crate is
# gpui-free throughout now, so there is nothing left to opt out of.)
coding = { path = "../coding" }
# EXP-724: the generated steer-command catalog (contract.generated.rs) —
# gpui-free, so the headless CLI links it too.
domain = { path = "../domain" }
# EXP-1426: the event vocabulary (frames, activity caps, the redactor,
# workflow) and the login-screen scrapers live in the server-free agent core; the old module paths
# re-export it.
exponential-agent-runtime = { path = "../exponential-agent-runtime" }
# The ONLY tokio in the desktop workspace (§3.5/§8): tokio-tungstenite needs a
# reactor, and it runs on its own runtime, isolated from gpui's executors and
# from the blocking reqwest sync/tRPC stack.
tokio = { workspace = true }
# rustls-tls-native-roots: `connect_async` handles BOTH `ws://` (LAN
# self-host, plain TCP) and `wss://` (cloud TLS) by URL scheme — never force
# TLS (§8.7).
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
flume = { workspace = true }
uuid = { workspace = true }
log = "0.4"
# EXP-1457: every install runs one eNet node (`enet.rs`); fs-store off, the
# in-memory blob store is enough until blobs carry anything.
enet-core = { path = "../enet-core" }
data-encoding = "2"
# NEW-55: the call host's audio: Opus in pure Rust (a port of libopus 1.6,
# BSD-3), so no cmake on any runner. NEW-88: behind `etalk-codec`, whose
# `libopus` feature (forwarded below) swaps in the system libopus.
etalk-codec = { path = "../etalk-codec" }
# Secret-redaction patterns for the public activity emitter (§P7). Already in
# the workspace lock via transitive deps — adds no new build.
regex = "1"

[dev-dependencies]
# EXP-1457: verifies the install-register signature independently of enet-core.
ring = "0.17"
