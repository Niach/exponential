[package]
name = "etalk-engine"
version = "0.2.0"
edition.workspace = true
license.workspace = true
publish = false
description = "eTalk's engines, run only inside the speech worker: Silero VAD, Parakeet and Qwen3-TTS through CrispASR, echo cancelling, playback, the wake word."
repository = "https://github.com/Niach/exponential"
readme = "../etalk/README.md"

[dependencies]
# NEW-53: exponentialTalk's engines, run ONLY inside the speech worker
# (`<exe> __speech-worker`, see crates/etalk). NEW-74: the speaker is
# Qwen3-TTS 0.6B Base through CrispASR (`crates/etalk-crispasr`: the pinned prebuilt
# runtime and models, sha256-verified, loaded at runtime; nothing linked),
# on the GPU only, plus playback.
etalk = { path = "../etalk" }
etalk-crispasr = { path = "../etalk-crispasr" }
# EXP-1424: the wake word's model detector (tract, pure Rust) for phrases
# with a published model; the files are pinned downloads like the others.
etalk-wakeword = { path = "../etalk-wakeword" }
serde_json = { workspace = true }
log = "0.4"
# NEW-55: the echo canceller of LOCAL calls (the voice device's own microphone
# with its speakers): pure Rust (Apache-2.0), so no cmake, libclang or
# system library on any runner.
decibri-aec = "=0.2.0"

# Playback: Linux pipes PCM into the session's PipeWire/PulseAudio player
# (`pw-play`, else `paplay`), so the build needs no ALSA headers; macOS and
# Windows drive the default output device through cpal (CoreAudio, WASAPI).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
cpal = "0.16"

# #NEW-92: a local call's player gets a one-page pipe (`F_SETPIPE_SZ`), so
# the stream is paced by the player and a stop plays out at most 43 ms.
[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
# EXP-1424: the wake tests fetch livekit-wakeword's test model by sha256
# (crates/etalk-wakeword/tests/common).
sha2 = { workspace = true }
# NEW-55: the `call_latency` example times the call's Opus frames (NEW-88:
# through `etalk-codec`, so `--features etalk-codec/libopus` times libopus).
etalk-codec = { path = "../etalk-codec" }
