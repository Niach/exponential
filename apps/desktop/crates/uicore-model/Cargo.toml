[package]
name = "uicore-model"
description = "The pure shell reducer the IDE and Exponential Desktop both host (ide = shell + uicore, ede = compositor + uicore, #EDE-50): rail, sidebar sections, the desktop/team switcher, windows and the MRU, the Mint-style taskbar, the start menu, the chat toggle and Alt-Tab, replaying packages/uicore/fixtures/shell.json"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
