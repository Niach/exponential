[package]
name = "updater"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
reqwest.workspace = true
# Every reqwest client is built through it (the crypto provider first).
exp-http = { path = "../exp-http" }
dirs.workspace = true
log = "0.4"
# The instance advert (`/api/version`, EXP-1761).
serde_json.workspace = true
# Streaming digest for SHA256SUMS.txt verification — already in the tree
# transitively (rustls ecosystem), so this adds no new tree weight.
sha2 = "0.10"
# Ed25519 (minisign) signature over SHA256SUMS.txt — pure Rust, MIT, no deps.
minisign-verify = "0.3"

[target.'cfg(windows)'.dependencies]
# The rustup/uv-proven locked-exe swap: rename the running exe aside, move the
# new one into place, schedule the leftover for deletion.
self-replace = "1"

[dev-dependencies]
tempfile = "3"
