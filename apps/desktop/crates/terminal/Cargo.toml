[package]
name = "terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# §6.1 / EXP-636: the emulator is rio-vt (MIT) — Crosswords/Grid/parser +
# the sixel/kitty/iTerm2 graphics store, with its `pty` feature OFF (we own
# the PTY master below; rio's Machine/teletypewriter would consume the raw
# bytes). Never Zed's GPL terminal crates.
rio-vt = { workspace = true }
# The graphics value types (`GraphicData`, `ColorType`, texture keys) live in
# rio's separate leaf crate; rio-vt does not re-export them.
rio-graphics = { workspace = true }
# MIT — we own the PTY master (openpty/spawn/reader/writer/resize).
portable-pty = { workspace = true }
flume = { workspace = true }
anyhow = { workspace = true }
log = "0.4"

# The gpui glue (§6.2): element.rs (the grid Element + TerminalView) plus
# keys.rs/mouse.rs (gpui Keystroke / mouse-event / Hsla types only — no
# Window needed, so they stay unit-testable in isolation). Terminal colors
# come from the theme crate's terminal palette (§6.8). gpui-component is
# deliberately NOT a dependency — nothing in the grid element needs it
# (tab.rs/manager.rs may add it in the next P4 step).
# Optional behind the default-on `gpui` feature (EXP-403): the headless CLI
# consumes only the core pty/emulator/read_loop/session surface.
gpui = { workspace = true, optional = true }
theme = { path = "../theme", optional = true }
# Inline-image frames (`RenderImage`) — paint-side only, so gpui-gated.
image = { workspace = true, optional = true }

[features]
default = ["gpui"]
gpui = ["dep:gpui", "dep:theme", "dep:image"]

[dev-dependencies]
# tests/exit_hook.rs only: a real (headless) gpui platform to drive the
# manager's on_exit hook end-to-end. Already in the build graph via the app
# crate — adds no new tree weight.
gpui_platform = { workspace = true }

# §6.7 exit-hook e2e (Phase-4 gate). harness = false: gpui's platform run
# loop must own the PROCESS MAIN THREAD (libtest always runs #[test] fns on
# worker threads, where the macOS main-queue dispatcher never drains). The
# binary self-skips unless EXP_EXIT_HOOK_E2E=1, so plain `cargo test` stays
# green and fast.
[[test]]
name = "exit_hook"
harness = false
required-features = ["gpui"]
