[package]
name = "eagent-hub-core-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The wasm-bindgen facade over eagent-hub-core (#EXP-1509): eAgent's orchestration reducer for JavaScript hosts, JSON in, JSON out."
repository = "https://github.com/Niach/exponential"
readme = "README.md"
publish = false

[lib]
name = "eagent_hub_core_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
eagent-hub-core = { path = "../eagent-hub-core" }
wasm-bindgen = "0.2"
