[package]
name = "ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Staging/dev channel: "Exponential Cloud" targets next.exponential.at instead
# of app.exponential.at (see login.rs `CLOUD_INSTANCE`), and the app data dir
# moves aside so channels never share saved accounts (api/staging).
staging = ["api/staging"]

[dependencies]
theme = { path = "../theme" }
domain = { path = "../domain" }
sync = { path = "../sync" }
api = { path = "../api" }
terminal = { path = "../terminal" }
coding = { path = "../coding" }
# NEW-58: the IDE turns on the Linux ScreenCast portal + PipeWire capturer
# (the CLI daemon, which links `screen` through `coding`, never does).
screen = { path = "../screen", features = ["portal"] }
steer = { path = "../steer" }
# NEW-53: the speech worker's host side (Speak replies, crates/talk).
talk = { path = "../talk" }
# EXP-746: the ACP session engine — `Screen::Session` drives an `EngineSession`
# instead of a PTY tab whenever the launch resolves to the Acp transport.
engine = { path = "../engine" }
# §08 steer wiring: foreground-marshal channels between the steer tokio runtime
# and the gpui foreground (control-channel start_session inbox + per-session
# publisher UI events).
flume = { workspace = true }
gpui.workspace = true
# §7.8 diff view: the `highlighter` resolves Tree-sitter grammars by name —
# the `tree-sitter-languages` feature that bundles them is declared on the
# WORKSPACE dependency (EXP-76: a feature requested here alone made per-crate
# selections build a second, featureless gpui-component variant).
gpui-component.workspace = true
# EXP-521: direct dep for the window-level TextSelection layer types (see the
# workspace Cargo.toml note) — MarkdownView is a selection participant.
gpui-base.workspace = true
# Same ropey the pinned gpui-component uses (its `SyntaxHighlighter::update`
# takes `&ropey::Rope`; two ropey majors in the tree would not unify).
ropey = "2.0.0-beta.1"
# VAPP-107: the Exponential UI host opts its own instance origin back into
# the private-host rule only when that origin is private (the version the
# core pins, ONE url in the tree).
url = "2.5"
# EXP-285: header-only image dimension probe — sizes pasted/dimension-less
# editor images so gpui's `img` never letterboxes them (already in the tree
# transitively via gpui).
imagesize = "0.13"
# NEW-68 voice_tray: the app icon rasterized for the tray (gpui's own SVG
# renderer at its version, already in the tree on every platform).
resvg = { version = "0.45", default-features = false }
# EXP-1128: decode a picture over the GPU texture cap (a >16k px full-page
# screenshot) and cut it into strips — see tall_image.rs. Already in the tree
# via gpui; default features stay off, only the accepted formats.
image = { workspace = true, features = ["png", "jpeg", "webp", "gif", "bmp"] }
# §4.7 ExpIcon: icon_named!(ExpIcon, "../../assets/icons") — the project-local
# Lucide set (status circles, priority signal bars, …).
gpui-component-macros.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
# §4.2 detail: due-date/recurrence calendars + relative times. Same 0.4 line
# as the pinned gpui-component's own `calendar` module, so `NaiveDate` unifies
# across the CalendarState event boundary.
chrono = { version = "0.4.38", default-features = false, features = ["std", "clock"] }
anyhow.workspace = true
dirs.workspace = true
log = "0.4"
# EXP-295 session_registry: `kill(pid, 0)` liveness probe — the startup
# reconcile must not end sessions a SECOND live instance on this machine still
# owns (an agent testing the app off a copied data dir).
libc = { workspace = true }
# EXP-22 self-update engine (download/verify/swap); ui owns the state machine
# and banner on top of it.
updater = { path = "../updater" }
comrak = { version = "0.53.0", default-features = false }
# EXP-369: the device's IANA zone for the account timezone claim (the daily
# digest's send hour is read in it) — already in the tree transitively.
iana-time-zone = "0.1"
reqwest.workspace = true
# EXP-261: the vendored Velotype WYSIWYG editor core (see its NOTICE for
# provenance) — the issue-description editing surface; the block editor above
# stays for the comment composer.
gpui-markdown-editor = { path = "../gpui-markdown-editor" }
# VAPP-90: the Exponential UI SDK — the core (reducer, themes, taffy frames)
# and its gpui painter. The IDE links them like a third party: the generic
# glass controls live in the painter crate now (`controls`, `chrome`), the
# kitchen-sink dev screen paints the core catalog through `SurfaceView`.
exponential-ui = { path = "../exponential-ui" }
exponential-ui-gpui = { path = "../exponential-ui-gpui" }

[dev-dependencies]
# markdown/image_paste.rs one-shot HTTP fixture server.
flume.workspace = true
# update.rs end-to-end fixture: digest the fake release asset for SHA256SUMS.
sha2 = "0.10"
# EXP-261 wysiwyg_parity.rs: the vendored editor's parse→serialize must pass
# the same CONTRACT_FIXTURES as the block editor. test-support is required by
# #[gpui::test]; it only widens the TEST build's gpui variant (same package
# id — a compile-time cost, not an identity split).
gpui = { workspace = true, features = ["test-support"] }

# EXP-303 macos_blur: objc-runtime insertion of a working frosted backdrop
# (NSGlassEffectView / NSVisualEffectView) into gpui's Blurred windows —
# gpui's own BlurredView renders no backdrop on current macOS. Both crates
# are already in the tree transitively (gpui pins objc 0.2 / cocoa 0.26).
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
cocoa = "0.26"
# EXP-716 macos_window: top-anchored window resize for the content-sized
# search palette (gpui's `resize` is `setContentSize:`, bottom-anchored).
# raw-window-handle is gpui's own window-handle vocabulary — no new weight.
raw-window-handle = "0.6"

# EXP-450 x11_dialog_type: restamp `_NET_WM_WINDOW_TYPE` on a resizable dialog
# so the WM stops treating our `WM_TRANSIENT_FOR` window as an unmaximizable
# DIALOG. Both crates are already in the tree at these exact versions via gpui
# itself (x11rb through gpui_linux's X11 backend, raw-window-handle as gpui's
# own window-handle vocabulary), so this adds no new weight.
[target.'cfg(target_os = "linux")'.dependencies]
# NEW-54 push_to_talk: the push-to-talk grab (XGrabKey/XGrabButton, XKB's
# detectable auto-repeat) and the RandR monitor under the pointer; both
# features are gpui's own x11rb set already.
x11rb = { version = "0.13", features = ["xkb", "randr"] }
raw-window-handle = "0.6"
# NEW-68 voice_tray/linux.rs: our own StatusNotifierItem + dbusmenu over
# D-Bus, no GTK. zbus 5 on async-io is already in the tree (ashpd, accesskit);
# not `ksni`, whose Unlicense is deliberately off deny.toml's allow-list.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# NEW-54 push_to_talk/hotkey.rs: the xdg GlobalShortcuts portal on Wayland.
# ashpd 0.13 on async-io is already in the tree (gpui's file chooser and
# notifications); this adds only its `global_shortcuts` portal module.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts"] }
async-io = "2"
futures-util.workspace = true

# NEW-68 voice_tray: the native tray on macOS and Windows (muda = its menus).
# No default features: those only pull libappindicator/GTK on Linux, which
# has its own StatusNotifierItem over zbus above (voice_tray/linux.rs).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }
# NEW-54 push_to_talk/hotkey.rs: the push-to-talk shortcut, press AND
# release (Carbon hot keys; RegisterHotKey + release polling). MIT/Apache.
global-hotkey = "0.9"

# NEW-54 push_to_talk: the side buttons through a low-level mouse hook and
# the pointer's position (windows-sys 0.59 is already in the tree).
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
