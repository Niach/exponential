[package]
name = "eui-motion"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Exponential UI Motion: samples Lottie animations into a flat display list every eUI painter replays (gpui, SwiftUI, Compose, Canvas2D), with a tiny-skia reference raster."
repository = "https://github.com/Niach/exponential"
homepage = "https://exponential.at/ui/"
readme = "README.md"
keywords = ["lottie", "animation", "a2ui", "vector-graphics"]
categories = ["rendering", "graphics"]
# EXP-1584: standalone like eui-core; depends on nothing from the app's crates.
exclude = ["tests/", "examples/"]

[features]
default = []
# The tiny-skia reference raster: the gpui painter, the conformance
# reference, GIF previews. Off in the WASM and FFI builds.
raster = ["dep:tiny-skia", "dep:image", "dep:base64"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# Glyph outlines for text layers without `chars` (the version already in
# apps/desktop/Cargo.lock via fontdb; no_std-capable, small in WASM).
ttf-parser = { version = "0.25", default-features = false, features = ["std", "opentype-layout", "glyph-names"] }
tiny-skia = { version = "0.11.4", optional = true }
# `raster`: decodes image assets (data URLs, files) for the reference painter.
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "webp"] }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
serde_json = "1"

[[example]]
name = "spike"
required-features = ["raster"]
