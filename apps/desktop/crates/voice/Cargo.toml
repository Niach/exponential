[package]
name = "voice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# NEW-53: exponentialTalk's engines, run ONLY inside the speech worker
# (`<exe> __speech-worker`, see crates/talk). NEW-74: the speaker is
# Qwen3-TTS 0.6B Base through CrispASR (`crates/crispasr`: the pinned prebuilt
# runtime and models, sha256-verified, loaded at runtime; nothing linked),
# on the GPU only, plus playback.
talk = { path = "../talk" }
crispasr = { path = "../crispasr" }
serde_json = { workspace = true }
log = "0.4"
# NEW-55: the echo canceller of LOCAL calls (the voice device's own microphone
# with its speakers): pure Rust (Apache-2.0), so no cmake, libclang or
# system library on any runner.
decibri-aec = "=0.2.0"

# Playback: Linux pipes PCM into the session's PipeWire/PulseAudio player
# (`pw-play`, else `paplay`), so the build needs no ALSA headers; macOS and
# Windows drive the default output device through cpal (CoreAudio, WASAPI).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
cpal = "0.16"

[dev-dependencies]
# NEW-55: the `call_latency` example times the call's Opus frames (NEW-88:
# through `call-codec`, so `--features call-codec/libopus` times libopus).
call-codec = { path = "../call-codec" }
