[package]
name = "eagent-hub-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "eAgent's orchestration reducer (#EXP-1509): the session tree, the bus, wake-ups, reports, caps and the watchdog as one pure function, a port of packages/eagent's TypeScript reference replaying the same fixtures."
repository = "https://github.com/Niach/exponential"
readme = "README.md"
publish = false

# THE RULE (gated by `tests/dependency_gate.rs`): eCore, serde and serde_json
# only. No I/O, no clock, no async: the envelope's `at` is now.
[dependencies]
ecore = { path = "../ecore" }
serde = { workspace = true }
# `preserve_order`: a trigger's payload renders in its SOURCE key order, like
# the TS reference's `JSON.stringify`.
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
toml = "0.8"
