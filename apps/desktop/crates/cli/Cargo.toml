# The headless `exponential` CLI (EXP-403): login, doctor, one-shot coding
# sessions/action runs, and the registered-device daemon — sharing the
# desktop's crates with terminal/coding built WITHOUT their gpui halves
# (the default-on `gpui` feature stays off here). Ships as its own
# `cli-v*` release asset; NEVER bundled inside desktop artifacts.
[package]
name = "exp-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "exponential"
path = "src/main.rs"

[dependencies]
api = { path = "../api" }
domain = { path = "../domain" }
coding = { path = "../coding", default-features = false }
steer = { path = "../steer" }
# EXP-530: the daemon's own Electric pipeline (a 6-shape subset into
# `sync-cli.sqlite`) — engine only, the gpui collections seam stays off.
sync = { path = "../sync", default-features = false }
terminal = { path = "../terminal", default-features = false }
updater = { path = "../updater" }

anyhow = { workspace = true }
# EXP-530: the automation host's local clock (schedule occurrences are
# wall-clock, device time) + tolerant ISO timestamp parsing. Same pin as
# `crates/ui` / `crates/coding`.
chrono = { version = "0.4.38", default-features = false, features = ["std", "clock"] }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
flume = { workspace = true }
open = { workspace = true }
uuid = { workspace = true }
# Raw-mode termios for the interactive PTY attach + signal handling + the
# registry's pid liveness probe (kill(pid, 0)) — already in the tree.
libc = { workspace = true }
log = "0.4"
