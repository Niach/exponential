[package]
name = "uicore-docs"
description = "The factory genUI documents of the shell both hosts draw (#EDE-50): apps/ede/ui/*.express compiled in, parsed and checked, so Exponential Desktop installs them and the IDE can embed them"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
# #LOGS-2: lag spans (no subscriber = no cost).
tracing = "0.1"
serde_json = "1"
# #EDE-216: the documents are Express; ede-ui compiles them to their JSON form.
ede-ui = { path = "../../../ede/crates/ede-ui", default-features = false }

[dev-dependencies]
eui-core = { path = "../eui-core" }
