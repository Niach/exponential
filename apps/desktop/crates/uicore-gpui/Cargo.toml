[package]
name = "uicore-gpui"
description = "The shell's gpui host (#EDE-50): the ShellHost trait with an Exponential Desktop implementation (one wlr-layer-shell surface per region, popup documents and hosted Popover/Menu layers as xdg_popups) and a windowed one (normal windows: --windowed, macOS); documents mounted inline in a host window (the IDE); the surface windows eui-gpui paints the documents in, fed from uicore-data"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
eui-core = { path = "../eui-core" }
eui-gpui = { path = "../eui-gpui", default-features = false, features = ["overlay-anchor", "vendored-spinner"] }
ede-ui = { path = "../../../ede/crates/ede-ui" }
uicore-data = { path = "../uicore-data" }
uicore-docs = { path = "../uicore-docs" }
# #EDE-65: the rail glyphs' tokens and the Claude mark's brand colour, as the IDE paints them.
theme = { path = "../theme" }
gpui.workspace = true
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
gpui-component.workspace = true
image = { workspace = true, features = ["png"] }
rust-embed = "8"
