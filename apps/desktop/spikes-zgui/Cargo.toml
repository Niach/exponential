# gpui → zgui spike: its OWN workspace (never a member of apps/desktop/Cargo.toml).
[workspace]
resolver = "3"
members = ["."]

[package]
name = "zgui-spike"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[[bin]]
name = "zspike"
path = "src/main.rs"

[dependencies]
# zortax/zgui pinned (Apache-2.0).
zgui = { git = "https://github.com/zortax/zgui", rev = "ee29c7dc66206eb04ba7bcf514058a278c9070ba" }
zgui-ui = { git = "https://github.com/zortax/zgui", rev = "ee29c7dc66206eb04ba7bcf514058a278c9070ba" }
zgui-platform-headless = { git = "https://github.com/zortax/zgui", rev = "ee29c7dc66206eb04ba7bcf514058a278c9070ba" }
zgui-layout = { git = "https://github.com/zortax/zgui", rev = "ee29c7dc66206eb04ba7bcf514058a278c9070ba" }
zgui-render-wgpu = { git = "https://github.com/zortax/zgui", rev = "ee29c7dc66206eb04ba7bcf514058a278c9070ba" }
serde_json = "1"

[profile.release]
debug = false
