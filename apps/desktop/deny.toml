# cargo-deny config (EXP-222) — license audit of everything statically linked into
# the shipped desktop binary, run in CI (build-desktop.yml) so a copyleft dependency
# can never sneak back in (zed's GPL-3.0 ztracing/zlog did, patched out in the
# workspace Cargo.toml). Only the `licenses` check is configured; run it with
#   cargo deny --manifest-path apps/desktop/Cargo.toml check licenses

[graph]
# Audit every feature combination (the staging channel is a cargo feature) and all
# release target triples — the three OSes pull different platform dependency sets.
# Pinning `targets` (rather than auditing every triple) also keeps cfg-gated deps
# that no shipped build can reach out of the graph: rav1e declares libfuzzer-sys
# (`(MIT OR Apache-2.0) AND NCSA` — NCSA is deliberately NOT allowed below) under
# `[target."cfg(fuzzing)".dependencies]`, and cfg(fuzzing) is false for all three.
# `cargo tree -i libfuzzer-sys --target all` surfaces it; a real build never does.
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[licenses]
# Permissive licenses, plus MPL-2.0 — the one weak-copyleft exception: MPL's
# copyleft is FILE-scoped (unmodified third-party crates satisfy it by their source
# being public) and it imposes no terms on the larger work, so it is compatible with
# distributing the binary under Apache-2.0. Any strong copyleft (GPL/LGPL/AGPL) or
# unknown license fails the check: statically linking it would impose its terms on
# the whole shipped binary, which we distribute under Apache-2.0 only. Extend this
# list deliberately.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",   # webpki-roots (Mozilla CA bundle data)
    "ISC",
    "MIT-0",
    # cbindgen, dwrote, option-ext, and (EXP-261, via the vendored WYSIWYG
    # editor) cssparser, cssparser-macros, dtoa-short — see above.
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",      # finl_unicode
    "Zlib",
    "bzip2-1.0.6",           # libbz2-rs-sys (BSD-style bzip2 license)
    "0BSD",
]
# Audit EVERYTHING, including crates that declare `publish = false` (EXP-378).
# cargo-deny's `is_private` is purely `publish == []` with no source check, so
# `ignore = true` did not mean "our crates" — zed sets `publish = false` in its
# `[workspace.package]`, so 18 of the 20 zed crates we consume inherited it and
# went unaudited, as did the vendored third-party `crates/gpui-markdown-editor`.
# Our own crates are cheap to audit (they all inherit `license = "Apache-2.0"`
# from the workspace), so there is nothing to buy back by skipping them.
private = { ignore = false }

# tree-sitter-graphql omits the `license` manifest field but ships a plain MIT
# LICENSE file (verified by reading it in the crate package).
[[licenses.clarify]]
crate = "tree-sitter-graphql"
expression = "MIT"
license-files = []

# gpui_shared_string and gpui_util omit the `license` manifest field (zed sets it
# per-crate, and these two were missed upstream). Both ship a LICENSE-APACHE
# symlinked to the zed workspace's Apache-2.0 text — verified by reading it in the
# checkout at rev 1d217ee. cargo-deny harvests that file anyway; clarifying makes
# the answer explicit instead of confidence-scored, and drops the CI warning.
[[licenses.clarify]]
crate = "gpui_shared_string"
expression = "Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "gpui_util"
expression = "Apache-2.0"
license-files = []
