# VAPP-3 spike coturn. Static long-term credentials, plain UDP/TCP only (no TLS), small relay range.
listening-port=3478
listening-ip=0.0.0.0
# The address peers must reach: the Mac's LAN IP for the local matrix. For a public box set the public IP.
external-ip=192.168.178.71
relay-ip=0.0.0.0
min-port=49160
max-port=49200
lt-cred-mech
user=exp:spike
realm=exponential.local
fingerprint
no-tls
no-dtls
no-cli
verbose
# Keep the relay from acting as an open proxy to private ranges except our own LAN peers.
no-multicast-peers
