# VAPP-3 spike coturn, NATIVE on the Mac (brew install coturn). Needed for the local matrix: a
# Dockerized coturn on macOS sees Mac peers behind OrbStack's NAT (source 192.168.107.1), so
# permission checks fail on the reply path. On a Linux host use the compose file with host networking.
listening-port=3478
listening-ip=192.168.178.71
relay-ip=192.168.178.71
external-ip=192.168.178.71
min-port=49160
max-port=49200
lt-cred-mech
user=exp:spike
realm=exponential.local
fingerprint
no-tls
no-dtls
no-cli
allow-loopback-peers
verbose
log-file=/tmp/vapp3-coturn.log
simple-log
