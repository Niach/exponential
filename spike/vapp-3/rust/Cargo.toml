# VAPP-3 spike workspace. Throwaway: NOT part of apps/desktop (its zed [patch] + gpui lock stay untouched).
# Build with a private target dir:  CARGO_TARGET_DIR=$PWD/target cargo build --release
[workspace]
members = ["peer-core", "peer-cli", "peer-ffi"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
str0m = { version = "0.24", default-features = false }
turn = "0.17"
webrtc-util = "0.11"
stun = "0.8"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
uniffi = { version = "0.32" }
anyhow = "1"
if-addrs = "0.13"

# Size-oriented release profile (the issue's baseline used opt-z + LTO + strip).
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
