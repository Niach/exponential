[package]
name = "exponential-ui-gpui-sample"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "VAPP-91 sample: a plain gpui window hosting an Exponential UI surface streamed from the local A2UI JSONL server."

# Its OWN workspace: this is a third-party app, not part of apps/desktop's
# build graph.
[workspace]

[dependencies]
# The SDK, as an external app takes it. The path dependencies stand in for
# crates.io (`exponential-ui = "0.1"`, `exponential-ui-gpui = "0.1"`), which
# waits for crates.io releases of gpui + gpui-component.
exponential-ui = { path = "../../../apps/desktop/crates/exponential-ui" }
exponential-ui-gpui = { path = "../../../apps/desktop/crates/exponential-ui-gpui" }
# gpui + gpui-component at the SDK's revisions (Cargo.lock = a copy of
# apps/desktop/Cargo.lock, so every git dependency resolves to the same commit).
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "da4f93696dc2b2b4d91bcc42412b9053a3d24de8", features = ["tree-sitter-languages"] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "da4f93696dc2b2b4d91bcc42412b9053a3d24de8" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"

# zed's ztracing is GPL-3.0-or-later; the SDK's workspace swaps in no-op
# shims, and so does any app linking gpui at this revision.
[patch."https://github.com/zed-industries/zed"]
ztracing = { path = "../../../apps/desktop/crates/ztracing" }
ztracing_macro = { path = "../../../apps/desktop/crates/ztracing_macro" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package]
gpui = { opt-level = 3, debug = false }
taffy = { opt-level = 3, debug = false }
