[package]
name = "exponential-ui-gpui-sample"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "VAPP-91 sample: a plain gpui window hosting an Exponential UI surface streamed from the local A2UI JSONL server."

# Its OWN workspace: this is a third-party app, not part of apps/desktop's
# build graph.
[workspace]

[dependencies]
# The SDK, as an external app takes it. The path dependencies stand in for
# the release tag (`tag = "eui-v…"` on github.com/Niach/exponential).
eui-core = { path = "../../../apps/desktop/crates/eui-core" }
eui-gpui = { path = "../../../apps/desktop/crates/eui-gpui" }
# gpui + gpui-component at the SDK's versions (the painter README's "gpui
# revisions"): the exact gpui-pre snapshot gpui-component pins.
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { version = "=0.9.0", features = ["tree-sitter-languages"] }
gpui-component-assets = { package = "gpui-kit-assets", version = "=0.9.0" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package]
gpui-pre = { opt-level = 3, debug = false }
taffy = { opt-level = 3, debug = false }
