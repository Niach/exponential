# Install (root): sudo mkdir -p /etc/systemd/system/session-.scope.d && sudo cp session-interactive.conf /etc/systemd/system/session-.scope.d/50-exp-interactive.conf && sudo systemctl daemon-reload
# Applies from the next login; the running session at once:
#   sudo systemctl set-property --runtime session-$XDG_SESSION_ID.scope CPUWeight=1000
#
# PERF-4: the graphical session (Cinnamon, the Exponential desktop, Brave: a
# login's session-<id>.scope) outweighs user@<uid>.service tenfold. Agent runs
# and their cargo/gradle builds live in user@<uid>.service (app.slice
# run-*.scope), a sibling of the session at the same default weight 100, so
# 48 busy build threads made the desktop's main thread wait 49% of its run
# time; a 1000-vs-100 scope keeps a 180 ms frame at 181 ms under that load.
# Idle-only weight inside user@ cannot do it: an idle child still hands its
# parent the full share one level up.
[Scope]
CPUWeight=1000
