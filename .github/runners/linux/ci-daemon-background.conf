# ~/.config/systemd/user/exponential-ci-daemon.service.d/50-exp-background.conf
# (install-desktop-first.sh). The mint-ci daemon (eCode CI, #EXP-1617) runs its
# jobs as its own children: into expbg.slice with a cap of its own, and first
# in line for the kernel's OOM killer.
[Service]
Slice=expbg.slice
MemoryHigh=8G
MemoryMax=10G
OOMScoreAdjust=1000
