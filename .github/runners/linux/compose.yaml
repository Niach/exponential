# EXP-1364: two exp-linux runners on the Mint (.github/runners/README.md). Two,
# each capped and at idle CPU priority: the Mint is Danny's desktop.
# `docker compose up -d --build` from this directory; RUNNER_TOKEN only on the
# first start (the registration lives on in the runner-config volumes).
x-runner: &runner
  build: .
  restart: unless-stopped
  # Leaves the desktop responsive by PRIORITY, not by a small cap: the
  # runners live in expci.slice (CPUWeight=idle, install it first), so the
  # desktop session always wins a core and CI takes the idle ones. The cap only
  # keeps two jobs from starving each other (the Mint: 12 + 12 of its 32).
  cgroup_parent: expci.slice
  cpus: ${RUNNER_CPUS:-6}
  environment: &env
    REPO_URL: https://github.com/Niach/exponential
    RUNNER_SCOPE: repo
    RUNNER_TOKEN: ${RUNNER_TOKEN:-}
    LABELS: exp-linux
    # The entrypoint chowns the config + work dirs (see the Dockerfile for
    # why not root).
    RUN_AS_ROOT: "false"
    DISABLE_AUTO_UPDATE: "false"
    DISABLE_AUTOMATIC_DEREGISTRATION: "true"
    CONFIGURED_ACTIONS_RUNNER_FILES_DIR: /runner/config
    AGENT_TOOLSDIRECTORY: /opt/hostedtoolcache
    # EXP-1370: each runner has its own Gradle home (two daemons on one
    # ~/.gradle journal = "Could not create service of type
    # FileAccessTimeJournal"); the old shared volume is the read-only warm
    # dependency cache.
    GRADLE_RO_DEP_CACHE: /home/runner/.gradle-ro/caches
    # The shared sccache volume's cap (also the Dockerfile's default): 43 GB
    # at the old 40 GB cap on 2026-11-12; the Mac's is 15 GB (#2688).
    SCCACHE_CACHE_SIZE: 15G
  # Per service below (compose cannot merge lists). EXP-1370: bun, cargo,
  # rustup and gradle are PER RUNNER: setup-bun / rustup overwrite binaries the
  # other runner may be executing (ETXTBSY), Gradle daemons lock one journal.
  # sccache and the tool cache are safe to share; `gradle` is mounted
  # read-only as GRADLE_RO_DEP_CACHE. No host docker socket: no job routed here builds images
  # (build-web pushes from GitHub-hosted runners).
services:
  runner-1:
    <<: *runner
    environment:
      <<: *env
      RUNNER_NAME: mint-1
      RUNNER_WORKDIR: /tmp/runner-1/work
    volumes:
      - sccache:/home/runner/.cache/sccache
      - cargo-1:/home/runner/.cargo
      - rustup-1:/home/runner/.rustup
      - gradle-1:/home/runner/.gradle
      - gradle:/home/runner/.gradle-ro:ro
      - bun-1:/home/runner/.bun
      - toolcache:/opt/hostedtoolcache
      - config-1:/runner/config
  runner-2:
    <<: *runner
    environment:
      <<: *env
      RUNNER_NAME: mint-2
      RUNNER_WORKDIR: /tmp/runner-2/work
    volumes:
      - sccache:/home/runner/.cache/sccache
      - cargo-2:/home/runner/.cargo
      - rustup-2:/home/runner/.rustup
      - gradle-2:/home/runner/.gradle
      - gradle:/home/runner/.gradle-ro:ro
      - bun-2:/home/runner/.bun
      - toolcache:/opt/hostedtoolcache
      - config-2:/runner/config

volumes:
  sccache:
  cargo-1:
  cargo-2:
  rustup-1:
  rustup-2:
  gradle:
  gradle-1:
  gradle-2:
  bun-1:
  bun-2:
  toolcache:
  config-1:
  config-2:
