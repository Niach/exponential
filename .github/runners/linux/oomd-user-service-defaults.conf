# /etc/systemd/system/user@.service.d/10-oomd-user-service-defaults.conf
# Same name as the drop-in Ubuntu's systemd-oomd package ships in
# /usr/lib/systemd/system/user@.service.d/, so this one REPLACES it: the
# package default kills the user-manager cgroup with the most reclaim when
# user@ passes 50% pressure for 20 s, and that can be Dota or the browser.
# oomd watches only the background slices (expci.slice, expbg.slice) instead.
[Service]
ManagedOOMMemoryPressure=auto
