# Install (no root): mkdir -p ~/.config/systemd/user/run-.scope.d && cp run-scope-background.conf ~/.config/systemd/user/run-.scope.d/50-exp-background.conf && systemctl --user daemon-reload
# Exponential agent runs (crates/eagent run_scope: `systemd-run --user --scope`
# = run-<id>.scope) and their cargo/gradle builds yield to everything else in
# the user manager: SCHED_IDLE against app.slice's siblings (games, flatpaks).
# The desktop session itself is protected by session-.scope.d (root, see
# .github/runners/README.md "Desktop first").
[Scope]
CPUWeight=idle
