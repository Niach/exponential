# Install: bash .github/runners/linux/install-desktop-first.sh (no root)
# = ~/.config/systemd/user/run-.scope.d/50-exp-background.conf
# Exponential agent runs (crates/eagent run_scope: `systemd-run --user --scope`
# = run-<id>.scope) and their cargo/gradle builds yield to everything else in
# the user manager: SCHED_IDLE against app.slice's siblings (games, flatpaks),
# and they live in expbg.slice, whose MemoryMax caps every run together (a
# scope's slice is fixed at its start: runs started before the install stay in
# app.slice until they end). Any other `systemd-run --user --scope` lands there
# too. The desktop session itself is protected by session-.scope.d (root, see
# .github/runners/README.md "Desktop first").
[Scope]
Slice=expbg.slice
CPUWeight=idle
