# ~/.config/systemd/user/app-steam-.scope.d/50-exp-game.conf
# (install-desktop-first.sh). Steam starts every game in its own
# app-steam-app<id>-<pid>.scope in app.slice (Dota 2 = app-steam-app570-*).
# The game outweighs the browser and flatpaks there tenfold, and while any game
# scope is up it pulls in exp-gaming.service, which takes CI down to one job
# (gaming-ci.sh); StopWhenUnneeded stops it when the last game scope ends.
[Unit]
Wants=exp-gaming.service

[Scope]
CPUWeight=1000
