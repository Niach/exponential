name: desktop-build

# EXP-1364: the desktop build legs, called twice by build-desktop.yml: once
# for macOS + Linux (the release waits on these) and once for Windows (its
# .exe attaches to the release afterwards, so the slowest, least-proven leg
# never holds back a publish).

on:
  workflow_call:
    inputs:
      matrix:
        type: string
        required: true
      linux-runner:
        type: string
        default: '"ubuntu-24.04"'

jobs:
  build:
    strategy:
      fail-fast: false
      # Built by build-desktop.yml's `setup` job — one leg per (OS × selected
      # channel). See the matrix comment there.
      matrix: ${{ fromJson(inputs.matrix) }}
    runs-on: ${{ matrix.os == 'ubuntu-24.04' && fromJSON(inputs.linux-runner) || matrix.os }}
    # Windows is the newest, least-proven target — don't let it block a
    # macOS/Linux release. Remove once a few releases have shipped green.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system deps (wgpu/gpui + AppImage packaging)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev \
            libssl-dev libfontconfig1-dev pkg-config \
            libx11-dev libxi-dev libxtst-dev libpipewire-0.3-dev clang \
            librsvg2-bin file wget
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: apps/desktop
          key: ${{ matrix.channel }}
      - name: Cargo features for channel
        id: feat
        shell: bash
        run: |
          if [ "${{ matrix.channel }}" = "staging" ]; then
            echo "flags=--features staging" >> "$GITHUB_OUTPUT"
          else
            echo "flags=" >> "$GITHUB_OUTPUT"
          fi
      # Version strings (from the desktop-v* tag; falls back to 0.0.0 on
      # workflow_dispatch). Derived BEFORE the build so it can be compiled into
      # the binary (the in-app update check compares the running version against
      # the latest GitHub release), and reused by macOS packaging below.
      - name: Derive version
        id: ver
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME:-}"
          version="${ref#desktop-v}"
          [ "$version" = "$ref" ] && version="0.0.0"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build (${{ matrix.channel }})
        # EXP_DESKTOP_VERSION is read by `ui::update::current_version` via
        # `option_env!` — without it the binary reports the static 0.1.0
        # workspace version and would always think an update is available.
        # EXP-1430: EXP_UPDATE_PUBKEY = the minisign key the updater verifies
        # SHA256SUMS.txt with, compiled in the same way.
        # EXP-1430: macOS builds per slice with --target (never a global
        # rustflag, see .cargo/config.toml); matrix target
        # `universal-apple-darwin` = aarch64 + x86_64 (Intel Macs; no voice
        # there), lipo'd by the macos-app action. Asset name unchanged.
        shell: bash
        env:
          EXP_DESKTOP_VERSION: ${{ steps.ver.outputs.version }}
          EXP_UPDATE_PUBKEY: ${{ vars.UPDATE_SIGNING_PUBKEY }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo_build() {
            cargo build --release --locked --manifest-path apps/desktop/Cargo.toml -p app ${{ steps.feat.outputs.flags }} "$@"
          }
          case "$TARGET" in
            universal-apple-darwin) slices="aarch64-apple-darwin x86_64-apple-darwin" ;;
            *-apple-darwin) slices="$TARGET" ;;
            *) cargo_build; exit 0 ;;
          esac
          bins=""
          for t in $slices; do
            rustup target add "$t"
            cargo_build --target "$t"
            bins="${bins}apps/desktop/target/$t/release/exp-desktop"$'\n'
          done
          { echo "MACOS_BINARIES<<EOF"; printf '%s' "$bins"; echo "EOF"; } >> "$GITHUB_ENV"

      # Linux → package a single-file AppImage. The raw `.AppImage` is the
      # ONLY Linux asset (EXP-68 — no `.tar.gz` twin): it is both the
      # marketing `releases/latest/download/<name>.AppImage` link and the
      # asset the in-app self-updater expects (`updater::expected_asset_name`).
      - name: Package AppImage
        if: runner.os == 'Linux'
        run: apps/desktop/scripts/build-appimage.sh ${{ matrix.channel }}
      - name: Upload AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: exp-desktop-${{ matrix.channel }}-${{ matrix.target }}
          path: apps/desktop/target/Exponential-${{ matrix.channel }}-*.AppImage
          if-no-files-found: error

      # Windows → the raw `.exe`, the ONLY Windows asset (EXP-68 — the old
      # `.zip` twin is gone). It is both the marketing download link and the
      # asset the in-app self-updater (EXP-22) swaps the running exe with
      # (`updater::expected_asset_name`). The exponential:// protocol handler +
      # single instance are self-registered at first launch (HKCU, no
      # installer needed); an MSI/MSIX is future work.
      - name: Package Windows exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item apps/desktop/target/release/exp-desktop.exe `
            "apps/desktop/target/Exponential-${{ matrix.channel }}-x86_64-windows.exe"
      # EXP-1430: Authenticode via Azure Artifact Signing, BEFORE the upload
      # (release-windows hashes the uploaded file into SHA256SUMS.txt). No
      # AZURE_* secrets → a warning and today's unsigned .exe.
      - name: Sign Windows exe
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-sign
        with:
          files: apps/desktop/target/Exponential-${{ matrix.channel }}-x86_64-windows.exe
          endpoint: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          account-name: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          certificate-profile: ${{ vars.WINDOWS_SIGNING_PROFILE }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: exp-desktop-${{ matrix.channel }}-${{ matrix.target }}
          path: apps/desktop/target/Exponential-${{ matrix.channel }}-x86_64-windows.exe
          if-no-files-found: error

      # macOS → a proper .app bundle. The Info.plist declares the
      # `exponential://` URL scheme (CFBundleURLTypes) so the OAuth-callback /
      # invite deep link routes into on_open_urls.
      #
      # EXP-1430: assembly, signing and packaging = the shared macos-app
      # action (spezl uses it too). Signing/notarization is GATED on secrets:
      # with the Developer ID cert + notary API key the .app is Developer-ID
      # signed with a hardened runtime and shipped as a notarized+stapled .dmg
      # (Gatekeeper clean); without them, an ad-hoc-signed .zip keeps CI green.
      # build-macos-app.sh --stage = the Exponential-only inputs (CrispASR
      # dylibs, licences) + the channel's app name / bundle id.
      - name: Stage Exponential bundle inputs (macOS)
        if: runner.os == 'macOS'
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          EXP_DESKTOP_BIN="$(head -1 <<<"$MACOS_BINARIES")" \
            apps/desktop/scripts/build-macos-app.sh --stage "$RUNNER_TEMP/exp-bundle" ${{ matrix.channel }} >> "$GITHUB_OUTPUT"

      - name: Package .app + .dmg (macOS)
        if: runner.os == 'macOS'
        uses: ./.github/actions/macos-app
        with:
          binaries: ${{ env.MACOS_BINARIES }}
          app-name: ${{ steps.stage.outputs.app_name }}
          bundle-id: ${{ steps.stage.outputs.bundle_id }}
          executable: exp-desktop
          info-plist: apps/desktop/assets/packaging/Info.plist
          # NEW-78: device.audio-input (push to talk's microphone).
          entitlements: apps/desktop/assets/packaging/exp-desktop.entitlements
          icon: apps/desktop/assets/icons/logo-macos.svg
          frameworks-dir: ${{ steps.stage.outputs.frameworks_dir }}
          resources: ${{ steps.stage.outputs.resources_dir }}
          lsuielement: "false"
          version: ${{ steps.ver.outputs.version }}
          build: ${{ github.run_number }}
          output-dir: apps/desktop/target
          dmg-name: Exponential-${{ matrix.channel }}.dmg
          zip-name: exp-desktop-${{ matrix.channel }}.zip
          volume-name: ${{ steps.stage.outputs.app_name }}
          cert-p12: ${{ secrets.MACOS_CERT_P12 }}
          cert-password: ${{ secrets.MACOS_CERT_PASSWORD }}
          notary-key-id: ${{ secrets.NOTARY_KEY_ID }}
          notary-issuer-id: ${{ secrets.NOTARY_ISSUER_ID }}
          notary-key: ${{ secrets.NOTARY_KEY }}

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: exp-desktop-${{ matrix.channel }}-${{ matrix.target }}
          # Exactly one of these exists (signed .dmg vs ad-hoc .zip).
          path: |
            apps/desktop/target/Exponential-${{ matrix.channel }}.dmg
            apps/desktop/target/exp-desktop-${{ matrix.channel }}.zip
          if-no-files-found: error

  # Publish the PRODUCTION-channel artifacts to a GitHub Release on desktop-v*
  # tags (§11.2): stable `/releases/latest/download/<asset>` URLs (the marketing
  # DownloadSection links) + a SHA256SUMS.txt. Staging stays artifacts-only —
  # it is never downloaded from a Release. Skipped on workflow_dispatch (no tag).
