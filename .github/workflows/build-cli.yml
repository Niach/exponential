# The `exponential` CLI release train (EXP-403): bare binaries per target,
# published on cli-v* tags. Deliberately independent of desktop-v* — the
# desktop MUST keep owning `releases/latest` (its update check + the
# marketing download links resolve it), so this release sets
# make_latest: false and the CLI's own update check lists releases and
# filters by tag prefix.
name: build-cli

on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:

jobs:
  license-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cargo-fetch
        with:
          dir: ''
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: apps/desktop/Cargo.toml
          command: check licenses

  build:
    needs: [license-audit]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux stays on 22.04 on purpose: glibc 2.35 stays the binary's
          # floor for the servers it runs on (computer use is pure-Rust X11
          # since EXP-1273, nothing system-side at build or load time).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          # macOS = macos-26 (EXP-1196
          # needed its Xcode 26 SDK; EXP-1273 no longer does, the image stays).
          - target: aarch64-apple-darwin
            os: macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/apt-mirror
        if: runner.os == 'Linux'
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
          key: cli-${{ matrix.target }}
      # Version from the cli-v* tag (0.0.0 on workflow_dispatch) — compiled
      # in via EXP_CLI_VERSION so `exponential version`, the x-client-version
      # header (`cli/<version>`) and the self-update compare all agree.
      - uses: ./.github/actions/cargo-fetch
      - name: Derive version
        id: ver
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME:-}"
          version="${ref#cli-v}"
          [ "$version" = "$ref" ] && version="0.0.0"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # EXP_UPDATE_PUBKEY pins the updater feed key (EXP-1430): a build
      # carrying it only self-updates to a signed SHA256SUMS.txt.
      - name: Build
        env:
          EXP_CLI_VERSION: ${{ steps.ver.outputs.version }}
          EXP_UPDATE_PUBKEY: ${{ vars.UPDATE_SIGNING_PUBKEY }}
          # #LOGS-2: line tables for GlitchTip (a dSYM on macOS; stripped off
          # the Linux binary below, after the upload): the asset never grows.
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then export CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO=packed; fi
          cargo build --release --locked --manifest-path apps/desktop/Cargo.toml \
            -p exp-cli --target ${{ matrix.target }}
      # #FEED-244: the app-screen renderer (`exponential-shot`), its own
      # binary and its OWN cargo invocation: it links gpui with
      # `test-support` (the headless renderer), which must never unify into
      # the CLI. Devices fetch it on the first `app_screenshot`, verified
      # against this release's signed SHA256SUMS (updater::app_shot).
      - name: Linux gpui deps (the app-screen renderer)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev \
            libfontconfig1-dev libx11-dev libxi-dev libxtst-dev clang
      - name: Build the app-screen renderer
        shell: bash
        run: |
          cargo build --release --locked --manifest-path apps/desktop/Cargo.toml \
            -p eui-shot --bin exponential-shot --target ${{ matrix.target }}
      - name: Collect debug files
        id: dif
        shell: bash
        run: |
          dir="apps/desktop/target/${{ matrix.target }}/release"
          if [ "$RUNNER_OS" = "macOS" ]; then echo "paths=$dir/exponential.dSYM" >> "$GITHUB_OUTPUT"; else echo "paths=$dir/exponential" >> "$GITHUB_OUTPUT"; fi
      # The CLI shares the desktop project. No token = skipped; a failed
      # upload only warns.
      - name: Upload debug files to GlitchTip
        if: startsWith(github.ref, 'refs/tags/')
        uses: ./.github/actions/glitchtip-debug-files
        with:
          paths: ${{ steps.dif.outputs.paths }}
          auth-token: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
          cf-access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      - name: Stage asset
        shell: bash
        run: |
          set -euo pipefail
          bin="apps/desktop/target/${{ matrix.target }}/release/exponential"
          strip "$bin" || true
          # arm64 macOS refuses to exec unsigned binaries; re-apply the
          # ad-hoc signature strip may have invalidated.
          if [ "${{ runner.os }}" = "macOS" ]; then
            codesign -s - -f "$bin"
          fi
          mkdir -p dist
          cp "$bin" "dist/exponential-${{ matrix.target }}"
          shot="apps/desktop/target/${{ matrix.target }}/release/exponential-shot"
          strip "$shot" || true
          if [ "${{ runner.os }}" = "macOS" ]; then
            codesign -s - -f "$shot"
          fi
          cp "$shot" "dist/exponential-shot-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: exp-cli-${{ matrix.target }}
          path: |
            dist/exponential-${{ matrix.target }}
            dist/exponential-shot-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: [build]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/cli-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: exp-cli-*
          path: dist
          merge-multiple: true
      - name: Require every target
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin; do
            [ -f "dist/exponential-$target" ] || { echo "missing exponential-$target" >&2; exit 1; }
            [ -f "dist/exponential-shot-$target" ] || { echo "missing exponential-shot-$target" >&2; exit 1; }
          done
      # Apache-2.0 section 4: a bare binary has no bundle to carry the
      # licence text — put LICENSE + NOTICE on the release page (and in the
      # checksums), mirroring the desktop release (EXP-376).
      - name: Check out the licence files and the feed action
        uses: actions/checkout@v4
        with:
          path: repo
          sparse-checkout: |
            LICENSE
            NOTICE
            .github/actions/updater-feed
            .github/actions/apt-mirror
          sparse-checkout-cone-mode: false
      - name: Add LICENSE and NOTICE to the release
        run: |
          set -euo pipefail
          cp repo/LICENSE repo/NOTICE dist/
      # EXP-1430: SHA256SUMS.txt + its minisign signature; a pinned public key
      # without the secret fails the release (pinned clients would refuse it).
      - name: Signed checksums
        uses: ./repo/.github/actions/updater-feed
        with:
          dir: dist
          signing-key: ${{ secrets.UPDATE_SIGNING_KEY }}
          public-key: ${{ vars.UPDATE_SIGNING_PUBKEY }}
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # NEVER latest — desktop owns releases/latest (see header comment).
          make_latest: false
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
