name: exponential-ui

# VAPP-91: the Exponential UI conformance suite on every renderer. Each job
# runs its renderer's conformance runner (every suite of
# packages/exponential-ui/conformance/manifest.json through that renderer's
# painter and bindings) and uploads the report; `conformant` fails unless
# every report passes `conformance:check` (all suites, every case, nothing
# failed). The React renderer runs in headless Chromium, the Rust core and
# the gpui painter on Linux, the SwiftUI painter on macOS against the
# xcframework, the Compose painter under Robolectric against the host build
# of the facade. Each job also compiles its ui.exponential.at guides from a
# fresh project (`apps/ui-site/guides/check.ts`, VAPP-93). VAPP-103: the
# SwiftUI painter also builds and tests on an iOS Simulator (the UIKit paths)
# with the KitchenSink example, and the Compose painter runs its instrumented
# tests on an Android emulator.
#
# The pull request AND the push to master (path-filtered to the SDK, both).

on:
  pull_request:
    branches: [master]
    paths:
      - 'packages/exponential-ui/**'
      - 'packages/exponential-ui-react/**'
      - 'packages/exponential-ui-swift/**'
      - 'packages/exponential-ui-compose/**'
      - 'apps/desktop/crates/exponential-ui/**'
      - 'apps/desktop/crates/exponential-ui-ffi/**'
      - 'apps/desktop/crates/exponential-ui-gpui/**'
      - 'apps/ui-site/guides/**'
      - '.github/workflows/exponential-ui.yml'
  push:
    branches: [master]
    paths:
      - 'packages/exponential-ui/**'
      - 'packages/exponential-ui-react/**'
      - 'packages/exponential-ui-swift/**'
      - 'packages/exponential-ui-compose/**'
      - 'apps/desktop/crates/exponential-ui/**'
      - 'apps/desktop/crates/exponential-ui-ffi/**'
      - 'apps/desktop/crates/exponential-ui-gpui/**'
      - 'apps/ui-site/guides/**'
      - '.github/workflows/exponential-ui.yml'
  workflow_dispatch: {}

concurrency:
  group: exponential-ui-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Catalog package tests (TS reference, host fixtures)
        run: bun run --filter @exponential-at/ui test
      - name: React renderer tests
        run: bun run --filter @exponential-at/ui-react test
      - name: React conformance (headless Chromium)
        env:
          EXPONENTIAL_UI_CONFORMANCE_REPORT: ${{ github.workspace }}/.conformance/exponential-ui-react.json
        run: bun run --filter @exponential-at/ui-react test:conformance
      - name: Guides (React, agent, theme) from a fresh project
        run: |
          bun apps/ui-site/guides/check.ts react
          bun apps/ui-site/guides/check.ts agent
          bun apps/ui-site/guides/check.ts theme
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-react
          path: .conformance/
          include-hidden-files: true  # .conformance/ is a dot-directory; upload-artifact v4 skips hidden paths by default

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux system deps (wgpu/gpui)
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev \
            libssl-dev libfontconfig1-dev pkg-config \
            libx11-dev libxi-dev libxtst-dev libpipewire-0.3-dev clang
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - name: Core + facade tests (core conformance)
        working-directory: apps/desktop
        env:
          EXPONENTIAL_UI_CONFORMANCE_REPORT: ${{ github.workspace }}/.conformance/exponential-ui.json
        run: cargo test --locked -p exponential-ui -p exponential-ui-ffi
      - name: gpui painter tests (gpui conformance)
        working-directory: apps/desktop
        env:
          EXPONENTIAL_UI_CONFORMANCE_REPORT: ${{ github.workspace }}/.conformance/exponential-ui-gpui.json
        run: cargo test --locked -p exponential-ui-gpui
      - uses: oven-sh/setup-bun@v2
      - name: Guide (gpui) from a fresh project
        run: bun apps/ui-site/guides/check.ts gpui
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-rust
          path: .conformance/
          include-hidden-files: true  # .conformance/ is a dot-directory; upload-artifact v4 skips hidden paths by default

  swift:
    # Same image as test-ios.yml / build-ios.yml.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - name: Build the xcframework (iOS device + simulator + macOS)
        run: bash apps/desktop/crates/exponential-ui-ffi/build-ios.sh
      - name: Hand the xcframework to the simulator job
        uses: actions/upload-artifact@v4
        with:
          name: exponential-ui-xcframework
          path: packages/exponential-ui-swift/Binaries/
          retention-days: 1
      - name: Swift painter tests (SwiftUI conformance)
        working-directory: packages/exponential-ui-swift
        env:
          EXPONENTIAL_UI_CONFORMANCE_REPORT: ${{ github.workspace }}/.conformance/exponential-ui-swift.json
        run: swift test
      - uses: oven-sh/setup-bun@v2
      - name: Guide (SwiftUI) from a fresh project
        run: bun apps/ui-site/guides/check.ts swift
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-swift
          path: .conformance/
          include-hidden-files: true  # .conformance/ is a dot-directory; upload-artifact v4 skips hidden paths by default

  swift-ios:
    # The UIKit paths (`#if canImport(UIKit)`) only compile for iOS: build +
    # test the package on a Simulator against the swift job's xcframework,
    # then build the KitchenSink example.
    needs: swift
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest RELEASE Xcode 26.x
        run: |
          XCODE_APP="$(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$XCODE_APP" ] || { echo "::error::No release Xcode 26.x on this image" >&2; exit 1; }
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
      - uses: actions/download-artifact@v4
        with:
          name: exponential-ui-xcframework
          path: packages/exponential-ui-swift/Binaries/
      - name: Pick an iPhone simulator
        id: sim
        run: |
          DEVICE="$(xcrun simctl list devices available -j | python3 -c 'import json,sys
          d=json.load(sys.stdin)["devices"]
          ios=sorted((k for k in d if "iOS" in k), key=lambda k: [int(x) for x in k.rsplit("iOS-",1)[1].split("-")])
          print(next(x["udid"] for k in reversed(ios) for x in d[k] if x["name"].startswith("iPhone")))')"
          echo "id=$DEVICE" >> "$GITHUB_OUTPUT"
      - name: Package tests on the iOS Simulator
        working-directory: packages/exponential-ui-swift
        run: |
          set -o pipefail
          xcodebuild test -scheme ExponentialUI-Package -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO | tail -40
      - name: Build the KitchenSink example (Simulator)
        working-directory: packages/exponential-ui-swift/Example
        run: |
          set -o pipefail
          xcodebuild build -project KitchenSink.xcodeproj -scheme KitchenSink \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/dd-sink" CODE_SIGNING_ALLOWED=NO | tail -20

  compose-emulator:
    # Instrumented tests (ui-compose/src/androidTest) on an x86_64 emulator
    # against the facade's x86_64 .so.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0 ndk;28.2.13676358'
      - run: cargo install cargo-ndk --locked
      - name: The facade for the emulator (x86_64, the committed binding)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ABIS: x86_64
          SKIP_BINDINGS: '1'
        run: bash apps/desktop/crates/exponential-ui-ffi/build-android.sh
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-ui-gradle-${{ hashFiles('packages/exponential-ui-compose/**/*.gradle*', 'packages/exponential-ui-compose/gradle/wrapper/gradle-wrapper.properties', 'packages/exponential-ui-compose/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-ui-gradle-
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the test APKs before the emulator boots
        working-directory: packages/exponential-ui-compose
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :ui-compose:assembleDebugAndroidTest --no-daemon
      - name: Instrumented tests (emulator, API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: packages/exponential-ui-compose
          script: ./gradlew :ui-compose:connectedDebugAndroidTest --no-daemon

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - name: Host build of the facade (the JVM tests load it through JNA)
        working-directory: apps/desktop
        run: cargo build --locked -p exponential-ui-ffi --release
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'
      - name: Compose painter tests (Compose conformance)
        working-directory: packages/exponential-ui-compose
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/target
          EXPONENTIAL_UI_CONFORMANCE_REPORT: ${{ github.workspace }}/.conformance/exponential-ui-compose.json
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :ui-compose:testDebugUnitTest :ui-compose-primitives:testDebugUnitTest --no-daemon
      - uses: oven-sh/setup-bun@v2
      - name: Guide (Compose) from a fresh project
        run: bun apps/ui-site/guides/check.ts compose
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-compose
          path: .conformance/
          include-hidden-files: true  # .conformance/ is a dot-directory; upload-artifact v4 skips hidden paths by default

  conformant:
    needs: [react, rust, swift, compose]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: conformance-*
          path: .conformance
          merge-multiple: true
      - name: Every renderer is Exponential UI conformant
        run: bun run --filter @exponential-at/ui conformance:check $(ls "$GITHUB_WORKSPACE"/.conformance/*.json)
