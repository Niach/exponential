name: test-ios

# EXP-814: the ONE job that compiles the iOS app target outside a release.
#
# Nothing else did. `test.yml` runs on Linux and builds no Swift at all,
# `bun run ios:test` builds only the ExpCore/ExpUI test targets (the app target
# is not in them), and `build-ios.yml` runs on an `ios-v*` tag — i.e. after the
# decision to release. So the first thing to compile `apps/ios/Exponential` was
# the release itself, and the Swift type checker's Release-only expression
# budget broke three trains in a row (#644, #656) on a view a Debug build
# compiles fine.
#
# Release configuration on purpose: that is the failure mode. UNSIGNED on
# purpose too — entitlements exist only inside a code signature, so nothing
# built here is shippable (EXP-405) and nothing should try; the signed archive
# stays in build-ios.yml on the same runner image.
#
# EXP-912: it also RUNS the ExpCore and ExpUI suites. Before, nothing in CI
# executed a Swift test, so the contract fixtures every client replays on a PR
# (`packages/domain-contract/fixtures/**`: diff, tool-group summary, workflow
# caption) drifted on iOS until a release. `--no-selective-testing` because
# tuist's selective testing can skip a suite whose inputs it does not track —
# a fixture read through `#filePath` is exactly that — and report green.
#
# Path-filtered: every generated Swift file (contract, icons, design tokens) is
# committed under apps/ios, so that filter covers a codegen change arriving
# from packages/. The one exception is packages/domain-contract, whose JSON
# fixtures and TS reference the ExpCore tests read straight off the checkout.

# Once per change: the pull request only. The push the squash merge produces
# carries the tree the PR just tested, so it does not run again
# (`workflow_dispatch` for a direct push to master).

on:
  pull_request:
    branches: [master]
    paths:
      - 'apps/ios/**'
      - 'packages/domain-contract/**'
      - '.github/workflows/test-ios.yml'
  workflow_dispatch: {}

concurrency:
  group: test-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  compile:
    # Same image as build-ios.yml: Xcode 26.x needs macOS Tahoe 26.2+.
    runs-on: macos-26
    # A Release compile plus two simulator suites is ~25 min on a cold cache;
    # anything past this is a hung simulator, not slow work.
    timeout-minutes: 60

    defaults:
      run:
        working-directory: apps/ios

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select the newest RELEASE Xcode 26.x
        run: |
          XCODE_APP="$(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No release Xcode 26.x on this image" >&2
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install tuist
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Pin tuist
        run: |
          mise use -g tuist@4.202.6
          tuist version

      # `tuist install` pulls ~1.7 GB of Firebase binary artifacts, so cache it
      # on the dependency manifests — the only thing that changes what it
      # fetches. Paths are repo-relative here (the cache action ignores
      # defaults.run.working-directory).
      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: apps/ios/Tuist/.build
          key: ${{ runner.os }}-tuist-spm-${{ hashFiles('apps/ios/Tuist/Package.swift', 'apps/ios/Tuist/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-tuist-spm-

      # A fresh checkout has no Tuist/.build SPM checkouts; `tuist generate`
      # exits 1 without this.
      - name: Resolve SPM dependencies
        id: deps
        run: tuist install

      - name: Compile the app target (Release, unsigned)
        run: |
          tuist generate --no-open
          if ! xcodebuild -workspace Exponential.xcworkspace -scheme Exponential \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            build > "$RUNNER_TEMP/build.log" 2>&1; then
            echo "::group::Compiler errors"
            grep -E "error: " "$RUNNER_TEMP/build.log" | sort -u | head -40 || true
            echo "::endgroup::"
            echo "::group::Tail of the build log"
            tail -80 "$RUNNER_TEMP/build.log"
            echo "::endgroup::"
            exit 1
          fi
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build.log"

      # Runs even when the Release compile failed: a red compile and a drifted
      # fixture are two separate answers, and the second one is cheap once the
      # dependencies are resolved.
      #
      # BOTH schemes, because `bun run ios:test` runs both and the byte-locked
      # markdown-interchange, emoji and status-colour parity suites live in
      # ExpUI, not ExpCore.
      #
      # The gate is the RESULT BUNDLE, never the log: `tuist test` pipes
      # xcodebuild through xcbeautify, which prints `✔ name (0.001 seconds)`
      # and never xcodebuild's `Executed N tests` line, so a grep-the-log gate
      # is dead on arrival — as the old one was. `xcresulttool get test-results
      # summary` reports the real counts, and a per-scheme FLOOR turns a suite
      # that silently stopped running (a scheme renamed, a test target dropped
      # out of it, selective testing sneaking back in) into a red job instead
      # of a green one that executed nothing. Floors sit under today's counts
      # (ExpCore 903, ExpUI 383) so ordinary churn passes.
      - name: Run the ExpCore + ExpUI suites (simulator)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          set -uo pipefail

          # Pin the destination. Left to itself tuist takes whatever simulator
          # the image happens to list first (an iPad, locally) — which device
          # ran the suite should not be a property of the runner image.
          DEVICE="$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | .name]
                     | (map(select(. == "iPhone 17 Pro Max"))
                        + map(select(startswith("iPhone 17")))
                        + map(select(startswith("iPhone")))) | .[0] // empty')"
          if [ -z "$DEVICE" ]; then
            echo "::error::No iPhone simulator available on this image"
            exit 1
          fi
          echo "Simulator: $DEVICE"

          fail=0
          run_suite() {
            local scheme="$1" floor="$2"
            local log="$RUNNER_TEMP/test-$scheme.log"
            local dir="$RUNNER_TEMP/xcresult/$scheme"
            rm -rf "$dir" && mkdir -p "$dir"

            local status=0
            tuist test "$scheme" --no-selective-testing \
              --device "$DEVICE" \
              --result-bundle-path "$dir/$scheme.xcresult" \
              > "$log" 2>&1 || status=$?

            local bundle="$dir/$scheme.xcresult"
            [ -d "$bundle" ] || bundle="$(find "$dir" -maxdepth 3 -name '*.xcresult' -print -quit)"
            if [ ! -d "$bundle" ]; then
              echo "::error::$scheme produced no result bundle (tuist exit $status)"
              echo "::group::Tail of the $scheme log"
              tail -80 "$log"
              echo "::endgroup::"
              fail=1
              return 0
            fi

            local summary
            if ! summary="$(xcrun xcresulttool get test-results summary --path "$bundle" --compact)"; then
              echo "::error::$scheme: could not read the result bundle at $bundle"
              fail=1
              return 0
            fi

            local total failed skipped result
            total="$(jq -r '.totalTestCount // 0' <<<"$summary")"
            failed="$(jq -r '.failedTests // 0' <<<"$summary")"
            skipped="$(jq -r '.skippedTests // 0' <<<"$summary")"
            result="$(jq -r '.result // "unknown"' <<<"$summary")"
            echo "$scheme: $result — $total executed, $failed failed, $skipped skipped (floor $floor)"

            if [ "$status" -ne 0 ] || [ "$failed" -ne 0 ]; then
              echo "::error::$scheme failed: $failed failing tests (tuist exit $status)"
              echo "::group::Failing tests ($scheme)"
              jq -r '.testFailures[]? | "\(.targetName)/\(.testName): \(.failureText)"' <<<"$summary" | head -60
              echo "::endgroup::"
              echo "::group::Tail of the $scheme log"
              tail -80 "$log"
              echo "::endgroup::"
              fail=1
            fi

            if [ "$total" -lt "$floor" ]; then
              echo "::error::$scheme executed $total tests, below the floor of $floor — the suite stopped running, it did not pass"
              fail=1
            fi

            return 0
          }

          run_suite ExpCore 800
          run_suite ExpUI 300
          exit "$fail"

      - name: Upload the build and test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-compile-log
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/test-*.log
          if-no-files-found: ignore
          retention-days: 7
