name: test-ios

# EXP-814: the ONE job that compiles the iOS app target outside a release.
#
# Nothing else did. `test.yml` runs on Linux and builds no Swift at all,
# `bun run ios:test` builds only the ExpCore/ExpUI test targets (the app target
# is not in them), and `build-ios.yml` runs on an `ios-v*` tag — i.e. after the
# decision to release. So the first thing to compile `apps/ios/Exponential` was
# the release itself, and the Swift type checker's Release-only expression
# budget broke three trains in a row (#644, #656) on a view a Debug build
# compiles fine.
#
# Release configuration on purpose: that is the failure mode. UNSIGNED on
# purpose too — entitlements exist only inside a code signature, so nothing
# built here is shippable (EXP-405) and nothing should try; the signed archive
# stays in build-ios.yml on the same runner image.
#
# EXP-912: it also RUNS the ExpCore and ExpUI suites. Before, nothing in CI
# executed a Swift test, so the contract fixtures every client replays on a PR
# (`packages/domain-contract/fixtures/**`: diff, tool-group summary, workflow
# caption) drifted on iOS until a release. `--no-selective-testing` because
# tuist's selective testing can skip a suite whose inputs it does not track —
# a fixture read through `#filePath` is exactly that — and report green.
#
# 2026-10-26: release-suite.yml calls this on the release tags; workflow_dispatch
# runs it by hand. #EXP-1680: test.yml calls it with `compile_only` on PRs that
# touch the app or its FFI inputs: the same Release compile, the device slices
# alone, no simulator and no suites (about half the job's time).

on:
  workflow_call:
    inputs:
      compile_only:
        type: boolean
        default: false
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # EXP-1364: fork PRs never run here; the MacBook takes the job when it is up.
  pick:
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit

  compile:
    needs: pick
    # GitHub-hosted: the same `xcode-27` image as build-ios.yml. Both
    # environments build with the newest release Xcode 27.x on an iOS 27 simulator
    # (.github/scripts/select-xcode.sh); the MacBook uses its own Homebrew
    # tuist; the signed release stays on GitHub.
    runs-on: ${{ fromJSON(needs.pick.outputs.mac) }}
    # A Release compile plus two simulator suites is ~25 min on a cold cache;
    # anything past this is a hung simulator, not slow work.
    timeout-minutes: 60

    defaults:
      run:
        working-directory: apps/ios

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Disk guard (self-hosted Mac, EXP-1396)
        if: runner.environment == 'self-hosted'
        run: bash "$GITHUB_WORKSPACE/.github/scripts/disk-guard.sh"

      - name: Select Xcode 27 + the iOS 27 simulator
        env:
          SELECT_ARGS: ${{ !inputs.compile_only && '--simulator' || '' }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/select-xcode.sh" $SELECT_ARGS

      - name: Install tuist
        if: runner.environment == 'github-hosted'
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Pin tuist
        if: runner.environment == 'github-hosted'
        run: |
          mise use -g tuist@4.215.1
          tuist version

      # The Mac runners share a machine whose global tuist (Homebrew's cask)
      # trails the pin and serves every local lane, so the pinned release
      # lives in the runner's own tool cache (kept across jobs) and only this
      # job's PATH sees it.
      - name: Pin tuist (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          dir="$RUNNER_TOOL_CACHE/tuist/4.215.1"
          if [ ! -x "$dir/tuist" ]; then
            rm -rf "$dir" && mkdir -p "$dir"
            curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 -o "$dir.zip" https://github.com/tuist/tuist/releases/download/4.215.1/tuist.zip
            unzip -q -o "$dir.zip" -d "$dir" && rm -f "$dir.zip"
          fi
          echo "$dir" >> "$GITHUB_PATH"

      - name: Check the local tuist + Xcode (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          xcodebuild -version
          [ "$(tuist version)" = "4.215.1" ] || { echo "::error::tuist $(tuist version) on this runner, the pin is 4.215.1"; exit 1; }

      # `tuist install` pulls ~1.7 GB of Firebase binary artifacts, so cache it
      # on the dependency manifests — the only thing that changes what it
      # fetches. Paths are repo-relative here (the cache action ignores
      # defaults.run.working-directory). Keyed on the workspace too: SwiftPM's
      # .build/workspace-state.json holds absolute artifact paths, so an entry
      # saved by another Mac instance sends `tuist generate` to that instance's
      # checkout ("Couldn't find xcframework at ~/actions-runner/_work/...").
      #
      # #EXP-1680: not on a Mac's PR compile. A PR can't restore another PR's
      # entry, so every new PR uploaded ~790 MB (5 min, and the repo's cache budget)
      # to save a resolve that takes ~30 s from the Mac's own SwiftPM cache.
      - name: Cache SPM dependencies
        if: ${{ !(inputs.compile_only && runner.environment == 'self-hosted') }}
        uses: actions/cache@v4
        with:
          path: apps/ios/Tuist/.build
          key: ${{ runner.os }}-tuist-spm-${{ github.workspace }}-${{ hashFiles('apps/ios/Tuist/Package.swift', 'apps/ios/Tuist/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-tuist-spm-${{ github.workspace }}-

      # EXP-1280: the app links the Exponential UI Swift painter (the plan card's
      # inline surface) only when its Rust core xcframework exists
      # (packages/exponential-ui-swift/Binaries, gitignored; Project.swift checks
      # for it): build it first, the same script exponential-ui.yml runs.
      #
      # #EXP-1680: a PR compile on a Mac reuses them while the two FFI crates
      # are unchanged. The Rust steps are half the job (~12 of 24 min) and about
      # half of all PRs land here; the Swift only sees the crates' bindings. So a
      # hit skips the drift checks below, and the release run still does them all.
      - name: Reuse the xcframeworks (self-hosted PR compile)
        id: xcf
        if: inputs.compile_only && runner.environment == 'self-hosted'
        working-directory: ${{ github.workspace }}
        run: |
          key="$(git rev-parse HEAD:apps/desktop/crates/exponential-ui-ffi HEAD:apps/desktop/crates/exponential-net-ffi HEAD:apps/desktop/crates/eengine HEAD:apps/desktop/crates/eengine-ffi HEAD:apps/desktop/crates/exponential-mobile-ffi | git hash-object --stdin)"
          store="$HOME/.cache/exp-ios-xcframeworks/$key"
          echo "store=$store" >> "$GITHUB_OUTPUT"
          if [ ! -d "$store" ]; then echo "hit=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          touch "$store"
          mkdir -p packages/exponential-ui-swift/Binaries apps/desktop/crates/exponential-net-ffi/out/push apps/desktop/crates/eengine-ffi/out apps/desktop/crates/exponential-mobile-ffi/out
          cp -R "$store/ExponentialUIFFI.xcframework" packages/exponential-ui-swift/Binaries/
          cp -R "$store/ExponentialMobileFFI.xcframework" apps/desktop/crates/exponential-mobile-ffi/out/
          cp -R "$store/ExponentialNetPush.xcframework" apps/desktop/crates/exponential-net-ffi/out/push/
          cp -R "$store/ExponentialEngineFFI.xcframework" apps/desktop/crates/eengine-ffi/out/
          echo "hit=true" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.xcf.outputs.hit != 'true'
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: apps/desktop
      - uses: ./.github/actions/cargo-fetch
        if: steps.xcf.outputs.hit != 'true'
      # #PERF-11: the app's ONE Rust library: genUI's core, the Engine (#VAPP-272:
      # the apps' record outbox) and the FULL eNet node (VAPP-40 / EXP-1457:
      # without it EnetInstallNodesTests, two real nodes over loopback, compile
      # out) in ExponentialMobileFFI.xcframework, linked into ExpCore alone; the
      # script also writes the header-only link stubs the ExponentialUI and
      # ExponentialEngine packages build against (Project.swift).
      - name: Build the app's Rust library
        if: steps.xcf.outputs.hit != 'true'
        working-directory: ${{ github.workspace }}
        env:
          MOBILE_APPLE_TARGETS: ${{ inputs.compile_only && 'aarch64-apple-ios' || 'aarch64-apple-ios aarch64-apple-ios-sim' }}
        run: bash apps/desktop/crates/exponential-mobile-ffi/build-ios.sh
      # EXP-1435: the push-only eNet facade the Notification Service Extension
      # opens sealed pushes with (Project.swift links it only when it exists,
      # like eUI); without it ExpPushTests skip the push-seal fixture. The
      # script regenerates the COMMITTED Swift binding from a host build: any
      # drift from bindings/push is a red job.
      - name: Build the push-only eNet xcframework
        if: steps.xcf.outputs.hit != 'true'
        working-directory: ${{ github.workspace }}
        env:
          ENET_PUSH_ONLY: "1"
          ENET_APPLE_TARGETS: ${{ inputs.compile_only && 'aarch64-apple-ios' || 'aarch64-apple-ios aarch64-apple-ios-sim' }}
        run: |
          bash apps/desktop/crates/exponential-net-ffi/build-ios.sh
          git diff --exit-code -- apps/desktop/crates/exponential-net-ffi/bindings/push/swift \
            || { echo "::error::bindings/push/swift drifted from the Rust facade: regenerate and commit"; exit 1; }

      # VAPP-40 / EXP-1457: the full node's COMMITTED bindings (ExpCore
      # compiles bindings/swift) regenerate from a host build: drift is a red job.
      - name: Check the eNet bindings
        if: steps.xcf.outputs.hit != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          bash apps/desktop/crates/exponential-net-ffi/generate-bindings.sh
          git diff --exit-code -- apps/desktop/crates/exponential-net-ffi/bindings/swift \
            || { echo "::error::bindings/swift drifted from the Rust facade: regenerate and commit"; exit 1; }

      - name: Keep the xcframeworks for the next PR compile
        if: steps.xcf.outputs.hit == 'false'
        working-directory: ${{ github.workspace }}
        env:
          STORE: ${{ steps.xcf.outputs.store }}
        run: |
          root="$(dirname "$STORE")"
          mkdir -p "$root"
          tmp="$(mktemp -d "$root/.tmp.XXXXXX")"
          cp -R packages/exponential-ui-swift/Binaries/ExponentialUIFFI.xcframework \
            apps/desktop/crates/exponential-mobile-ffi/out/ExponentialMobileFFI.xcframework \
            apps/desktop/crates/exponential-net-ffi/out/push/ExponentialNetPush.xcframework \
            apps/desktop/crates/eengine-ffi/out/ExponentialEngineFFI.xcframework "$tmp/"
          # The other Mac instance may have saved this key meanwhile: then drop ours.
          if [ -e "$STORE" ]; then rm -rf "$tmp"; else mv "$tmp" "$STORE"; fi
          find "$root" -mindepth 1 -maxdepth 1 -mtime +7 -exec rm -rf {} +

      # A fresh checkout has no Tuist/.build SPM checkouts; `tuist generate`
      # exits 1 without this.
      - name: Resolve SPM dependencies
        id: deps
        # A second Mac instance resolves into its own SwiftPM cache
        # (EXP_SWIFTPM_CACHE, .github/runners/mac/install.sh): two parallel
        # resolves in the shared one lose Firebase's xcframeworks.
        # Unknown options pass through to `swift package`; never after `--`
        # (tuist puts its passthrough before `resolve`: "Unknown option --").
        run: tuist install ${EXP_SWIFTPM_CACHE:+--cache-path "$EXP_SWIFTPM_CACHE"}

      - name: Compile the app target (Release, unsigned)
        run: |
          tuist generate --no-open
          if ! xcodebuild -workspace Exponential.xcworkspace -scheme Exponential \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            build > "$RUNNER_TEMP/build.log" 2>&1; then
            echo "::group::Compiler errors"
            grep -E "error: " "$RUNNER_TEMP/build.log" | sort -u | head -40 || true
            echo "::endgroup::"
            echo "::group::Tail of the build log"
            tail -80 "$RUNNER_TEMP/build.log"
            echo "::endgroup::"
            exit 1
          fi
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build.log"

      # Runs even when the Release compile failed: a red compile and a drifted
      # fixture are two separate answers, and the second one is cheap once the
      # dependencies are resolved.
      #
      # BOTH schemes, because `bun run ios:test` runs both and the byte-locked
      # markdown-interchange, emoji and status-colour parity suites live in
      # ExpUI, not ExpCore.
      #
      # The gate is the RESULT BUNDLE, never the log: `tuist test` pipes
      # xcodebuild through xcbeautify, which prints `✔ name (0.001 seconds)`
      # and never xcodebuild's `Executed N tests` line, so a grep-the-log gate
      # is dead on arrival — as the old one was. `xcresulttool get test-results
      # summary` reports the real counts, and a per-scheme FLOOR turns a suite
      # that silently stopped running (a scheme renamed, a test target dropped
      # out of it, selective testing sneaking back in) into a red job instead
      # of a green one that executed nothing. Floors sit under today's counts
      # (ExpCore 903, ExpUI 383) so ordinary churn passes.
      - name: Run the ExpCore + ExpUI suites (simulator)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && !inputs.compile_only }}
        run: |
          set -uo pipefail

          # Pin the destination. Left to itself tuist takes whatever simulator
          # the image happens to list first (an iPad, locally) — which device
          # ran the suite should not be a property of the runner image. The
          # select step picked it: iPhone 17 Pro Max on the iOS 27 runtime.
          DEVICE="$IOS_SIM_NAME"

          # A fresh DerivedData per job, never ~/Library/Developer/Xcode's:
          # GRDBSQLite's Copy Module Map phase cp's a read-only modulemap, so a
          # kept one fails the next build (exit 65, 0 tests). Writable again
          # before each suite, which rebuilds into the same dir.
          DD="$RUNNER_TEMP/dd-test"

          fail=0
          run_suite() {
            local scheme="$1" floor="$2"
            local log="$RUNNER_TEMP/test-$scheme.log"
            local dir="$RUNNER_TEMP/xcresult/$scheme"
            rm -rf "$dir" && mkdir -p "$dir"

            [ -d "$DD/Build/Products" ] && chmod -R u+w "$DD/Build/Products"

            local status=0
            tuist test "$scheme" --no-selective-testing \
              --device "$DEVICE" --os "$IOS_SIM_OS" \
              --result-bundle-path "$dir/$scheme.xcresult" \
              -- -derivedDataPath "$DD" \
              > "$log" 2>&1 || status=$?

            local bundle="$dir/$scheme.xcresult"
            [ -d "$bundle" ] || bundle="$(find "$dir" -maxdepth 3 -name '*.xcresult' -print -quit)"
            if [ ! -d "$bundle" ]; then
              echo "::error::$scheme produced no result bundle (tuist exit $status)"
              echo "::group::Tail of the $scheme log"
              tail -80 "$log"
              echo "::endgroup::"
              fail=1
              return 0
            fi

            local summary
            if ! summary="$(xcrun xcresulttool get test-results summary --path "$bundle" --compact)"; then
              echo "::error::$scheme: could not read the result bundle at $bundle"
              fail=1
              return 0
            fi

            local total failed skipped result
            total="$(jq -r '.totalTestCount // 0' <<<"$summary")"
            failed="$(jq -r '.failedTests // 0' <<<"$summary")"
            skipped="$(jq -r '.skippedTests // 0' <<<"$summary")"
            result="$(jq -r '.result // "unknown"' <<<"$summary")"
            echo "$scheme: $result — $total executed, $failed failed, $skipped skipped (floor $floor)"

            if [ "$status" -ne 0 ] || [ "$failed" -ne 0 ]; then
              echo "::error::$scheme failed: $failed failing tests (tuist exit $status)"
              echo "::group::Failing tests ($scheme)"
              jq -r '.testFailures[]? | "\(.targetName)/\(.testName): \(.failureText)"' <<<"$summary" | head -60
              echo "::endgroup::"
              echo "::group::Tail of the $scheme log"
              tail -80 "$log"
              echo "::endgroup::"
              fail=1
            fi

            if [ "$total" -lt "$floor" ]; then
              echo "::error::$scheme executed $total tests, below the floor of $floor — the suite stopped running, it did not pass"
              fail=1
            fi

            return 0
          }

          # ExpCore's test action also runs ExpPushTests (EXP-1435: the
          # push-seal fixture through the binding + the sealed userInfo mapping).
          run_suite ExpCore 800
          run_suite ExpUI 300
          exit "$fail"

      - name: Upload the build and test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-compile-log
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/test-*.log
          if-no-files-found: ignore
          retention-days: 7
