name: release-eagent

# EXP-1420: publishes eAgent (the server-free agent core, EXP-1426) on
# `eagent-v<semver>` tags, the eUI pattern (release-eui.yml): the tag is
# checked against the crates' Cargo.toml first. Crates: eagent and, for ONE
# release, the `exponential-agent-runtime` re-export shim (#EXP-1505, which
# renamed release-agent-runtime.yml; the old `agent-runtime-v*` tags still
# trigger it for that release, then drop the pattern and the shim together).
# Not on crates.io (publish = false): consumers depend on the tag with git = + tag =.
# A dispatched dry run tests and stops before publishing anything.

on:
  push:
    tags: ["eagent-v*", "agent-runtime-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (semver, must match the crates)"
        required: true
      dry_run:
        description: "Dry run: test, publish nothing, create no release"
        type: boolean
        default: true

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || '' }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}

jobs:
  pick:
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          ref="${GITHUB_REF_NAME#eagent-v}"
          v="${VERSION:-${ref#agent-runtime-v}}"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "not a semver version: $v"; exit 1; }
          for c in eagent exponential-agent-runtime; do
            crate=$(grep -m1 '^version' "apps/desktop/crates/$c/Cargo.toml" | cut -d'"' -f2)
            [ "$crate" = "$v" ] || { echo "apps/desktop/crates/$c/Cargo.toml is $crate, the tag says $v: bump it first"; exit 1; }
          done
          echo "version=$v" >> "$GITHUB_OUTPUT"

  test:
    needs: [version, pick]
    runs-on: ${{ fromJSON(needs.pick.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Linux system deps
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev \
            libssl-dev libfontconfig1-dev pkg-config \
            libx11-dev libxi-dev libxtst-dev libpipewire-0.3-dev clang \
            libasound2-dev libopus-dev cmake
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: apps/desktop
      - name: Cargo tests (eAgent + the shim)
        working-directory: apps/desktop
        run: cargo test --no-fail-fast --locked -p eagent -p exponential-agent-runtime
      - name: A git consumer builds (docs/libraries.md, the git-tag policy)
        run: scripts/libs/git-consumer-smoke.sh eagent "$GITHUB_SHA"

  release:
    needs: [version, test]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes
        id: notes
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          # A pushed tag (either prefix) is released as itself; a dispatch cuts eagent-v.
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; else tag="eagent-v$V"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          printf '%s\n\n' "eAgent $V. Install: a git dependency (not on crates.io: the crate compiles repo fixtures in with include_str!)." > notes.md
          printf '```toml\n%b\n```\n\n' "eagent = { git = \"https://github.com/Niach/exponential\", tag = \"$tag\" }" >> notes.md
          printf '%s\n' "Renamed from exponential-agent-runtime: that crate is a deprecated re-export shim in this release only (docs/libraries.md, Migrating)." >> notes.md
          cat notes.md
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: eAgent ${{ needs.version.outputs.version }}
          make_latest: false
          body_path: notes.md
          files: |
            LICENSE
            NOTICE
