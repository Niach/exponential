name: build-ios

# App Store upload for ios-v* tags. Exists because App Store review REJECTS
# binaries built on a beta-macOS host (ITMS-90111 — build 76 carried the
# current release Xcode 26.6 + iOS 26.5 SDK but a beta BuildMachineOSBuild,
# and the local build Mac tracks the macOS beta). This runner is the
# release-OS build environment. NB the "iOS X.Y SDK comes bundled with
# Xcode X.Y" line in Apple's point-release notes is boilerplate — no 26.6
# SDK is downloadable anywhere; 26.5 is current. Signing is cloud-managed
# via the ASC API key (repo secrets ASC_KEY_ID / ASC_ISSUER_ID /
# ASC_KEY_CONTENT); the fastlane lane uploads the build and metadata but
# never submits for review — that tap stays manual in App Store Connect.

on:
  push:
    tags:
      - 'ios-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    # Xcode 26.x requires macOS Tahoe 26.2+, so this must be a macos-26 image
    # (a RELEASE macOS — the whole point of building here).
    runs-on: macos-26

    defaults:
      run:
        working-directory: apps/ios

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select the newest RELEASE Xcode 26.x
        run: |
          for app in /Applications/Xcode*.app; do
            sdk="$(ls "$app"/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/ 2>/dev/null | tr '\n' ' ')"
            echo "$app: $sdk"
          done
          XCODE_APP="$(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No release Xcode 26.x on this image" >&2
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos
          sw_vers

      - name: Install tuist
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Pin tuist
        run: |
          mise use -g tuist@4.202.6
          tuist version

      # A fresh checkout has no Tuist/.build SPM checkouts; `tuist generate`
      # (run inside the fastlane lane) fails without this.
      - name: Resolve SPM dependencies
        run: tuist install

      - name: Write the ASC API key
        run: printf '%s' "$ASC_KEY_CONTENT" | base64 -d > "$RUNNER_TEMP/asc.p8"
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}

      - name: Build and upload to App Store Connect
        run: fastlane release
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc.p8
          LANG: en_US.UTF-8
          LANGUAGE: en_US.UTF-8
          LC_ALL: en_US.UTF-8
