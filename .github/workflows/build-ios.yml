name: build-ios

# App Store upload for ios-v* tags. Exists because App Store review requires
# the LATEST released iOS SDK (ITMS-90111 — e.g. build 76 was rejected for
# SDK 26.5 after the re-released Xcode 26.6 shipped the 26.6 SDK), and the
# local build Mac tracks the macOS beta, which the current release Xcode
# won't launch on. Apple re-releases Xcode under the SAME marketing version
# with a newer SDK, so the guard below checks the bundled SDK, never just
# the Xcode version. Signing is cloud-managed via the ASC API key (repo
# secrets ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_CONTENT); the fastlane lane
# uploads the build and metadata but never submits for review — that tap
# stays manual in App Store Connect.

on:
  push:
    tags:
      - 'ios-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    # Xcode 26.x requires macOS Tahoe 26.2+, so this must be a macos-26 image
    # (a RELEASE macOS — the whole point of building here).
    runs-on: macos-26

    defaults:
      run:
        working-directory: apps/ios

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select a release Xcode carrying the iOS 26.6 SDK
        run: |
          for app in /Applications/Xcode*.app; do
            sdk="$(ls "$app"/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/ 2>/dev/null | tr '\n' ' ')"
            echo "$app: $sdk"
          done
          XCODE_APP="$(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE_APP" ] || [ ! -d "$XCODE_APP/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS26.6.sdk" ]; then
            echo "::error::No release Xcode with the iOS 26.6 SDK on this image — uploading with an older SDK gets rejected (ITMS-90111). Wait for the runner image to pick up the re-released Xcode 26.6." >&2
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos
          sw_vers

      - name: Install tuist
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Pin tuist
        run: |
          mise use -g tuist@4.202.6
          tuist version

      # A fresh checkout has no Tuist/.build SPM checkouts; `tuist generate`
      # (run inside the fastlane lane) fails without this.
      - name: Resolve SPM dependencies
        run: tuist install

      - name: Write the ASC API key
        run: printf '%s' "$ASC_KEY_CONTENT" | base64 -d > "$RUNNER_TEMP/asc.p8"
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}

      - name: Build and upload to App Store Connect
        run: fastlane release
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc.p8
          LANG: en_US.UTF-8
          LANGUAGE: en_US.UTF-8
          LC_ALL: en_US.UTF-8
