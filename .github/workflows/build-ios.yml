name: build-ios

# App Store build + upload for ios-v* tags. Exists because App Store review
# REJECTS binaries built on a beta-macOS host (ITMS-90111 — the local build
# Mac tracks the macOS beta), so the archive MUST be produced on a release-OS
# runner.
#
# The archive is SIGNED here, entitlements and all. EXP-405 hard lesson: an
# unsigned archive (CODE_SIGNING_ALLOWED=NO) has NO entitlements — they exist
# only inside code signatures — so a later `-exportArchive` re-sign stamps the
# bare profile minimum and ships an app without keychain-access-groups, app
# groups, push, SIWA, or universal links. Build 77 shipped that way and logged
# every user out on every restart. The entitlement gate below makes that
# failure mode impossible to ship again.
#
# Signing uses the LOCAL Apple Development + Distribution certs imported from
# the IOS_DIST_CERT_P12 secret — never Apple's cloud signer, whose
# NFD-decomposed designated requirement (umlaut in the team name) fails
# validation on nested frameworks (error 90035). Profiles are still
# cloud-managed via the ASC API key (-allowProvisioningUpdates).
# The pilot upload goes to TestFlight INTERNAL; the App Store "Submit for
# Review" tap stays manual in App Store Connect.

on:
  push:
    tags:
      - 'ios-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    # GitHub's `xcode-27` image: release macOS 27 with release Xcode 27.1
    # (the whole point of building here), the same Xcode the MacBook and
    # test-ios use (.github/scripts/select-xcode.sh).
    runs-on: xcode-27
    # Clean archive + export + TestFlight upload is ~35 min; past this the
    # build is wedged (a provisioning prompt, a stalled ASC upload), and a
    # release job must not sit on a runner for six hours.
    timeout-minutes: 90

    # EXP-1430: the app-specific bits; a second app (spezl) copying this job
    # changes these, the steps stay. The entitlement lists ARE the EXP-405
    # gate: every key listed must be in the signed ipa, so list what the
    # app's .entitlements files declare (space-separated).
    env:
      APPLE_TEAM_ID: V6W7BVCSM8
      XC_WORKSPACE: Exponential.xcworkspace
      XC_SCHEME: Exponential
      XC_ARCHIVE: Exponential.xcarchive
      IPA_NAME: Exponential.ipa
      APP_ENTITLEMENTS: >-
        keychain-access-groups
        com.apple.security.application-groups
        aps-environment
        com.apple.developer.applesignin
        com.apple.developer.associated-domains
      APPEX_ENTITLEMENTS: >-
        keychain-access-groups
        com.apple.security.application-groups

    defaults:
      run:
        working-directory: apps/ios

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 27.1 (release, the iOS 27 SDK)
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/select-xcode.sh"
          xcodebuild -showsdks | grep iphoneos
          sw_vers

      - name: Install tuist
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Pin tuist
        run: |
          mise use -g tuist@4.202.6
          tuist version

      # EXP-1280: the app links the Exponential UI Swift painter (the plan card's
      # inline surface) only when its Rust core xcframework exists
      # (packages/exponential-ui-swift/Binaries, gitignored; Project.swift checks
      # for it): build it first, the same script exponential-ui.yml runs.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - name: Build the Exponential UI xcframework
        working-directory: ${{ github.workspace }}
        # EXP-1364: the App Store archive links the device slice only.
        env:
          EXPONENTIAL_UI_APPLE_TARGETS: aarch64-apple-ios
        run: bash apps/desktop/crates/exponential-ui-ffi/build-ios.sh

      # A fresh checkout has no Tuist/.build SPM checkouts; `tuist generate`
      # fails without this.
      - name: Resolve SPM dependencies
        run: tuist install

      # Local signing identities (Apple Development for the archive, Apple
      # Distribution for the export) in an unlocked temp keychain.
      # EXP-1430: shared with spezl as .github/actions/apple-signing.
      - name: Import signing certificates
        uses: ./.github/actions/apple-signing
        with:
          p12: ${{ secrets.IOS_DIST_CERT_P12 }}
          password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      - name: Write ASC API key
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          # The secret may be raw PEM or base64-wrapped PEM — accept both.
          if [[ "$ASC_KEY_CONTENT" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s' "$ASC_KEY_CONTENT" > "$RUNNER_TEMP/asc.p8"
          else
            echo "$ASC_KEY_CONTENT" | base64 -d > "$RUNNER_TEMP/asc.p8"
          fi
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/asc.p8" || { echo "::error::ASC key is not valid PEM"; exit 1; }

      - name: Archive (signed)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          tuist generate --no-open
          set -o pipefail
          xcodebuild -workspace "$XC_WORKSPACE" -scheme "$XC_SCHEME" \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/$XC_ARCHIVE" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            clean archive | tail -40

      - name: Export the App Store ipa
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/exportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$XC_ARCHIVE" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la "$RUNNER_TEMP/export"

      # The gate that makes EXP-405 unshippable: the signed ipa MUST carry the
      # app's real entitlements. codesign requirements-checking on the final
      # artifact — not on intermediate build state.
      - name: Verify entitlements
        run: |
          cd "$RUNNER_TEMP"
          rm -rf ipa-check && mkdir ipa-check && cd ipa-check
          unzip -q "../export/$IPA_NAME"
          APP="$(ls -d Payload/*.app)"
          fail=0
          check() {
            local target="$1"; shift
            local ents
            ents="$(codesign -d --entitlements :- "$target" 2>/dev/null)"
            for key in "$@"; do
              if ! grep -q "$key" <<<"$ents"; then
                echo "::error::$target is missing entitlement $key"
                fail=1
              fi
            done
            echo "--- $target entitlements OK for: $*"
          }
          # EXP-1430: an emptied list must never pass the gate silently.
          [ -n "$APP_ENTITLEMENTS" ] && [ -n "$APPEX_ENTITLEMENTS" ] \
            || { echo "::error::APP_ENTITLEMENTS / APPEX_ENTITLEMENTS are empty"; exit 1; }
          # shellcheck disable=SC2086 # the lists split on purpose
          check "$APP" $APP_ENTITLEMENTS
          # shellcheck disable=SC2086
          check "$APP"/PlugIns/*.appex $APPEX_ENTITLEMENTS
          # aps-environment must be production in an App Store build.
          codesign -d --entitlements :- "$APP" 2>/dev/null | grep -A1 aps-environment | grep -q production \
            || { echo "::error::aps-environment is not production"; fail=1; }
          codesign --verify --deep --strict -v "$APP"
          exit $fail

      # EXP-1430: shared with spezl as .github/actions/testflight-upload.
      - name: Upload to TestFlight (internal)
        uses: ./.github/actions/testflight-upload
        with:
          ipa: ${{ runner.temp }}/export/${{ env.IPA_NAME }}
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          asc-key-content: ${{ secrets.ASC_KEY_CONTENT }}

      - name: Upload the archive artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcarchive
          path: ${{ runner.temp }}/${{ env.XC_ARCHIVE }}
          retention-days: 3
