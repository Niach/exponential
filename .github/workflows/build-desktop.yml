name: build-desktop
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      channels:
        description: Which channels to build (tag pushes build production only)
        type: choice
        default: both
        options:
          - both
          - production
          - staging

jobs:
  # EXP-1364: the Linux legs build on the Mint when it is up (its runner image
  # is Ubuntu 24.04 too, the same glibc floor). macOS + Windows stay on GitHub:
  # the .app is signed and notarized there, never on a beta-macOS laptop.
  pick:
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit
    with:
      linux-fallback: ubuntu-24.04

  # Compute the build matrix. EXP-1364: a tag push builds PRODUCTION only
  # (staging is artifacts nobody downloads from a release); a dispatch builds
  # the channels it asks for (default both). Windows is its own matrix: the
  # release waits on macOS + Linux, the .exe attaches when it lands.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      windows: ${{ steps.gen.outputs.windows }}
    steps:
      - id: gen
        shell: bash
        run: |
          channels="${{ github.event.inputs.channels || 'production' }}"
          # Two channels (production → app.exponential.at, staging →
          # next.exponential.at) × three OSes. Staging builds pass `--features
          # staging` and carry a distinct app id so both can coexist.
          #
          # macOS = macos-26, the image build-ios.yml already uses (EXP-1196
          # needed its Xcode 26 SDK; EXP-1273 no longer does, the image
          # stays). The .app still runs from macOS 13 (Info.plist
          # LSMinimumSystemVersion). EXP-1430: target universal-apple-darwin
          # = arm64 + x86_64 slices lipo'd into one .app (Intel Macs, no
          # voice there); still the one Exponential-<channel>.dmg asset.
          # aarch64-apple-darwin here = an arm64-only build.
          #
          # Linux = ubuntu-24.04: the runner's glibc (2.39) is the AppImage's
          # compatibility floor (forward-compatible only); the fleet's Linux
          # desktops are 24.04-based (Mint 22). Computer use is pure-Rust X11
          # since EXP-1273: nothing system-side at build or load time.
          all='[
            {"os":"macos-26","target":"universal-apple-darwin","channel":"production"},
            {"os":"macos-26","target":"universal-apple-darwin","channel":"staging"},
            {"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","channel":"production"},
            {"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","channel":"staging"},
            {"os":"windows-latest","target":"x86_64-pc-windows-msvc","channel":"production"},
            {"os":"windows-latest","target":"x86_64-pc-windows-msvc","channel":"staging"}
          ]'
          if [ "$channels" = "both" ]; then
            include="$(echo "$all" | jq -c .)"
          else
            include="$(echo "$all" | jq -c --arg c "$channels" '[.[] | select(.channel==$c)]')"
          fi
          echo "matrix={\"include\":$(jq -c '[.[] | select(.os != "windows-latest")]' <<<"$include")}" >> "$GITHUB_OUTPUT"
          echo "windows={\"include\":$(jq -c '[.[] | select(.os == "windows-latest")]' <<<"$include")}" >> "$GITHUB_OUTPUT"

  # Gate 1: the committed generated files must match contract.json / tokens.json.
  # (test.yml's web vitest also gates all six Swift/Kotlin/Rust outputs on every
  # push via codegen-drift.test.ts; this job stays as the release-tag backstop.)
  codegen-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter @exp/domain-contract generate
      - run: bun run --filter @exp/design-tokens generate
      # EXP-551 — the shared emoji dataset (all four clients).
      - run: bun run --filter @exp/emoji generate
      # EXP-375 — the notices merge is pure bun, so it belongs on this gate too.
      # Only the merge: re-collecting needs cargo/gradle/network and runs in
      # test.yml's `desktop` and `android` jobs.
      - run: bun run --filter @exp/licenses generate
      # EXP-273/EXP-924 — the one icon registry; the desktop's glyph table and
      # svg assets are generator output too.
      - run: bun run --filter @exp/icons generate
      - name: Fail if the committed generated files drifted
        run: |
          git diff --exit-code -- \
            apps/desktop/crates/domain/src/contract.generated.rs \
            apps/desktop/crates/ui/src/icons.generated.rs \
            apps/desktop/assets/icons \
            packages/icons/src \
            packages/ui/src/icons.generated.ts \
            apps/ios/ExpUI/Sources/AppIcons.generated.swift \
            apps/android/app/src/main/java/com/exponential/app/ui/icons/ExpIcons.generated.kt \
            apps/desktop/crates/theme/src/tokens.generated.rs \
            apps/desktop/assets/emoji.json \
            apps/web/src/lib/emoji.generated.json \
            apps/ios/Exponential/Resources/emoji.json \
            apps/android/app/src/main/assets/emoji.json \
            apps/ios/ExpCore/Sources/Domain/DomainContract.generated.swift \
            apps/ios/ExpUI/Sources/DesignTokens.generated.swift \
            apps/android/app/src/main/java/com/exponential/app/domain/DomainContract.generated.kt \
            apps/android/app/src/main/java/com/exponential/app/ui/theme/DesignTokens.generated.kt \
            apps/desktop/assets/licenses/NOTICES.txt \
            apps/web/public/NOTICES.txt \
            apps/marketing/public/NOTICES.txt \
            apps/ios/Exponential/Resources/NOTICES.txt \
            apps/android/app/src/main/assets/NOTICES.txt

  # Gate 2 (EXP-222): everything statically linked into the shipped binary must
  # carry an allowed license (deny.toml). Zed's GPL-3.0 ztracing/zlog are patched
  # out to clean-room shims in apps/desktop/Cargo.toml — this keeps a copyleft
  # dependency from ever sneaking back in.
  license-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: apps/desktop/Cargo.toml
          command: check licenses

  build:
    needs: [codegen-drift, license-audit, setup, pick]
    uses: ./.github/workflows/desktop-build.yml
    secrets: inherit
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      linux-runner: ${{ needs.pick.outputs.linux }}

  build-windows:
    needs: [codegen-drift, license-audit, setup]
    if: needs.setup.outputs.windows != '{"include":[]}'
    uses: ./.github/workflows/desktop-build.yml
    secrets: inherit
    with:
      matrix: ${{ needs.setup.outputs.windows }}

  release:
    needs: build
    # `!cancelled()` because `needs: build` covers BOTH channels: a flaky
    # STAGING leg used to skip this job and leave a tag with no Release at all
    # (0.8.34, `hdiutil: create failed - Resource busy`). Staging is
    # artifacts-only, so it must never gate the production publish — the guard
    # below is what actually enforces a complete production set. NOT `always()`:
    # that runs even on a CANCELLED run, so hitting cancel on a tag build whose
    # production legs had already uploaded would still publish it as `latest`
    # and self-update the fleet to a build we deliberately killed.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/desktop-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download production artifacts
        uses: actions/download-artifact@v4
        with:
          # The production macOS + Linux legs — exactly one asset per OS
          # (EXP-68): linux .AppImage, macOS .dmg (or the ad-hoc .zip fallback
          # while unsigned). The Windows .exe attaches later (release-windows).
          pattern: exp-desktop-production-*
          path: dist
          merge-multiple: true
      - name: Require the production Linux + macOS assets
        # Linux + macOS failing is a broken release — fail loudly instead of
        # publishing a partial one. Windows never gates it (release-windows).
        run: |
          shopt -s nullglob
          linux=(dist/Exponential-production-*.AppImage)
          macos=(dist/Exponential-production.dmg dist/exp-desktop-production.zip)
          [ ${#linux[@]} -gt 0 ] || { echo "missing production AppImage" >&2; exit 1; }
          [ ${#macos[@]} -gt 0 ] || { echo "missing production macOS .dmg/.zip" >&2; exit 1; }
      # EXP-376: the raw Windows .exe has no bundle to carry them, so the
      # Release page is the only route by which a Windows user receives the
      # Apache-2.0 License text (section 4(a)) and our NOTICE (section 4(d)).
      # Placed before the checksum step so they land in SHA256SUMS.txt too.
      - name: Check out the licence files and the feed action
        uses: actions/checkout@v4
        with:
          path: repo
          sparse-checkout: |
            LICENSE
            NOTICE
            apps/desktop/assets/licenses/NOTICES.txt
            .github/actions/updater-feed
          sparse-checkout-cone-mode: false
      - name: Add LICENSE, NOTICE and NOTICES.txt to the release
        run: |
          set -euo pipefail
          cp repo/LICENSE repo/NOTICE dist/
          cp repo/apps/desktop/assets/licenses/NOTICES.txt dist/
      # EXP-1430: SHA256SUMS.txt + its minisign signature. A pinned public key
      # (vars.UPDATE_SIGNING_PUBKEY, compiled into the clients) without the
      # secret FAILS here: every pinned client would refuse the release.
      - name: Signed checksums
        uses: ./repo/.github/actions/updater-feed
        with:
          dir: dist
          signing-key: ${{ secrets.UPDATE_SIGNING_KEY }}
          public-key: ${{ vars.UPDATE_SIGNING_PUBKEY }}
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Desktop MUST own releases/latest: the marketing download links
          # (`releases/latest/download/<asset>`) and the in-app update check
          # both resolve `latest` (android releases set make_latest: false).
          make_latest: true
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  # EXP-1364: the Windows .exe joins the published release when its (slowest)
  # leg lands, with its line appended to SHA256SUMS.txt. Until then the
  # updater degrades to the browser-link banner on Windows, as it does for
  # any platform whose asset is absent. A failed Windows leg = a warning.
  release-windows:
    needs: [build-windows, release]
    if: ${{ !cancelled() && needs.release.result == 'success' && startsWith(github.ref, 'refs/tags/desktop-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the production Windows artifact
        id: dl
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: exp-desktop-production-x86_64-pc-windows-msvc
          path: dist
      - name: Fetch the published checksums
        id: sums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${{ steps.dl.outcome }}" != success ] || [ ! -f dist/Exponential-production-x86_64-windows.exe ]; then
            echo "::warning::no production Windows .exe — the release stays without it"
            exit 0
          fi
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS.txt -D dist
          echo "attach=true" >> "$GITHUB_OUTPUT"
      - name: Check out the feed action
        if: steps.sums.outputs.attach == 'true'
        uses: actions/checkout@v4
        with:
          path: repo
          sparse-checkout: .github/actions/updater-feed
          sparse-checkout-cone-mode: false
      # EXP-1430: the .exe line joins the sums, and the WHOLE file is re-signed.
      - name: Append the .exe and re-sign
        id: feed
        if: steps.sums.outputs.attach == 'true'
        uses: ./repo/.github/actions/updater-feed
        with:
          dir: dist
          append: Exponential-production-x86_64-windows.exe
          signing-key: ${{ secrets.UPDATE_SIGNING_KEY }}
          public-key: ${{ vars.UPDATE_SIGNING_PUBKEY }}
      # The .exe first, then sums + signature in one call: a client racing the
      # gap sees either the old pair or a refused mismatch, never a bad .exe.
      - name: Attach it to the release
        if: steps.sums.outputs.attach == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber dist/Exponential-production-x86_64-windows.exe
          feed=(dist/SHA256SUMS.txt)
          [ "${{ steps.feed.outputs.signed }}" = true ] && feed+=(dist/SHA256SUMS.txt.minisig)
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "${feed[@]}"
