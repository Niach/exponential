name: build-android

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      # EXP-1430: Play upload only runs on an android-v* tag ref (pick the tag
      # in "Use workflow from"); production is never a choice, promotion stays
      # manual (fastlane production / the Play Console).
      play-track:
        description: Play track for the signed bundle
        type: choice
        options: [alpha, beta, internal]
        default: alpha
      play-status:
        description: Play release status (draft = a person rolls it out in the console)
        type: choice
        options: [draft, completed]
        default: draft

permissions:
  contents: write

jobs:
  # EXP-1364: the release builds on the Mint when it is up.
  pick:
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit

  build:
    needs: pick
    runs-on: ${{ fromJSON(needs.pick.outputs.linux) }}

    env:
      # Override the repo's 2G default — packaging the release APK + Play
      # bundle in one invocation exhausts that heap on CI runners.
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6g -Dfile.encoding=UTF-8"
      # EXP-1430: the Play app record (production applicationId in
      # apps/android/app/build.gradle.kts) and its fastlane changelogs.
      PLAY_PACKAGE: at.exponential
      PLAY_METADATA_DIR: apps/android/fastlane/metadata/android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0 ndk;28.2.13676358'

      # EXP-1280: the app links the Exponential UI Compose painter (`:ui-compose`),
      # whose AAR bundles the Rust core as the `exponential-ui-ffi` `.so`: build it
      # for every shipped ABI before gradle runs (the same steps as exponential-ui.yml).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: apps/desktop
      - run: cargo install cargo-ndk --locked
      - name: Build the Exponential UI facade for Android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          SKIP_BINDINGS: '1'
        run: bash apps/desktop/crates/exponential-ui-ffi/build-android.sh
      # EXP-1435: the app opens sealed pushes with the eNet push-only facade
      # (RustCrypto only): its `.so` for every shipped ABI, and the host build
      # PushSealFixtureTest loads through JNA in the unit tests below.
      - name: Build the eNet push-only facade for Android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ENET_PUSH_ONLY: '1'
          SKIP_BINDINGS: '1'
        run: bash apps/desktop/crates/exponential-net-ffi/build-android.sh
      - name: Build the eNet push-only facade for the JVM unit tests
        working-directory: apps/desktop
        run: cargo build -p exponential-net-ffi --release --no-default-features --features cli

      - name: Cache Gradle packages
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/android/**/*.gradle*', 'apps/android/gradle/wrapper/gradle-wrapper.properties', 'apps/android/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Extract version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/android-v}
          else
            VERSION=dev-${GITHUB_SHA::7}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      # The keystore is stored base64-encoded in the ANDROID_KEYSTORE_B64 secret;
      # decode it to a path the gradle signing config can read. Skipped gracefully
      # when the secret is absent (unsigned artifacts) — secrets can't be used in
      # step `if:` expressions, so the emptiness check lives in the script.
      - name: Materialize signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/upload.jks" >> $GITHUB_ENV
            echo "BUNDLE_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "No keystore secret — building unsigned."
          fi

      - name: Run unit tests
        working-directory: apps/android
        run: ./gradlew :app:testProductionDebugUnitTest --no-daemon

      # ONE production release APK + ONE production Play bundle (EXP-68) —
      # the debug and staging artifacts are gone from releases (a staging
      # build is a local `./gradlew :app:assembleStagingDebug` away when needed).
      - name: Build release APK + Play bundle
        working-directory: apps/android
        # Signed when the RELEASE_* / ANDROID_KEYSTORE_B64 secrets are present,
        # otherwise unsigned (keeps CI green pre-keystore).
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleProductionRelease :app:bundleProductionRelease --no-daemon

      - name: Collect artifacts
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          APK_DIR="apps/android/app/build/outputs/apk"
          AAB_DIR="apps/android/app/build/outputs/bundle"
          mkdir -p dist
          # Release APKs are suffixed -unsigned when no signing config applies;
          # resolve by glob so this works signed or unsigned.
          cp $(ls ${APK_DIR}/production/release/app-production-release*.apk | head -n1) "dist/exponential-production-release-${VERSION}.apk"
          cp "${AAB_DIR}/productionRelease/app-production-release.aab" "dist/exponential-production-release-${VERSION}.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt)
          # EXP-1430: picks changelogs/<versionCode>.txt for the Play upload.
          VC="$(grep -oE 'versionCode = [0-9]+' apps/android/app/build.gradle.kts | head -n1 | grep -oE '[0-9]+')"
          echo "VERSION_CODE=$VC" >> "$GITHUB_ENV"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ steps.version.outputs.VERSION }}
          path: dist/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          # Never claim releases/latest — the marketing download links and the
          # desktop in-app update check both resolve `latest` and expect a
          # desktop-v* release (build-desktop.yml pins make_latest: true).
          make_latest: false
          name: Android ${{ steps.version.outputs.VERSION }}
          body: |
            Built from ${{ github.sha }}.
            Production release APK + Play bundle (`.aab`), signed when the signing secrets are configured, otherwise unsigned (sign locally before distributing). A signed `.aab` goes to the Play closed track automatically when `PLAY_SERVICE_ACCOUNT_JSON` is set; otherwise upload it via the fastlane lanes in `apps/android/fastlane/`.
          files: |
            dist/*

      # EXP-1430: the signed bundle goes to the closed track the `closed` lane
      # uses (alpha, as a draft like that lane) unless a dispatch picks another.
      # No PLAY_SERVICE_ACCOUNT_JSON secret = a warning, never a red run.
      # The R8 mapping + native symbols ride the AAB, so no mapping-file here.
      - name: Upload to Google Play
        if: startsWith(github.ref, 'refs/tags/android-v') && env.BUNDLE_SIGNED == 'true'
        uses: ./.github/actions/play-upload
        with:
          service-account-json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          package-name: ${{ env.PLAY_PACKAGE }}
          aab: dist/exponential-production-release-${{ steps.version.outputs.VERSION }}.aab
          track: ${{ inputs.play-track || 'alpha' }}
          status: ${{ inputs.play-status || 'draft' }}
          version-code: ${{ env.VERSION_CODE }}
          changelog-dir: ${{ env.PLAY_METADATA_DIR }}
