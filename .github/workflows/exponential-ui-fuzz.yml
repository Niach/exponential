name: exponential-ui-fuzz

# VAPP-107: the Exponential UI security fuzzing, NIGHTLY (never on a pull
# request: a fuzz budget is minutes per target). The Rust core's cargo-fuzz
# targets (apps/desktop/crates/exponential-ui/fuzz: reduce + expand, the
# expression language, JSON pointers, theme loading, the transport decoders,
# the host router, a live surface, the media header readers + URL policy)
# each run for a fixed budget on nightly Rust with ASan; a crash fails the
# job and its reproducer is uploaded. The TypeScript reference and the React
# markdown painter run their fast-check property tests with a nightly-sized
# budget (FC_NUM_RUNS). A finding becomes an issue under VAPP-84 and a fix
# with a regression test; the corpus is not persisted (every run starts from
# the seeds libFuzzer derives).

# 2026-10-26: by hand only (the nightly schedule is off: it only produced red noise).
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Seconds per fuzz target'
        default: '600'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [reduce, expr, pointer, theme, decoders, router, surface, media]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/crates/exponential-ui/fuzz
      - name: cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz ${{ matrix.target }}
        working-directory: apps/desktop/crates/exponential-ui
        env:
          CARGO_TARGET_DIR: ''
        run: |
          unset CARGO_TARGET_DIR
          cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=${{ github.event.inputs.seconds || 600 }} -max_len=65536 -timeout=30
      - name: Reproducer
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: apps/desktop/crates/exponential-ui/fuzz/artifacts/
          if-no-files-found: ignore

  property-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Core package property tests (fast-check, nightly budget)
        env:
          FC_NUM_RUNS: '5000'
        run: bun test packages/exponential-ui/src/property.test.ts
      - name: React markdown property tests (fast-check, nightly budget)
        working-directory: packages/exponential-ui-react
        env:
          FC_NUM_RUNS: '5000'
        run: bunx vitest run src/markdown.property.test.tsx
