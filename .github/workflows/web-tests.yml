name: web-tests

# EXP-1364: the web part of the PR gate (test.yml): the typecheck and the web
# vitest suite as four shards, all in parallel. The small bun suites and the
# package tests run in release-suite.yml (`extras`).

on:
  workflow_call: {}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Typecheck web
        run: bun run typecheck

  unit:
    name: unit (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Web unit tests (shard ${{ matrix.shard }}/4)
        working-directory: apps/web
        env:
          # Unit tests never query the DB, but db/connection.ts throws at
          # import time without a URL — give it an unreachable dummy.
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:59999/ci
        run: bunx vitest run --config vitest.config.ts --shard=${{ matrix.shard }}/4
