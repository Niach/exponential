name: web-tests

# EXP-1364: the web gate, shared by test.yml (the pull request) and
# build-web.yml (the image never ships on a red run). The web vitest suite was
# one 13-minute job; it runs as SHARDS parallel GitHub-hosted jobs now, next to
# one job for the typecheck and every other bun suite. GitHub-hosted on
# purpose: four free parallel runners beat one self-hosted machine here.

on:
  workflow_call: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Typecheck web
        run: bun run typecheck
      - name: Package unit tests (contract, Exponential UI, @exp/ui, MCP apps)
        run: bun run test:packages
      # EXP-566: the view-catalog drift gates (catalog ↔ native shot names ↔
      # recipe registry ↔ route coverage) and the store writer's tests — vitest
      # doesn't run bun-test packages, so they need their own step.
      - name: Screenshot store tests
        run: bun run test:shots
      - name: Widget unit tests
        run: bun run test:widget
      - name: Steer relay + ticket tests
        run: bun run test:steer-relay
      # EXP-446: nothing ran the push relay's typecheck in CI before; EXP-1289
      # added its bun-test suite (transport retry, deep health check, stats).
      - name: Typecheck push relay
        run: bun run --filter @exp/push-relay typecheck
      - name: Push relay tests
        run: bun run test:push-relay

  unit:
    name: unit (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Web unit tests (shard ${{ matrix.shard }}/4)
        working-directory: apps/web
        env:
          # Unit tests never query the DB, but db/connection.ts throws at
          # import time without a URL — give it an unreachable dummy.
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:59999/ci
        run: bunx vitest run --config vitest.config.ts --shard=${{ matrix.shard }}/4
