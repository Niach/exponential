name: check-desktop-windows

# FEED-189: the gate's desktop `cargo check` runs on Linux, so `cfg(windows)`
# code merges uncompiled, and the release's Windows leg is continue-on-error.
# This compiles the app for Windows on every PR that touches the desktop
# workspace (#EXP-1805: was only the update and relaunch path; a warm run
# takes ~4-8 min on a free hosted runner) and runs the vendored
# gpui-pre-windows' own tests (#ERR-2/#ERR-3). Informational: not part of
# `gate`. The macOS twin is check-desktop-macos.yml.

on:
  pull_request:
    paths:
      - ".github/workflows/check-desktop-windows.yml"
      - ".github/actions/cargo-fetch/**"
      - "apps/desktop/**"

permissions:
  contents: read

concurrency:
  group: check-desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
          key: windows-check
      - uses: ./.github/actions/cargo-fetch
      - name: cargo check
        shell: bash
        run: cargo check --locked --manifest-path apps/desktop/Cargo.toml -p app
      # #ERR-2 / #ERR-3: the vendored gpui-pre-windows patch's own tests.
      - name: gpui-pre-windows patch tests
        shell: bash
        run: cargo test --locked --manifest-path apps/desktop/Cargo.toml -p gpui-pre-windows --lib -- exponential_patch_tests system_notifications::tests
