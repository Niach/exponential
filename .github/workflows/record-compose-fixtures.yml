name: record-compose-fixtures

# The Compose painter's snapshot fixtures (Roborazzi images, the Compose
# snapshot, the swift-parity-pending list, the real-font ratchet) compare
# pixel- and layout-exact under Robolectric, so they must be recorded on the
# same platform CI verifies them on (ubuntu). A Mac-recorded set fails the
# `compose` job. This workflow re-records them (and the real-font ratchet
# `ui-compose/src/test/conformance-known.json`) on ubuntu, verifies the
# re-recorded set passes, and uploads it as the `compose-fixtures` artifact
# to commit by hand (`workflow_dispatch`, or a push that edits this file).
# The `gpui` job (VAPP-102) does the same for the gpui conformance RATCHET
# (`packages/exponential-ui/fixtures/conformance-known.json`): its test only
# builds on Linux, so after a web baseline rewrite the budget is re-recorded
# here and uploaded as `gpui-ratchet`.
# FEED-128 (2026-10-21): re-recorded for the 4th built-in theme `orange`
# (the Compose golden `kitchen-sink-orange.png` + the gpui budget).
# N-12 (2026-10-23): re-recorded for the core catalog's DockCard (the
# kitchen sink's dock-card node: the Compose goldens + `DockCard.png`, the
# web baseline rewrite's gpui budget).
# EXP-1604 (2026-11-01): re-recorded for the core catalog's Motion (the
# kitchen sink's motion node: the Compose goldens + `Motion.png`).
# VAPP-232 (2026-11-03): re-recorded for the core catalog's Calendar and
# Timeline (their component images `Calendar.png` + `Timeline.png`).
# VAPP-250 (2026-11-04): re-recorded for the phone Timeline (one scroller, a
# pinned label column), `tableColumnMin` 96 and the dashboard's Timeline.
# EXP-1670 (2026-11-05): re-recorded for the kitchen sink's subtitle
# `Online · 2 sessions` (the product never says run).
# VAPP-280 (2026-11-06): re-recorded for the core catalog's SettingsRow
# (`SettingsRow.png`; the kitchen-sink goldens, the Compose ratchet and the
# gpui budget came back unchanged).
# VAPP-285 (2026-11-06): re-recorded for the kitchen sink's Tree (a
# repository tree after the Outline: the Compose goldens + the web
# baseline rewrite's gpui budget).
# FEED-202 (2026-11-08): re-recorded for Table `totals` and RecordTable
# `search` / `totals` (the six new catalog-components cases).
# VAPP-285 (2026-11-06, rebased onto VAPP-277): re-recorded for the kitchen sink with the rail AND the Tree (kitchen-sink-exponential.png + -orange.png; the ratchets unchanged).
# VAPP-290 (2026-11-07): re-recorded for the core catalog's Window (the
# kitchen sink's window node: the Compose goldens + `Window.png`, the web
# baseline rewrite's gpui budget).
# FEED-200 (2026-11-08): re-recorded for Tabs `swipeable` (the catalog's
# `Tabs/swipeable` case, the Tabs specimen's swipeable case).
# EXP-1745 (2026-11-08): re-recorded for the Exponential theme's Switch at
# the IDE's 36×20 (glass-active off track, light off-thumb, no shadow).

# FEED-205 (2026-11-08): re-recorded for the core catalog's Chart
# `valueFormat=currency` and `rows+valueFormat=compact` states (the Compose
# snapshot `components.json`).
# EXP-1629 (2026-11-09): re-recorded for the core catalog's KeyRecorder
# (`KeyRecorder.png`, pending in ComponentSnapshotImagesTest until then;
# not in the kitchen sink, so its goldens come back unchanged).
# EDE-65 (2026-11-09): re-recorded for the core catalog's Embed (the
# `Embed/example` case of the Compose snapshot `components.json` and
# `Embed.png`, pending in ComponentSnapshotImagesTest until then; not in the
# kitchen sink, so its goldens come back unchanged).
# EDE-65 (2026-11-09): re-recorded for the core catalog's Embed (the
# Compose snapshot `components.json` + `Embed.png`; not in the kitchen sink).
# EDE-65 (2026-11-09): re-recorded for the fixed measure's Embed (its card
# laid out at the Embed's width: `Embed/example` at the Approve button's
# height, not 0).
# EXP-1629 (2026-11-09): re-recorded for the Avatar (xl, the palette by
# seed, half-size regular initials, the picture ring): `Avatar.png`, the
# kitchen-sink goldens (seeded avatars), the CallSurface avatar.
# EXP-1629 (2026-11-09, after #2440): re-recorded again for the kitchen
# sink with the Select row trigger AND the seeded avatars.
# EXP-1629 (2026-11-09, after #2405): re-recorded on Compose 1.11 for the
# Avatar, CallSurface and kitchen-sink goldens.
# EXP-1629 (2026-11-09, after #2446): the mdpi kitchen-sink goldens with
# the seeded avatars.
# EXP-1629 (2026-11-09, #2441 after the KeyRecorder merge): re-recorded for
# the new Kbd look and KbdGroup (`Kbd.png`, `KbdGroup.png`, `components.json`).
# EXP-1629 (2026-11-09): re-recorded for Input `variant: row` (`Input.png`).
# EXP-1629 (2026-11-09): re-recorded for KeyRecorder's caps as a KbdGroup
# (`KeyRecorder.png`, `components.json`).
# EXP-1629 (2026-11-09): re-recorded for the Select `row` trigger at the
# IDE's metrics (40.82 px, 14 px padding, 12.25 type, 14 px chevron).
# EXP-1629 (2026-11-09): again for the row Select's IDE popup (value anchor,
# backgroundClip, the popover shadow, the list fade) and the Avatar picture fill.
on:
  workflow_dispatch: {}
  push:
    # Branch pushes only: `paths` is not evaluated for a tag push, so without
    # the branch filter every release tag (five per train) re-ran this
    # workflow on the same commit (EXP-1337).
    branches:
      - '**'
    paths:
      - '.github/workflows/record-compose-fixtures.yml'

jobs:
  record:
    runs-on: ubuntu-latest
    # JVM tests load the host build through JNA: no Android .so, no cargo-ndk.
    env:
      ENET_SKIP_NATIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - uses: ./.github/actions/cargo-fetch
      - name: Host build of the facade (the JVM tests load it through JNA)
        working-directory: apps/desktop
        run: cargo build --locked -p exponential-ui-ffi --release
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/gradle-dist
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'
      - name: Re-record the Compose fixtures
        working-directory: packages/exponential-ui-compose
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/target
          EXPONENTIAL_UI_CONFORMANCE_REPORT: ${{ github.workspace }}/.conformance/exponential-ui-compose.json
          EXPONENTIAL_UI_RECORD: '1'
          EXP_UI_WRITE_FIXTURES: '1'  # the real-font ratchet (RealFontConformanceTest) re-records its budget too
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :ui-compose:testDebugUnitTest --no-daemon
      - name: Verify the re-recorded fixtures pass
        working-directory: packages/exponential-ui-compose
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/target
          EXPONENTIAL_UI_CONFORMANCE_REPORT: ${{ github.workspace }}/.conformance/exponential-ui-compose.json
        run: ./gradlew :ui-compose:testDebugUnitTest :ui-compose-primitives:testDebugUnitTest --no-daemon --rerun-tasks
      - name: What changed
        run: git status --short
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-fixtures
          path: |
            packages/exponential-ui-compose/ui-compose/src/test/snapshots/
            packages/exponential-ui-compose/ui-compose/src/test/conformance-known.json
            packages/exponential-ui-compose/ui-compose/conformance/
            .conformance/
          include-hidden-files: true  # .conformance/ is a dot-directory; upload-artifact v4 skips hidden paths by default

  gpui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux system deps (wgpu/gpui)
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev \
            libssl-dev libfontconfig1-dev pkg-config \
            libx11-dev libxi-dev libxtst-dev libpipewire-0.3-dev clang
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - uses: ./.github/actions/cargo-fetch
      - name: Re-record the gpui ratchet
        working-directory: apps/desktop
        env:
          EXP_UI_WRITE_FIXTURES: '1'
        run: cargo test --locked -p eui-gpui --test conformance
      - name: Verify the re-recorded ratchet passes
        working-directory: apps/desktop
        run: cargo test --locked -p eui-gpui --test conformance
      - name: What changed
        run: git status --short
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpui-ratchet
          path: packages/exponential-ui/fixtures/conformance-known.json
