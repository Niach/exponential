name: test

# The ONE pull-request gate (2026-10-26: speed first, target < 5 min wall).
# Only the cheap checks that catch real breakage run here: the typecheck, the
# web unit tests (four shards), the styleguide suite, and behind path filters
# (#EXP-1708: run less): actionlint when workflows change, the migration chain against a real Postgres
# (order, drift, custom triggers) plus the real-DB suites, the merge-train engine, the web production build when the PR touches web or a
# workspace package (#EXP-1677), and `cargo check` of the desktop workspace
# plus the eagent, coding, engine and ui tests when the PR touches it, the eDE compositor's headless tests when it touches apps/ede, packages/uicore's TS tests + typecheck when it touches the eDE shell, packages/domain-contract's suite when it touches the contract, the Android
# debug assemble (Kotlin, resource + manifest merge, dex; no cargo-ndk .so) + JVM unit tests when it touches what the app builds or reads (#EXP-1544), plus the
# eUI conformance pass (`eui`, below; every renderer but SwiftUI) when it touches eUI. The Mac-runner
# legs (`ios-core`, the ExpCore fixture replay, `ios-app`, the app target's compile, and `eui-swift`, the SwiftUI conformance pass) run on
# PRs too but are informational: `gate` does not wait for them. Everything heavy (the rest of the eUI suite: unit suites,
# parity, guides, benches, Simulator + emulator; iOS, Android lint + licences, the full desktop cargo test, the site,
# shots:check, the package suites, the real-DB suites, image smoke builds)
# runs in release-suite.yml: on release tags and on workflow_dispatch.
#
# Runs ONCE per change: on the pull request, never again on the squash push
# to master. `workflow_dispatch` runs this gate on demand: without `base_sha`
# every job runs; WITH it (#EXP-1708: the merge train's pipeline, train.yml,
# on `exp-train/<id>`) the path filters below take the diff base_sha..HEAD,
# exactly as they take a PR's files, so a batch runs only what it touches.

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Run only the jobs the diff from this commit touches (the merge train)
        required: false
        type: string
        default: ''

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # EXP-1364: fork PRs never run here (pick skips, everything needs it); the
  # desktop check runs on the Mint (warm sccache) when it is up.
  pick:
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit

  # The path-filtered jobs run only when the PR (or the train's diff from
  # base_sha) touches what they build; a bare workflow_dispatch runs them all.
  changes:
    needs: pick
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.f.outputs.desktop }}
      eui: ${{ steps.f.outputs.eui }}
      ede: ${{ steps.f.outputs.ede }}
      ede_shell: ${{ steps.f.outputs.ede_shell }}
      ios: ${{ steps.f.outputs.ios }}
      ios_app: ${{ steps.f.outputs.ios_app }}
      ios_runner: ${{ steps.f.outputs.ios_runner }}
      android: ${{ steps.f.outputs.android }}
      runner_android: ${{ steps.f.outputs.runner_android }}
      site: ${{ steps.f.outputs.site }}
      web_build: ${{ steps.f.outputs.web_build }}
      db: ${{ steps.f.outputs.db }}
      real_db: ${{ steps.f.outputs.real_db }}
      workflows: ${{ steps.f.outputs.workflows }}
      gaps: ${{ steps.f.outputs.gaps }}
      merge_train: ${{ steps.f.outputs.merge_train }}
      engine_ts: ${{ steps.f.outputs.engine_ts }}
      contract_ts: ${{ steps.f.outputs.contract_ts }}
    steps:
      # The train's diff: two shallow commits are enough for a name-only tree diff.
      - uses: actions/checkout@v4
        if: inputs.base_sha != ''
      - id: f
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          if [ -n "$PR" ]; then
            files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" -q '.[].filename')"
          elif [ -n "$BASE_SHA" ]; then
            git fetch --no-tags --quiet --depth=1 origin "$BASE_SHA"
            files="$(git diff --name-only "$BASE_SHA" HEAD)"
            printf 'Train diff from %s:\n%s\n' "$BASE_SHA" "$files"
          else
            printf 'desktop=true\neui=true\nios_runner=true\nede=true\nede_shell=true\nios=true\nios_app=true\nandroid=true\nrunner_android=true\nsite=true\nweb_build=true\ndb=true\nreal_db=true\nworkflows=true\ngaps=true\nmerge_train=true\nengine_ts=true\ncontract_ts=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The Rust legs (desktop, eUI, eDE, Android) skip prose: a package's
          # markdown and the eUI skills feed no build or test (nothing under
          # packages/ is include_str!-ed as .md); markdown inside apps/ does
          # (runbook.md, the editor's test.md), so it stays.
          rfiles="$(grep -vE '^packages/.*\.md$|^packages/exponential-ui/skills/' <<<"$files" || true)"
          desktop='^(apps/desktop/|samples/apps/photobook|packages/(domain-contract|ecore|eengine|etalk|exponential-ui|icons|design-tokens|emoji|electric-protocol)/|packages/ui/exponential-ui/|\.github/actions/cargo-fetch/|\.github/workflows/test\.yml$)'
          echo "desktop=$(grep -qE "$desktop" <<<"$rfiles" && echo true || echo false)" | tee -a "$GITHUB_OUTPUT"
          # The catalog, the six renderers, the facade, what they bundle (tokens, icons), the desktop lockfile (gpui revs).
          eui='^(packages/exponential-ui[a-z-]*/|apps/desktop/crates/(eui-[a-z-]+|exponential-ui-ffi)/|apps/desktop/vendor/gpui-pre-wgpu/|apps/desktop/Cargo\.(lock|toml)$|packages/(design-tokens|icons)/|\.github/workflows/(test|exponential-ui|pick-runner)\.yml$)'
          echo "eui=$(grep -qE "$eui" <<<"$rfiles" && echo true || echo false)" | tee -a "$GITHUB_OUTPUT"
          ede='^(apps/ede/|packages/ede/|apps/desktop/crates/(ecore|eui-core|ede-protocol)/|\.github/workflows/test\.yml$)'
          echo "ede=$(grep -qE "$ede" <<<"$rfiles" && echo true || echo false)" | tee -a "$GITHUB_OUTPUT"
          # #EDE-10 / #EDE-51: the shell (a desktop-workspace member), the crates it takes by path and the factory documents it embeds.
          ede_shell='^(apps/desktop/crates/(ede-shell|ede-protocol|uicore-[a-z]+)/|packages/uicore/|apps/ede/ui/|apps/ede/crates/(ede-ui|ede-services|ede-theme)/|apps/desktop/crates/(eui-core|eui-gpui|eui-motion|ecore)/|apps/desktop/vendor/(gpui-component|gpui-pre-wgpu)/|\.github/workflows/test\.yml$)'
          echo "ede_shell=$(grep -qE "$ede_shell" <<<"$rfiles" && echo true || echo false)" | tee -a "$GITHUB_OUTPUT"
          # ExpCore + every file its tests read through `#filePath`.
          ios='^(apps/ios/(ExpCore|Tuist)/|packages/(domain-contract|ecore|etalk)/|packages/exponential-ui/fixtures/|packages/icons/icons\.json$|\.github/workflows/(test|ios-core)\.yml$)'
          echo "ios=$(grep -qE "$ios" <<<"$files" && echo true || echo false)" | tee -a "$GITHUB_OUTPUT"
          # #EXP-1680: the app and what it links. Not test.yml: an unrelated gate
          # edit must not take a Mac for this.
          ios_app='^(apps/ios/|packages/exponential-ui-swift/|apps/desktop/crates/(exponential-ui-ffi|exponential-net-ffi|eengine|eengine-ffi)/|\.github/workflows/test-ios\.yml$|\.github/scripts/select-xcode\.sh$)'
          echo "ios_app=$(grep -qE "$ios_app" <<<"$files" && echo true || echo false)" | tee -a "$GITHUB_OUTPUT"
          # #VAPP-268: the iOS runner, the Engine's Swift facade + capabilities, what it paints with.
          ios_runner='^(apps/runner/ios/|apps/desktop/crates/(eengine|eengine-ffi|eengine-bundle|exponential-ui-ffi)/|packages/eengine/|packages/exponential-ui-swift/|scripts/lanes/runner-ios\.sh$|scripts/runner-kits/ios\.sh$|\.github/workflows/ios-runner\.yml$)'
          echo "ios_runner=$(grep -qE "$ios_runner" <<<"$files" && echo true || echo false)" | tee -a "$GITHUB_OUTPUT"
          # #EXP-1544: the app, the Compose eUI modules it includes, every
          # generator that writes Kotlin into it, the fixtures and vectors its
          # unit tests read, the eNet / eUI facades (committed Kotlin bindings +
          # the host library the tests load through JNA).
          android='^(apps/android/|packages/(domain-contract|ecore|etalk|exponential-ui-compose|icons|design-tokens|emoji)/|packages/exponential-ui/fixtures/|packages/ui/exponential-ui/extension\.json$|apps/desktop/crates/(exponential-net-ffi|enet-core|exponential-ui-ffi|eengine|eengine-ffi)/|apps/desktop/Cargo\.lock$|\.github/workflows/test\.yml$)'
          echo "android=$(grep -qE "$android" <<<"$rfiles" && echo true || echo false)" | tee -a "$GITHUB_OUTPUT"
          # #VAPP-267: the Android runner, the modules it builds from (eUI
          # Compose, the Engine AAR + its facade and core) and the fixtures its
          # JVM tests replay.
          runner_android='^(apps/runner/android/|packages/(exponential-ui-compose|eengine|icons)/|apps/desktop/crates/(eengine|eengine-ffi|exponential-ui-ffi|eengine-bundle)/|scripts/runner-kits/android\.sh$|apps/android/app/src/main/java/com/exponential/app/ui/icons/|apps/desktop/Cargo\.lock$|\.github/workflows/test\.yml$)'
          echo "runner_android=$(grep -qE "$runner_android" <<<"$rfiles" && echo true || echo false)" | tee -a "$GITHUB_OUTPUT"
          # exponential.at: the site, what it renders (eUI, Motion's WASM,
          # the shot store) and the repo markdown its reference pages read.
          site='^(apps/site/|shots/|docs/|INSTALL\.md$|packages/exponential-ui(-react)?/|apps/web/src/lib/(changelog\.ts|emcp/)|apps/desktop/crates/cli/src/main\.rs$|\.github/workflows/test\.yml$)'
          echo "site=$(grep -qE "$site" <<<"$files" && echo true || echo false)" | tee -a "$GITHUB_OUTPUT"
          # #EXP-1677: every package, not the web app's closure: a new package
          # then builds here by default, and a stray run costs ~2 min in parallel.
          web_build='^(apps/web/|packages/|package\.json$|bun\.lock$|bunfig\.toml$|Dockerfile$|\.github/workflows/test\.yml$)'
          echo "web_build=$(grep -qE "$web_build" <<<"$files" && echo true || echo false)" | tee -a "$GITHUB_OUTPUT"
          # #EXP-1708: the migration chain: the schema, the SQL, drizzle and its config.
          db='^(packages/db-schema/|apps/web/src/db/|apps/web/drizzle\.config\.ts$|apps/web/package\.json$|bun\.lock$|\.github/workflows/test\.yml$)'
          echo "db=$(grep -qE "$db" <<<"$files" && echo true || echo false)" | tee -a "$GITHUB_OUTPUT"
          # #EXP-1708: the real-DB suites (`*.real-db.test.ts`) on the hosted
          # runner's Postgres: what they import (the server, the schema, the
          # packages the sessions and eMCP servers replay).
          real_db='^(packages/(db-schema|eagent|emcp)/|apps/web/src/(db|lib)/|apps/web/package\.json$|bun\.lock$|\.github/workflows/test\.yml$)'
          echo "real_db=$(grep -qE "$real_db" <<<"$files" && echo true || echo false)" | tee -a "$GITHUB_OUTPUT"
          workflows='^\.github/'
          echo "workflows=$(grep -qE "$workflows" <<<"$files" && echo true || echo false)" | tee -a "$GITHUB_OUTPUT"
          # The rewrite-gap list against the view catalog (the train serializes
          # merges, so a merge race can no longer double a row behind a PR's back).
          gaps='^(packages/(view-catalog|exponential-ui)/|\.github/workflows/test\.yml$)'
          echo "gaps=$(grep -qE "$gaps" <<<"$files" && echo true || echo false)" | tee -a "$GITHUB_OUTPUT"
          merge_train='^(scripts/merge-train/|packages/domain-contract/(src/merge-train|fixtures/merge-train)|\.exponential/|\.github/workflows/(test|train)\.yml$)'
          echo "merge_train=$(grep -qE "$merge_train" <<<"$files" && echo true || echo false)" | tee -a "$GITHUB_OUTPUT"
          # #VAPP-269: the Engine's TS twin and the web runner, with what they import.
          engine_ts='^(packages/(eengine|emcp|domain-contract|exponential-ui|exponential-ui-react|icons)/|apps/runner/|package\.json$|bun\.lock$|\.github/workflows/test\.yml$)'
          echo "engine_ts=$(grep -qE "$engine_ts" <<<"$files" && echo true || echo false)" | tee -a "$GITHUB_OUTPUT"
          # #EDE-65: the shared contract's fixtures and TS references (every
          # client replays them; their own suite ran only on release tags).
          contract_ts='^(packages/domain-contract/|package\.json$|bun\.lock$|\.github/workflows/test\.yml$)'
          echo "contract_ts=$(grep -qE "$contract_ts" <<<"$files" && echo true || echo false)" | tee -a "$GITHUB_OUTPUT"

  web:
    needs: pick
    uses: ./.github/workflows/web-tests.yml

  # #EXP-1677: the Dockerfile's build step. The typecheck and vitest never bundle
  # for the browser, so #1803's `node:crypto` in the client bundle went green
  # here and broke the image on master, holding a release round.
  # #EXP-1748: and the image's boot. #2372's dependency bump built green and
  # served 500 on every route (the server trace hoisted a nested package), so
  # the built server boots against a migrated Postgres and answers the same
  # probes build-web.yml's "Smoke the image" does.
  web-build:
    needs: changes
    if: needs.changes.outputs.web_build == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: exponential
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Production build
        env:
          # The runner has node, so vite runs on it; the image's builder has only
          # bun, which has no such heap limit. Nitro's server bundle overruns node's default.
          NODE_OPTIONS: --max-old-space-size=8192
        run: bun --filter @exp/widget build && bun --filter @exp/mcp-apps build && bun --filter @exp/web build
      - name: Boot smoke
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/exponential
          BETTER_AUTH_SECRET: ci-only-boot-smoke-secret
        run: bun run migrate && cd apps/web && bun scripts/smoke-server.ts --boot

  migrations:
    needs: [pick, changes]
    if: needs.changes.outputs.db == 'true' || needs.changes.outputs.real_db == 'true'
    # EXP-112 / EXP-137: run the full chain from scratch against a real
    # Postgres (catches SQL that fails on every real DB), assert `drizzle-kit
    # push` is a no-op afterwards (catches silent drift between the SQL and
    # packages/db-schema), then apply the custom triggers deploys apply.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: exponential
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/exponential
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Apply migrations from scratch
        run: bun run migrate
      - name: Detect silent migration drift
        # Same-DB before/after dumps around `drizzle-kit push --force`; any
        # delta = the chain does not produce packages/db-schema. pg_dump runs
        # in the service container; the \restrict nonce is stripped; -N
        # drizzle skips the ledger. The timeout guards drizzle-kit's rename
        # prompt (reachable only when drift already exists).
        timeout-minutes: 10
        run: |
          dump_schema() {
            docker exec ${{ job.services.postgres.id }} pg_dump -U postgres --schema-only --no-owner --no-privileges -N drizzle exponential \
              | grep -vE '^\\(un)?restrict '
          }
          dump_schema > /tmp/schema-before.sql
          (cd apps/web && bun x drizzle-kit push --force)
          dump_schema > /tmp/schema-after.sql
          if ! diff -u /tmp/schema-before.sql /tmp/schema-after.sql; then
            echo '::error::Silent migration drift: the migrated DB does not match packages/db-schema. Either a migration SQL file no longer matches its snapshot (lost-DROP class, see b934ab4d) or schema.ts changed without a generated migration. The diff above is the DDL drizzle-kit push applied to reconcile.'
            exit 1
          fi
      - name: Apply custom triggers
        run: docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d exponential -v ON_ERROR_STOP=1 < apps/web/src/db/out/custom/0001_triggers.sql
      # #EXP-1708: the real-DB suites join the gate behind their path filter,
      # on this hosted runner's Postgres (release-suite.yml keeps the full run).
      - name: Real-DB tests
        if: needs.changes.outputs.real_db == 'true'
        env:
          BETTER_AUTH_SECRET: ci-only-real-db-secret
          REAL_DB_REQUIRED: '1'
        run: cd apps/web && bunx vitest run real-db.test

  desktop:
    needs: [pick, changes]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ${{ fromJSON(needs.pick.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system deps (wgpu/gpui)
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev \
            libssl-dev libfontconfig1-dev pkg-config \
            libx11-dev libxi-dev libxtst-dev libpipewire-0.3-dev clang
      - uses: dtolnay/rust-toolchain@stable
      # Self-hosted keeps its own sccache (.github/runners/README.md).
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: apps/desktop
      - uses: ./.github/actions/cargo-fetch
      - name: Cargo check
        working-directory: apps/desktop
        # EXP-519: --locked is load-bearing (Cargo.lock is the one pin of the
        # floating zed git deps).
        run: cargo check --workspace --locked
      - uses: taiki-e/install-action@nextest
      # #EXP-1504: eCore's size/dependency gate and its fixture replay (seconds);
      # #VAPP-261: the Engine's dependency gate and its fixture replay;
      # #VAPP-263: its UniFFI facade; #VAPP-265: the desktop capabilities (fakes);
      # #VAPP-266: the desktop runner's glue (headless) and its dependency gate;
      # the suites that hold launch behaviour and the shared fixtures (the full
      # `cargo test` stays in release-suite.yml); #EDE-55: the Local desktop
      # store, its parity replay and the api Transport seam; the CLI's own
      # tests (exp-cli: unit + `tests/data_dir.rs`, EXP_DATA_DIR isolation).
      # #EXP-76: ONE invocation, ONE feature set, so every crate builds once;
      # eagent, coding and ui stay lib-only. None of these crates has a doc test.
      - name: eCore, Engine, coding and UI tests
        working-directory: apps/desktop
        run: >-
          cargo nextest run --locked --no-fail-fast
          -p ecore -p eengine -p eengine-ffi -p eengine-desktop -p eengine-runner -p eengine-bundle
          -p eagent -p coding -p ui -p engine -p elocal -p api -p exp-http -p exp-cli
          --features eengine/sqlite,eengine/hub,eengine-ffi/hub,eagent/local-model
          -E 'kind(lib) | not (package(eagent) | package(coding) | package(ui))'

  # systemd 258 expands `${VAR}` in a scope's argv, which would put agent
  # secrets on `ps`. The Mint's runner container has no systemd, so this runs
  # the real wrap where it exists. Pinned: `ubuntu-latest` moving is what
  # exposed it, and the check needs a systemd that expands.
  desktop-scope:
    needs: [pick, changes]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - uses: ./.github/actions/cargo-fetch
      - name: The scope wrap keeps secrets off the argv
        working-directory: apps/desktop
        env:
          EXP_RUN_SCOPE_EXPECT_WRAP: '1'
        run: cargo test --locked -p eagent --lib run_scope

  # #EXP-1544: the Android app assembles (assembleProductionDebug: Kotlin,
  # resource + manifest merge, dex) and its JVM unit tests pass when the PR
  # touches what it builds or reads. Android otherwise built only in
  # build-android.yml and release-suite.yml, so three releases in a row broke
  # on a merged PR (a test vs a fixture, a race, master not compiling).
  # ENET_SKIP_NATIVE=1: no cargo-ndk cross-compile of the eNet/Engine .so
  # (~14 min in build-android.yml); the JVM tests load the host builds below.
  # R8 (minifyProductionReleaseWithR8) is not here: ~1.6 min on top of the
  # release compile + resources, over the gate's budget. Lint, the licence
  # report, the emulator and the release build stay in release-suite.yml.
  android:
    needs: [pick, changes]
    if: needs.changes.outputs.android == 'true'
    runs-on: ${{ fromJSON(needs.pick.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/gradle-dist
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'
      # The eNet facade's host build, loaded through JNA by PushSealFixtureTest
      # and the eNet install tests (as in release-suite.yml).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: apps/desktop
      - uses: ./.github/actions/cargo-fetch
      - name: Build the eNet facade for the JVM unit tests
        working-directory: apps/desktop
        run: cargo build -p exponential-net-ffi --release --features cli --locked
      # #VAPP-272: the Engine's facade, loaded by AppRecordOutboxLogTest.
      - name: Build the Engine facade for the JVM unit tests
        working-directory: apps/desktop
        run: cargo build -p eengine-ffi --release --features cli --locked
      - name: Cache Gradle packages
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/android/**/*.gradle*', 'apps/android/gradle/wrapper/gradle-wrapper.properties', 'apps/android/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Assemble + unit tests
        working-directory: apps/android
        env:
          ENET_SKIP_NATIVE: '1'
        run: ./gradlew :app:assembleProductionDebug :app:testProductionDebugUnitTest --no-daemon

  # #VAPP-267: the Android runner template (apps/runner/android) compiles and
  # its JVM unit tests pass: the bundle reading, deep links and the glue
  # against the real Engine (eengine-ffi's host build through JNA). The
  # emulator test (connectedDebugAndroidTest) stays local.
  runner-android:
    needs: [pick, changes]
    if: needs.changes.outputs.runner_android == 'true'
    runs-on: ${{ fromJSON(needs.pick.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/gradle-dist
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: apps/desktop
      - uses: ./.github/actions/cargo-fetch
      - name: Build the Engine facade for the JVM unit tests
        working-directory: apps/desktop
        run: cargo build -p eengine-ffi --release --features cli --locked
      - name: Cache Gradle packages
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-runner-${{ hashFiles('apps/runner/android/**/*.gradle*', 'packages/exponential-ui-compose/gradle/libs.versions.toml', 'packages/exponential-ui-compose/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Compile + unit tests
        working-directory: apps/runner/android
        run: ../../../packages/exponential-ui-compose/gradlew -p . :app:compileReleaseKotlin :app:testDebugUnitTest --no-daemon
      # #VAPP-270: `exponential bundle --target android` end to end on a
      # synthetic kit (aapt2 link, zipalign, apksigner, bundletool, jarsigner).
      # bundletool's only release asset is on github.com releases, which 504s
      # in an outage (as services.gradle.org did, #2337): the pinned jar is
      # cached and its download retries every error.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bundletool
          key: bundletool-1.18.1
      - name: Bundle an app for Android
        working-directory: apps/desktop
        run: |
          jar="$RUNNER_TEMP/bundletool/bundletool-all-1.18.1.jar"
          if [ ! -s "$jar" ]; then
            mkdir -p "$(dirname "$jar")"
            curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 -o "$jar.part" https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
            mv "$jar.part" "$jar"
          fi
          BUNDLETOOL="$jar" cargo test --locked -p eengine-bundle --test android -- --nocapture

  # #EXP-1543: the iOS ExpCore suite (ios-core.yml) when the PR touches
  # ExpCore or a fixture it reads. INFORMATIONAL (2026-11-01): not in `gate`,
  # so a busy single Mac runner never blocks a merge; release-suite.yml runs
  # it as a release blocker before every ios-v* build.
  # Repo variable PR_MAC_LEGS=off skips the three informational Mac legs
  # (ios-core, ios-app, eui-swift) so a release suite gets both Macs; the
  # release shepherd sets it while a release-suite.yml run waits on a Mac.
  ios-core:
    needs: [pick, changes]
    if: needs.changes.outputs.ios == 'true' && vars.PR_MAC_LEGS != 'off'
    uses: ./.github/workflows/ios-core.yml
    secrets: inherit

  # #EXP-1680: the app target's Release compile (test-ios.yml), which until now
  # only release-suite.yml ran, so app-target Swift merged uncompiled and held
  # iOS tags. INFORMATIONAL like ios-core: `gate` does not wait, so the Macs
  # never block a merge; it can join `gate` once it has proved reliable.
  ios-app:
    needs: [pick, changes]
    if: needs.changes.outputs.ios_app == 'true' && vars.PR_MAC_LEGS != 'off'
    uses: ./.github/workflows/test-ios.yml
    with:
      compile_only: true
    secrets: inherit

  # #VAPP-268: the iOS runner (ios-runner.yml: the Swift capabilities, RunnerKit's
  # swift test, the generated project's simulator build). INFORMATIONAL like
  # ios-core: `gate` does not wait; release-suite.yml blocks on it.
  ios-runner:
    needs: [pick, changes]
    if: needs.changes.outputs.ios_runner == 'true' && vars.PR_MAC_LEGS != 'off'
    uses: ./.github/workflows/ios-runner.yml
    secrets: inherit

  # eDE (#NEW-101): the compositor's own workspace. Its tests are headless
  # (pixman renders into memory, real Wayland clients over a socketpair), so
  # they run here in full: ~20 s warm.
  ede:
    needs: [pick, changes]
    if: needs.changes.outputs.ede == 'true'
    runs-on: ${{ fromJSON(needs.pick.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system deps (smithay)
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libxkbcommon-dev libpixman-1-dev libwayland-dev pkg-config \
            libudev-dev libinput-dev libgbm-dev libseat-dev libdrm-dev xwayland libegl1 \
            libpipewire-0.3-dev libclang-dev pipewire wireplumber dbus
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: apps/ede
      - uses: ./.github/actions/cargo-fetch
        with:
          dir: apps/ede
      - name: Cargo test
        working-directory: apps/ede
        run: cargo test --workspace --locked
      # The DRM/libinput backend needs a real seat to run; CI builds it.
      - name: Cargo check (udev backend)
        working-directory: apps/ede
        run: cargo check --workspace --all-targets --locked --features ede-compositor/udev

  # #EDE-10 / #EDE-51 / #EDE-50: eDE's shell (apps/desktop/crates/ede-shell, a
  # member of the IDE's workspace since #EDE-51) and the uicore crates it is
  # built on (uicore-model replays packages/uicore's fixtures, uicore-data,
  # uicore-gpui, uicore-docs); the compositor workspace never links gpui. A
  # `cargo check` of their graph (Wayland only) with their tests, only when
  # they or what they link change; the desktop job already builds gpui on
  # this runner, so the cache is warm.
  ede-shell:
    needs: [pick, changes]
    if: needs.changes.outputs.ede_shell == 'true'
    runs-on: ${{ fromJSON(needs.pick.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4
      # The desktop job's set: the uicore-gpui examples link xkbcommon-x11
      # (only the Mint's image had it, so a GitHub-hosted overflow failed).
      - name: Linux system deps (wgpu/gpui, wayland)
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libssl-dev libfontconfig1-dev \
            libx11-dev libxi-dev libxtst-dev pkg-config clang
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: apps/desktop
      - uses: ./.github/actions/cargo-fetch
      - name: Cargo check
        working-directory: apps/desktop
        run: cargo check -p ede-shell -p ede-protocol -p uicore-model -p uicore-data -p uicore-docs -p uicore-gpui --all-targets --locked
      - name: Cargo test (the shell, the protocol, the uicore crates replaying packages/uicore)
        working-directory: apps/desktop
        run: cargo test -p ede-shell -p ede-protocol -p uicore-model -p uicore-data -p uicore-docs -p uicore-gpui --locked

  # #EDE-65: packages/uicore's TS side (the shell and chat reducers the
  # Rust crates replay): its tests and its typecheck, which had rotted
  # unseen until #2303.
  uicore-ts:
    needs: [pick, changes]
    if: needs.changes.outputs.ede_shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bun test ./src && bunx tsc -p tsconfig.json --noEmit
        working-directory: packages/uicore

  # T1 eUI parity (2026-10-30): every renderer's conformance runner + the
  # `conformant` check on every PR that touches eUI (exponential-ui.yml with
  # conformance_only; the full suite stays in release-suite.yml).
  eui:
    needs: [pick, changes]
    if: needs.changes.outputs.eui == 'true'
    uses: ./.github/workflows/exponential-ui.yml
    with:
      conformance_only: true
      skip_swift: true
    secrets: inherit

  # The SwiftUI renderer's conformance pass, INFORMATIONAL (2026-11-01): the
  # same leg on the single Mac runner, outside `gate` (the full Swift suite
  # stays a release blocker in release-suite.yml).
  eui-swift:
    needs: [pick, changes]
    if: needs.changes.outputs.eui == 'true' && vars.PR_MAC_LEGS != 'off'
    uses: ./.github/workflows/exponential-ui.yml
    with:
      conformance_only: true
      swift_only: true
    secrets: inherit

  # EXP-1429: the gpui version policy (the gpui-pre snapshot, the
  # gpui-component release, the toolchain) agrees across the desktop workspace, the
  # painter's README, the gpui guide app and its install snippet. Text only,
  # well under a second.
  gpui-revs:
    needs: [pick, changes]
    if: needs.changes.outputs.desktop == 'true' || needs.changes.outputs.eui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun packages/exponential-ui/release/check-gpui-revs.ts

  # The styleguide's own suite (~2 s): every entry's status table names a
  # REAL declaration in its file on each platform, and the sections/page
  # bands agree. It drifted red unnoticed outside the gate (sealed-locked).
  styleguide:
    needs: pick
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bun test
        working-directory: apps/styleguide

  # exponential.at (apps/site, ~1 min): the Astro build, then dist served
  # with its production headers and checked in Chromium: no CSP or console
  # errors, the build-time eUI HTML, hydrated islands, every Motion tile
  # painting (a CSP without 'wasm-unsafe-eval' left them blank once).
  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Astro needs Node >= 22.23.4; the runner image ships 22.23.3.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bun --filter @exp/site test
      - run: bun --filter @exp/site build
      - run: bunx playwright install --with-deps chromium
      - name: Paint check
        run: |
          bun run apps/site/scripts/serve.ts 4391 &
          bun run apps/site/scripts/paint-check.ts http://localhost:4391 /tmp/site-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-shots
          path: /tmp/site-shots
          retention-days: 14
          if-no-files-found: ignore

  # The eUI rewrite-gap list must classify every view in the catalog exactly
  # once. views.json lives outside the eui path filter, so this runs on every
  # PR (bun:test over two JSON files, no install, ~1 s): a new view can't land
  # without its rewrite-gaps.json row, and a merge race that doubles a row
  # reddens the next PR instead of only eUI ones.
  rewrite-gaps:
    needs: [pick, changes]
    if: needs.changes.outputs.gaps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun test eval/gaps.test.ts
        working-directory: packages/exponential-ui

  # Every workflow file parses and type-checks (expressions, `needs`,
  # inputs, runner labels, action inputs): #1614 merged a release-suite.yml
  # GitHub could not parse, and nothing noticed until a release tag (#1639).
  # actionlint is a pinned, checksummed binary (~1 s). ShellCheck and pyflakes
  # stay off: this gate catches broken workflows, not script style.
  actionlint:
    needs: [pick, changes]
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          # github.com's release download down = the same tag from Go's
          # module proxy (sumdb-verified), built with the runner's Go.
          if curl -fsSL --retry 2 -o /tmp/actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz" &&
            echo "${SHA256}  /tmp/actionlint.tgz" | sha256sum -c -; then
            tar xzf /tmp/actionlint.tgz -C /tmp actionlint
          else
            echo "::warning::the actionlint release download failed; building v${VERSION} from Go's module proxy"
            GOBIN=/tmp go install "github.com/rhysd/actionlint/cmd/actionlint@v${VERSION}"
          fi
          /tmp/actionlint -color -shellcheck= -pyflakes=

  # #EXP-1708: the merge train's engine against real git repos and its
  # contract (no install, ~2 s).
  merge-train:
    needs: [pick, changes]
    if: needs.changes.outputs.merge_train == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun run test:merge-train

  # #VAPP-269: the Engine's TS twin (packages/eengine: the reducers, the
  # AppInstance, the web stores with fakes) and the web runner (its
  # controller's suite, its typecheck and its static export), ~1 min.
  engine-ts:
    needs: [pick, changes]
    if: needs.changes.outputs.engine_ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bun test ./src
        working-directory: packages/eengine
      - run: bun test ./src && bunx tsc --noEmit && bunx vite build
        working-directory: apps/runner/web

  # #EDE-65: packages/domain-contract's own suite (the fixtures every client
  # replays, their TS references) on a PR that touches it, so a fixture
  # change can't reach master unchecked (it ran only in release-suite.yml).
  contract-ts:
    needs: [pick, changes]
    if: needs.changes.outputs.contract_ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bun test ./src
        working-directory: packages/domain-contract

  # EXP-1364: the ONE required status check on master (the "master: test
  # gate" ruleset). Green = every job passed or was path-skipped; a fork PR
  # (pick skipped, nothing ran) stays red.
  gate:
    needs: [pick, changes, web, web-build, migrations, desktop, desktop-scope, ede, ede-shell, uicore-ts, android, runner-android, eui, gpui-revs, styleguide, rewrite-gaps, actionlint, site, merge-train, engine-ts, contract-ts]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          PICK: ${{ needs.pick.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          [ "$PICK" = success ] || { echo "::error::nothing ran (a fork PR, or the runner pick failed)"; exit 1; }
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a job ended $r"; exit 1 ;; esac
          done
