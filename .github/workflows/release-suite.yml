name: release-suite
# A dispatch of one job says so in its title, so `dedupe` can tell it from a full suite.
run-name: release-suite${{ inputs.only && format(' (only {0})', inputs.only) || '' }}

# The HEAVY suite (2026-10-26): everything that used to run on every pull
# request but the PR gate (test.yml). It runs on the release tags and on
# workflow_dispatch, never on pull requests or master pushes. A release train
# pushes several tags on one commit: `dedupe` runs the suite once per commit
# (the first tag's run, or an earlier full dispatch; a later tag's run of the
# same sha skips). Nothing
# requires it; a red run is a release blocker the release session reads.
#
# Contents: the web gate again (typecheck + unit) plus the small bun suites
# and package tests (`extras`), the real-DB suites (in `migrations`, on its
# service Postgres; a not-ready DB fails them), the feedback-widget
# Playwright e2e on the compose dev stack (`e2e`), the push-relay
# image smoke build, site build + shots:check, the full
# desktop cargo test + Rust licence inventory (+ the engine's macOS-only
# confine cases on the Mac, the coding crate's long-path removal on
# Windows), the desktop fuzz targets (short
# runs, NEW-88), Android unit tests + lint +
# licence inventory, the iOS compile + suites (test-ios.yml) and the ExpCore
# SwiftPM replay (ios-core.yml; informational on PRs), and every
# Exponential UI renderer + conformance + bench (exponential-ui.yml), and
# eTalk's phone facade (etalk-ffi: bindings drift + Swift/Kotlin suites).

on:
  push:
    tags:
      - 'desktop-v*'
      - 'android-v*'
      - 'ios-v*'
      - 'cli-v*'
      - 'eui-v*'
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      only:
        description: Run just this one job (its id, e.g. ede-goldens); empty = the whole suite.
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  dedupe:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.d.outputs.run }}
    steps:
      - id: d
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Keyed on head_sha, so the release tags must be LIGHTWEIGHT: an annotated tag's push carries the tag object's sha and would run the suite once per tag.
          # Any earlier FULL suite on this sha counts: a tag push's, or a dispatched one
          # (a release shepherd dispatches a suite on master, then tags that commit).
          # A one-job dispatch (`only`, "(only <job>)" in its title) never counts.
          earlier="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-suite.yml/runs?head_sha=$GITHUB_SHA&per_page=100" \
            --jq "[.workflow_runs[] | select(.id < $GITHUB_RUN_ID and .conclusion != \"cancelled\" and (.event == \"push\" or (.event == \"workflow_dispatch\" and ((.display_title // \"\") | contains(\"(only \") | not))))] | length")"
          echo "earlier runs on $GITHUB_SHA: $earlier"
          echo "run=$([ "$earlier" = 0 ] && echo true || echo false)" | tee -a "$GITHUB_OUTPUT"

  pick:
    needs: dedupe
    if: needs.dedupe.outputs.run == 'true'
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit

  web:
    needs: dedupe
    if: needs.dedupe.outputs.run == 'true' && (!inputs.only || inputs.only == 'web')
    uses: ./.github/workflows/web-tests.yml

  extras:
    needs: dedupe
    if: needs.dedupe.outputs.run == 'true' && (!inputs.only || inputs.only == 'extras')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      # EXP-566: the view-catalog drift gates + the store writer's tests.
      - name: Screenshot store tests
        run: bun run test:shots
      - name: Widget unit tests
        run: bun run test:widget
      - name: Lane lock tests
        run: bun run test:lanes
      - name: Steer relay + ticket tests
        run: bun run test:steer-relay
      - name: Typecheck push relay
        run: bun run --filter @exp/push-relay typecheck
      - name: Push relay tests
        run: bun run test:push-relay
      - name: Package unit tests (contract, the Exponential UI catalog, @exp/ui, MCP apps)
        run: bun --filter @exp/domain-contract test && bun --filter @exp/ecore test && bun --filter @exp/etalk test && bun --filter @exp/emcp test && bun --filter @exp/eengine test && bun --filter @exp/eagent test && bun --filter @exp/ecode test && bun --filter @exp/ede test && bun --filter @exp/uicore test && bun --filter @exponential_app/eui test && bun --filter @exp/ui --filter @exp/mcp-apps test

  ios:
    needs: dedupe
    if: needs.dedupe.outputs.run == 'true' && (!inputs.only || inputs.only == 'ios')
    uses: ./.github/workflows/test-ios.yml
    secrets: inherit

  # The ExpCore fixture replay + GRDB pin check (informational on PRs since
  # 2026-11-01): here it blocks the release, like everything in this suite.
  ios-core:
    needs: dedupe
    if: needs.dedupe.outputs.run == 'true' && (!inputs.only || inputs.only == 'ios-core')
    uses: ./.github/workflows/ios-core.yml
    secrets: inherit

  # #VAPP-268: the iOS runner + the Swift capabilities (informational on PRs).
  ios-runner:
    needs: dedupe
    if: needs.dedupe.outputs.run == 'true' && (!inputs.only || inputs.only == 'ios-runner')
    uses: ./.github/workflows/ios-runner.yml
    secrets: inherit

  exponential-ui:
    needs: dedupe
    if: needs.dedupe.outputs.run == 'true' && (!inputs.only || inputs.only == 'exponential-ui')
    uses: ./.github/workflows/exponential-ui.yml
    secrets: inherit

  push-relay-image:
    needs: [dedupe, pick]
    if: needs.dedupe.outputs.run == 'true' && (!inputs.only || inputs.only == 'push-relay-image')
    # EXP-446: Dockerfile.push-relay is built by no publish workflow — Coolify
    # builds it from the repo at deploy time, so a broken edit's first
    # validation used to be the deploy itself. Build-only (push: false —
    # publishing would create a new public ghcr package, a product decision;
    # see the EXP-376 note in the Dockerfile) and amd64-only (smoke gate, not
    # an artifact).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build push-relay image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.push-relay
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=push-relay
          cache-to: type=gha,mode=max,scope=push-relay


  site:
    needs: [dedupe, pick]
    if: needs.dedupe.outputs.run == 'true' && (!inputs.only || inputs.only == 'site')
    # exponential.at (apps/site): the same Astro build + Chromium paint check
    # as test.yml's `site` job, on every release regardless of paths — the
    # site deploys straight from Coolify, so this is its pre-deploy gate.
    runs-on: ubuntu-24.04 # no --with-deps: apt to Ubuntu's archives fails DNS from GitHub runners (#2661); the image ships Chrome's libs
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Site tests
        run: bun --filter @exp/site test
      - name: Build site
        run: bun run build:site
      - name: Chromium for the paint check
        run: bunx playwright install chromium || (sleep 20 && bunx playwright install chromium)
      - name: Paint check
        run: |
          bun run apps/site/scripts/serve.ts 4391 &
          bun run apps/site/scripts/paint-check.ts http://localhost:4391 /tmp/site-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-shots
          path: /tmp/site-shots
          retention-days: 14
          if-no-files-found: ignore
      - name: Shots store vs catalog drift
        # Fails on any declared-but-uncaptured pair or stray file in shots/
        # (manual-lane desktop views are exempt until captured by hand).
        run: bun run shots:check


  # #EDE-11: eDE's goldens. The headless compositor draws the factory
  # documents through the supervisor and the shell (apps/ede/scripts/shots.sh),
  # the shots lane encodes them, and the committed store must not move:
  # a pixel that changed is a look that changed, and the PR re-records it
  # with `bun run shots -- --platform ede --skip-seed`.
  ede-goldens:
    needs: [dedupe, pick]
    if: needs.dedupe.outputs.run == 'true' && (!inputs.only || inputs.only == 'ede-goldens')
    runs-on: ${{ fromJSON(needs.pick.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/apt-mirror
      - name: Linux system deps (smithay + wgpu/gpui)
        run: |
          sudo apt-get install -y \
            libxkbcommon-dev libpixman-1-dev libwayland-dev pkg-config libxcb1-dev libssl-dev libfontconfig1-dev clang \
            mesa-vulkan-drivers libegl1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: |
            apps/ede
            apps/desktop
      - uses: ./.github/actions/cargo-fetch
        with:
          dir: apps/ede
      - uses: ./.github/actions/cargo-fetch
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Capture the eDE views
        run: bun run shots -- --platform ede --skip-seed
      - name: The store did not move
        run: git diff --exit-code --stat -- shots/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ede-goldens
          path: |
            .shots-raw/ede
            shots/ede-panel
            shots/ede-panel-menu
          retention-days: 14
          if-no-files-found: ignore

  migrations:
    needs: [dedupe, pick]
    if: needs.dedupe.outputs.run == 'true' && (!inputs.only || inputs.only == 'migrations')
    # EXP-112: drizzle-kit can generate SQL that fails on every real DB
    # (e.g. DROP TABLE CASCADE before its referencing DROP CONSTRAINTs —
    # EXP-111's migration 0023), and nothing else in CI ever executes the
    # migrations. Run the full chain from scratch against a real Postgres,
    # then the custom triggers that deploys apply on top.
    # EXP-137: additionally detect SILENT drift — a migration that executes
    # cleanly but no longer matches its snapshot (b934ab4d: 0026 lost its
    # DROP statements), leaving every DB that applied it permanently
    # diverged from the drizzle schema with no later error.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: exponential
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/exponential
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Apply migrations from scratch
        # + the deferred contract steps (#ERR-1, apps/web/src/db/contract-steps.ts)
        # at once: no older release serves this database.
        run: bun run migrate && (cd apps/web && bun run migrate:contract)
      - name: Detect silent migration drift
        # Assert `drizzle-kit push` is a NO-OP on the freshly-migrated DB:
        # dump the schema, push, dump again — any delta means the migration
        # chain did not faithfully produce packages/db-schema (a migration
        # file drifted from its snapshot, or schema.ts changed without a
        # generated migration), and the diff shows the drift as the DDL push
        # had to apply. Same-DB before/after keeps the comparison
        # byte-stable (no cross-DB pg_dump ordering to normalize). pg_dump
        # runs in the service container (the runner's client is older than
        # the server); the \restrict guard token pg_dump emits is a per-dump
        # random nonce, hence stripped; -N drizzle excludes the migration
        # ledger, which push never manages. Runs BEFORE the trigger step so
        # trigger objects never enter the dumps. The step timeout guards
        # against drizzle-kit's interactive rename prompt, reachable only
        # when drift already exists (ambiguous add+drop column pair).
        timeout-minutes: 10
        run: |
          dump_schema() {
            docker exec ${{ job.services.postgres.id }} pg_dump -U postgres --schema-only --no-owner --no-privileges -N drizzle exponential \
              | grep -vE '^\\(un)?restrict '
          }
          dump_schema > /tmp/schema-before.sql
          (cd apps/web && bun x drizzle-kit push --force)
          dump_schema > /tmp/schema-after.sql
          if ! diff -u /tmp/schema-before.sql /tmp/schema-after.sql; then
            echo '::error::Silent migration drift: the migrated DB does not match packages/db-schema. Either a migration SQL file no longer matches its snapshot (lost-DROP class, see b934ab4d) or schema.ts changed without a generated migration. The diff above is the DDL drizzle-kit push applied to reconcile.'
            exit 1
          fi
      - name: Apply custom triggers
        # The app applies this file idempotently at every boot
        # (bootstrap-cloud applyCustomSql); CI applies it manually because it
        # never boots the app — ON_ERROR_STOP so SQL errors fail the job.
        run: docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d exponential -v ON_ERROR_STOP=1 < apps/web/src/db/out/custom/0001_triggers.sql
      - name: Real-DB tests (sessions, Guide, triggers, backfills)
        # EXP-1284: the suites that need the migrated DB + the custom
        # triggers; the unit job runs them too but they skip without a DB.
        # NEW-6: the plan-card suite mints Guide upload URLs, which need a
        # secret; any value does for a throwaway CI database.
        # #NEW-90: every `*.real-db.test.ts` (vitest's file filter: the old
        # unglobbed `src/lib/**` pattern missed src/db and src/lib's own
        # files), and REAL_DB_REQUIRED turns a not-ready database into a
        # failure instead of a silent skip (#NEW-79's voicePolicy and
        # owner-only card answers live in sessions.real-db.test.ts).
        env:
          BETTER_AUTH_SECRET: ci-only-real-db-secret
          REAL_DB_REQUIRED: '1'
        run: cd apps/web && bunx vitest run real-db.test
      - name: Duplicate device-share check (the pre-deploy check, on the migrated DB)
        # FEED-149: the same script gates every deploy against the target
        # database (.github/workflows/README.md); here it proves it still runs
        # on the current schema. The real-DB suites delete what they make.
        run: cd apps/web && bun run check:device-shares


  e2e:
    needs: dedupe
    if: needs.dedupe.outputs.run == 'true' && (!inputs.only || inputs.only == 'e2e')
    # NEW-85: the Playwright feedback-widget spec (settings UI, the public
    # cross-origin widget endpoints, the built widget on its demo page, the
    # issue on the board) against the dev stack the spec expects: compose
    # Postgres + Electric + Garage + Caddy (https://localhost:3000 -> vite
    # :5173, which playwright.config.ts starts). No mail transport, so sign-up
    # takes the password form. Other specs join by adding their file below.
    runs-on: ubuntu-24.04 # no --with-deps: apt to Ubuntu's archives fails DNS from GitHub runners (#2661); the image ships Chrome's libs
    timeout-minutes: 30
    env:
      CI: 'true'
      DATABASE_URL: postgresql://postgres:password@localhost:54321/exponential
      ELECTRIC_URL: http://localhost:30000
      BETTER_AUTH_SECRET: ci-only-e2e-secret-0123456789abcdef0123456789
      S3_ENDPOINT: http://localhost:3900
      S3_BUCKET: exponential-attachments
      S3_REGION: garage
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Dev stack (Postgres, Electric, Garage, Caddy)
        run: |
          cp Caddyfile.example Caddyfile
          openssl rand -hex 32 > infra/garage/secrets/rpc_secret
          openssl rand -base64 32 > infra/garage/secrets/admin_token
          chmod 600 infra/garage/secrets/rpc_secret infra/garage/secrets/admin_token
          docker compose up -d --wait postgres electric garage caddy
      - name: Garage bucket + app key
        run: |
          bun run storage:init | tee /tmp/garage-init.txt
          echo "S3_ACCESS_KEY=$(grep -oE 'GK[0-9a-f]+' /tmp/garage-init.txt | head -1)" >> "$GITHUB_ENV"
          echo "S3_SECRET_KEY=$(awk -F': *' '/^Secret key/ {print $2; exit}' /tmp/garage-init.txt)" >> "$GITHUB_ENV"
      - name: Migrations + custom triggers
        run: |
          bun run migrate
          docker compose exec -T postgres psql -U postgres -d exponential -v ON_ERROR_STOP=1 < apps/web/src/db/out/custom/0001_triggers.sql
      - name: Build the widget (the spec loads public/widget/v1)
        run: bun run build:widget
      - name: Playwright browser
        run: cd apps/web && (bunx playwright install chromium || (sleep 20 && bunx playwright install chromium))
      - name: Feedback widget e2e
        run: cd apps/web && bunx playwright test tests/e2e/feedback-widget.spec.ts
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 7

  desktop:
    needs: [dedupe, pick]
    if: needs.dedupe.outputs.run == 'true' && (!inputs.only || inputs.only == 'desktop')
    runs-on: ${{ fromJSON(needs.pick.outputs.linux) }}
    # ~6 min warm; a hung test (2026-11-06: 2 h on a seal_keys deadlock) must
    # never hold a self-hosted runner, so the job stops at 40 min.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/apt-mirror
      - name: Linux system deps (wgpu/gpui)
        run: |
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev \
            libssl-dev libfontconfig1-dev pkg-config \
            libx11-dev libxi-dev libxtst-dev libpipewire-0.3-dev clang
      - uses: dtolnay/rust-toolchain@stable
      # Self-hosted keeps its own sccache (.github/runners/README.md).
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: apps/desktop
      - uses: ./.github/actions/cargo-fetch
      - name: Cargo tests
        working-directory: apps/desktop
        # EXP-519: --locked is load-bearing — the workspace manifest FLOATS the zed
        # git deps (upstream gpui-component's discipline) and Cargo.lock is the one
        # true pin; an accidental re-resolve must fail loudly, never build zed HEAD.
        run: cargo test --no-fail-fast --locked
      # EXP-375 — the Rust licence inventory can only be collected where cargo
      # is. The pure-bun `web` job re-runs the merge and byte-compares the
      # notices; this proves the inventory it merges is still current.
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Re-collect the Rust licence inventory
        run: bun run --filter @exp/licenses collect:rust
      - name: Fail if the committed inventory drifted
        run: git diff --exit-code -- packages/licenses/inventory/rust.json packages/licenses/inventory/rust-excluded.json packages/licenses/inventory/rust-runner-*.json


  # EXP-1457: the browser build of eNet (exponential-net-wasm) runs the web
  # install glue and talks to a native eNet node through a local
  # `iroh-relay --dev`: acked pings both ways, a foreign install refused.
  enet-wasm-smoke:
    needs: dedupe
    if: needs.dedupe.outputs.run == 'true' && (!inputs.only || inputs.only == 'enet-wasm-smoke')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: wasm toolchain
        working-directory: apps/desktop
        run: |
          rustup target add wasm32-unknown-unknown
          rustup component add llvm-tools
          echo "WASM_BINDGEN_VERSION=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/version = |"/, ""); print; exit}' Cargo.lock)" >> "$GITHUB_ENV"
          echo "IROH_RELAY_VERSION=$(awk '/^name = "iroh-relay"$/{getline; gsub(/version = |"/, ""); print; exit}' Cargo.lock)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
          key: enet-wasm-smoke
      - uses: ./.github/actions/cargo-fetch
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      - run: scripts/build-enet-wasm.sh
      - name: Native peer + local relay
        working-directory: apps/desktop
        run: |
          cargo build --locked -p enet-core --example relay_peer
          cargo install iroh-relay --version "$IROH_RELAY_VERSION" --features server --locked --root "$RUNNER_TEMP/iroh-relay"
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Smoke
        working-directory: apps/web
        run: |
          IROH_RELAY="$RUNNER_TEMP/iroh-relay/bin/iroh-relay" \
          RELAY_PEER="$GITHUB_WORKSPACE/apps/desktop/target/debug/examples/relay_peer" \
          timeout 300 bun scripts/enet-wasm-smoke.ts

  # EXP-1509: eagent-hub-core's WASM build replays every eAgent fixture
  # through packages/eagent's replayer (the TS reference and `cargo test -p
  # eagent-hub-core` replay the same files).
  eagent-wasm-replay:
    needs: dedupe
    if: needs.dedupe.outputs.run == 'true' && (!inputs.only || inputs.only == 'eagent-wasm-replay')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: wasm toolchain
        working-directory: apps/desktop
        run: |
          rustup target add wasm32-unknown-unknown
          echo "WASM_BINDGEN_VERSION=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/version = |"/, ""); print; exit}' Cargo.lock)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
          key: eagent-wasm-replay
      - uses: ./.github/actions/cargo-fetch
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      - run: scripts/build-eagent-wasm.sh
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Replay
        working-directory: packages/eagent
        run: bun run test:wasm

  # FEED-160: the macOS-only cases (confine.rs's `/System/Volumes` Data
  # volume) never run on the Linux `desktop` job; the engine's confine
  # tests on the Mac.
  desktop-macos:
    needs: [dedupe, pick]
    if: needs.dedupe.outputs.run == 'true' && (!inputs.only || inputs.only == 'desktop-macos')
    runs-on: ${{ fromJSON(needs.pick.outputs.mac) }}
    steps:
      - uses: actions/checkout@v4
      - name: Disk guard (self-hosted Mac, EXP-1396)
        if: runner.environment == 'self-hosted'
        run: bash "$GITHUB_WORKSPACE/.github/scripts/disk-guard.sh"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: apps/desktop
      - uses: ./.github/actions/cargo-fetch
      - name: Cargo tests (engine confine, macOS)
        working-directory: apps/desktop
        run: cargo test --locked -p engine --lib adapters::confine

  # EXP-1542 (#FEED-171): the Windows-only cases (leftover.rs's long-path
  # worktree removal past MAX_PATH) never run on the Linux or Mac jobs.
  desktop-windows:
    needs: dedupe
    if: needs.dedupe.outputs.run == 'true' && (!inputs.only || inputs.only == 'desktop-windows')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - uses: ./.github/actions/cargo-fetch
      - name: Cargo tests (worktree removal, Windows long paths)
        working-directory: apps/desktop
        run: 'cargo test --locked -p coding --lib leftover::'

  desktop-fuzz:
    needs: dedupe
    if: needs.dedupe.outputs.run == 'true' && (!inputs.only || inputs.only == 'desktop-fuzz')
    # NEW-88: the call's untrusted audio (a caller's Opus packets off the
    # relay) and the local call's echo canceller, fuzzed briefly per release
    # (apps/desktop/fuzz; the long runs go through the heavy lane on mint).
    # Its own cargo workspace, so no zed/gpui fetch. Plus the libopus
    # fallback's tests, so the feature keeps building.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/apt-mirror
      - name: libopus (the fallback's system library)
        run: sudo apt-get install -y libopus-dev pkg-config
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/fuzz
      - uses: ./.github/actions/cargo-fetch
        with:
          dir: ''
      - name: cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz each target for 3 minutes (opus-rs)
        run: apps/desktop/fuzz/run.sh 180
      - name: The libopus fallback's tests
        working-directory: apps/desktop/fuzz
        # Through the fuzz workspace (etalk-codec's own would load the desktop one).
        run: cargo test -p desktop-fuzz -p etalk-codec --features desktop-fuzz/libopus
      - name: Keep the crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: apps/desktop/fuzz/artifacts
          if-no-files-found: ignore


  # #EXP-1441: eTalk's UniFFI facade for the phones. The committed bindings
  # match the generator (Kotlin ships with omit_checksums), and the Swift +
  # Kotlin suites replay packages/etalk/fixtures/voice-call.json through them.
  etalk-ffi:
    needs: [dedupe, pick]
    if: needs.dedupe.outputs.run == 'true' && (!inputs.only || inputs.only == 'etalk-ffi')
    runs-on: ${{ fromJSON(needs.pick.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: apps/desktop
      - uses: ./.github/actions/cargo-fetch
      - name: Facade tests
        working-directory: apps/desktop
        run: cargo test --locked -p etalk-ffi
      - name: Committed bindings match the generator
        run: |
          bash apps/desktop/crates/etalk-ffi/generate-bindings.sh
          git diff --exit-code -- apps/desktop/crates/etalk-ffi/bindings
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/gradle-dist
      - name: Kotlin binding suite (the committed binding vs the host .so)
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/target
          # The self-hosted runner's HOME is read-only: the kotlinc + JNA jars cache in the job's temp.
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
        run: bash apps/desktop/crates/etalk-ffi/run-binding-tests.sh kotlin

  etalk-ffi-swift:
    needs: [dedupe, pick]
    if: needs.dedupe.outputs.run == 'true' && (!inputs.only || inputs.only == 'etalk-ffi-swift')
    runs-on: ${{ fromJSON(needs.pick.outputs.mac) }}
    steps:
      - uses: actions/checkout@v4
      - name: Disk guard (self-hosted Mac, EXP-1396)
        if: runner.environment == 'self-hosted'
        run: bash "$GITHUB_WORKSPACE/.github/scripts/disk-guard.sh"
      - name: Select Xcode 27
        run: bash .github/scripts/select-xcode.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: apps/desktop
      - uses: ./.github/actions/cargo-fetch
      - name: Swift binding suite (the committed binding vs the host dylib)
        run: bash apps/desktop/crates/etalk-ffi/run-binding-tests.sh swift

  android:
    needs: [dedupe, pick]
    if: needs.dedupe.outputs.run == 'true' && (!inputs.only || inputs.only == 'android')
    runs-on: ${{ fromJSON(needs.pick.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/gradle-dist
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'
      # EXP-1435 / EXP-1457: the eNet facade's host build, loaded through JNA by
      # PushSealFixtureTest and the eNet install tests (real nodes on localhost).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: apps/desktop
      - uses: ./.github/actions/cargo-fetch
      - name: Build the eNet facade for the JVM unit tests
        working-directory: apps/desktop
        run: cargo build -p exponential-net-ffi --release --features cli
      - name: Build the Engine facade for the JVM unit tests
        working-directory: apps/desktop
        run: cargo build -p eengine-ffi --release --features cli
      - name: Cache Gradle packages
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/android/**/*.gradle*', 'apps/android/gradle/wrapper/gradle-wrapper.properties', 'apps/android/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Android unit tests
        working-directory: apps/android
        run: ./gradlew :app:testProductionDebugUnitTest --no-daemon
      # EXP-1009 — lint aborts on error-level findings (media3's
      # UnsafeOptInUsageError slipped through while only unit tests ran).
      - name: Android lint
        working-directory: apps/android
        run: ./gradlew :app:lintProductionDebug --no-daemon
      # EXP-375 — the Android inventory is the TRANSITIVELY RESOLVED runtime
      # graph (compose-bom and firebase-bom expand to artifacts
      # libs.versions.toml never names), so it needs a real gradle resolve.
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Generate the Android licence report
        working-directory: apps/android
        run: ./gradlew licenseProductionReleaseReport --no-daemon
      - name: Re-collect the Android licence inventory
        run: bun run --filter @exp/licenses collect:android
      # VAPP-270: the Android runner kit's graph (an init script applies the plugin).
      - name: Generate the Android runner's licence report
        run: packages/exponential-ui-compose/gradlew -p apps/runner/android --init-script "$PWD/packages/licenses/gradle/runner-license.init.gradle.kts" licenseReleaseReport --no-daemon
      - name: Re-collect the Android runner's licence inventory
        run: bun run --filter @exp/licenses collect:android -- --runner
      - name: Fail if the committed inventory drifted
        run: git diff --exit-code -- packages/licenses/inventory/android.json packages/licenses/inventory/gradle-runner-android.json

