name: seal-secrets

# #EXP-2151, ONE TIME, removed right after: encrypts each repository secret to
# its environment's own public key (GitHub holds the private half), so it moves
# into the environment without any plaintext leaving the runner.

on:
  workflow_dispatch:

permissions: {}

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - run: sudo apt-get install -y python3-nacl
      - name: Seal
        env:
          PUBLIC_KEY: 0Eer0VLGl3v5h75oZYChL+UOdJTfDBtUwv6oEIXvqAM=
          S_ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          S_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          S_ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          S_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          S_CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          S_CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          S_CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          S_GLITCHTIP_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
          S_IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          S_IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          S_MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          S_MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          S_MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          S_MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          S_NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          S_NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          S_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          S_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          S_PKG_SIGNING_KEY: ${{ secrets.PKG_SIGNING_KEY }}
          S_PKG_SSH_KEY: ${{ secrets.PKG_SSH_KEY }}
          S_PKG_SSH_KNOWN_HOSTS: ${{ secrets.PKG_SSH_KNOWN_HOSTS }}
          S_PKG_SSH_TARGET: ${{ secrets.PKG_SSH_TARGET }}
          S_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          S_RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          S_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          S_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          S_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          S_SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          S_SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          S_SWIFT_DIST_TOKEN: ${{ secrets.SWIFT_DIST_TOKEN }}
          S_UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          from nacl.public import PublicKey, SealedBox
          box = SealedBox(PublicKey(base64.b64decode(os.environ["PUBLIC_KEY"])))
          out = {k[2:]: base64.b64encode(box.encrypt(v.encode())).decode() for k, v in os.environ.items() if k.startswith("S_") and v}
          json.dump(out, open("sealed.json", "w"))
          print(len(out), "sealed:", *sorted(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-release
          path: sealed.json
          retention-days: 1

  train:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    environment: train
    steps:
      - run: sudo apt-get install -y python3-nacl
      - name: Seal
        env:
          PUBLIC_KEY: s9sK1ZWLzNtb/wq8A44efBdfYQQJSPX8cUkh+XPZlDs=
          S_MERGE_TRAIN_TOKEN: ${{ secrets.MERGE_TRAIN_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          from nacl.public import PublicKey, SealedBox
          box = SealedBox(PublicKey(base64.b64decode(os.environ["PUBLIC_KEY"])))
          out = {k[2:]: base64.b64encode(box.encrypt(v.encode())).decode() for k, v in os.environ.items() if k.startswith("S_") and v}
          json.dump(out, open("sealed.json", "w"))
          print(len(out), "sealed:", *sorted(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-train
          path: sealed.json
          retention-days: 1
