name: Build steer relay image

# Publishes the multi-arch (amd64 + arm64) steer relay image to
# ghcr.io/niach/exponential-steer-relay — pulled by the Coolify steer relay
# apps (steer.exponential.at / steer-next.exponential.at) as dockerimage apps
# and by the selfhost compose `steer` profile. Same triggers + tag scheme as
# the web image; the ghcr package must stay PUBLIC for anonymous pulls.
#
# Dockerfile.steer-relay has no build step (bun install + source copy), so
# QEMU multi-arch in one job is fine here — unlike the web image's JIT-heavy
# vite build, which needs native runners.

on:
  push:
    branches: [master]
    tags:
      - "v*.*.*"
      - "v*.*.*-dev"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  # Gate: never ship the relay on red relay/ticket tests.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Steer relay + ticket tests
        run: bun run test:steer-relay

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        env:
          # ghcr reads the package-page description from the INDEX-level
          # annotation on multi-arch images.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/niach/exponential-steer-relay
          # latest=auto would also stamp `latest` on stable v-tag pushes — a
          # hotfix tag on an older commit must never regress what prod pulls.
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          annotations: |
            org.opencontainers.image.description=Exponential steer relay — remote-start + live terminal watch/steer WebSocket hub.

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.steer-relay
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=steer-relay
          cache-to: type=gha,mode=max,scope=steer-relay
