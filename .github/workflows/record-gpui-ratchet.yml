name: record-gpui-ratchet

# The gpui conformance RATCHET (`packages/exponential-ui/fixtures/
# conformance-known.json`, the divergence budget of the gpui painter against
# the web baseline) is written by `apps/desktop/crates/exponential-ui-gpui/
# tests/conformance.rs`, which only builds on Linux (gpui's own text system).
# After a web baseline rewrite (`conformance-web.ts --write-baseline`) or a
# painter fix, this workflow re-records the budget on ubuntu and uploads it
# as the `gpui-ratchet` artifact to commit by hand (`workflow_dispatch`).

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux system deps (wgpu/gpui)
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev \
            libssl-dev libfontconfig1-dev pkg-config \
            libx11-dev libxi-dev libxtst-dev libpipewire-0.3-dev clang
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - name: Re-record the gpui ratchet
        working-directory: apps/desktop
        env:
          EXP_UI_WRITE_FIXTURES: '1'
        run: cargo test --locked -p exponential-ui-gpui --test conformance
      - name: Verify the re-recorded ratchet passes
        working-directory: apps/desktop
        run: cargo test --locked -p exponential-ui-gpui --test conformance
      - name: What changed
        run: git status --short
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpui-ratchet
          path: packages/exponential-ui/fixtures/conformance-known.json
