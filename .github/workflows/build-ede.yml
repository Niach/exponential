# Exponential Desktop's packages and repositories (#EDE-34, #EDE-35; #NEW-103,
# #NEW-120, #EDE-2). One build on ubuntu-24.04 (the oldest glibc of the
# matrix) stages the binaries once (packaging/stage.sh); that tree becomes
# the .debs (noble with the bundled Xwayland 24.1, resolute + trixie with the
# distro's), the Fedora .rpm and the Arch package. The repo job builds the
# signed static repositories from them (packaging/repo/publish.sh), every
# distro of the matrix installs from that copy in its container
# (packaging/smoke.sh), and on ede-v* tags (or a dispatch with publish) the
# tree goes to the package host (rsync, PKG_SSH_* secrets) and the packages
# to a GitHub Release (never latest: the desktop app owns releases/latest).
# The host name lives in apps/ede/packaging/repo.env only. Pull requests run
# it when they touch the packaging, outside the required `gate`.
name: build-ede

on:
  push:
    tags: ["ede-v*"]
  pull_request:
    paths:
      - apps/ede/packaging/**
      - .github/workflows/build-ede.yml
      - .github/actions/apt-mirror/**
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this build to the package host
        type: boolean
        default: false

concurrency:
  group: build-ede-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/ede-v') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/apt-mirror
      - name: Linux system deps (udev backend + the shell's gpui)
        run: |
          sudo apt-get install -y \
            libxkbcommon-dev libpixman-1-dev libwayland-dev pkg-config \
            libudev-dev libinput-dev libgbm-dev libseat-dev libdrm-dev libegl1 \
            libxcb1-dev libssl-dev libfontconfig1-dev clang libpipewire-0.3-dev libclang-dev
      - uses: actions/cache@v4
        id: xwayland
        with:
          path: ~/ede-xwayland
          key: xwayland-noble-${{ hashFiles('apps/ede/packaging/xwayland/build.sh') }}
      - name: Build Xwayland
        if: steps.xwayland.outputs.cache-hit != 'true'
        run: apps/ede/packaging/xwayland/build.sh --install-deps ~/ede-xwayland
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/ede
            apps/desktop
          key: ede-deb
      - uses: ./.github/actions/cargo-fetch
        with:
          dir: apps/ede
      - uses: ./.github/actions/cargo-fetch
      # #LOGS-2: line tables in the release build, split off before packing
      # (split-debug.sh), so the packages ship what they shipped before and
      # GlitchTip gets the debug files.
      - name: Stage
        env:
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          CARGO_PROFILE_RELEASE_STRIP: none
        run: apps/ede/packaging/stage.sh "$RUNNER_TEMP/stage"
      - name: Split the debug info
        run: apps/ede/packaging/split-debug.sh "$RUNNER_TEMP/stage" "$RUNNER_TEMP/debug"
      # GlitchTip sits behind Cloudflare Access: the service token rides as
      # headers. Releases only; no secrets = skipped; a failed upload warns
      # and never fails the release. Nothing secret is echoed.
      - name: Upload the debug files to GlitchTip
        if: env.PUBLISH == 'true'
        continue-on-error: true
        env:
          SENTRY_URL: https://glitchtip.exponential.at
          SENTRY_ORG: exponential
          SENTRY_PROJECT: ede
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$CF_ACCESS_CLIENT_ID" ] || [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "::notice title=GlitchTip::debug-file upload skipped (GLITCHTIP_AUTH_TOKEN / CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET not set)"
            exit 0
          fi
          if ! npx --yes @sentry/cli@2.58.6 \
              --header "CF-Access-Client-Id:$CF_ACCESS_CLIENT_ID" \
              --header "CF-Access-Client-Secret:$CF_ACCESS_CLIENT_SECRET" \
              debug-files upload --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" "$RUNNER_TEMP/debug"; then
            echo "::warning title=GlitchTip::debug-file upload failed; the release goes on without symbols"
          fi
      - name: Pack the .debs
        run: |
          set -euo pipefail
          apps/ede/packaging/pack-deb.sh "$RUNNER_TEMP/stage" dist noble --xwayland ~/ede-xwayland
          for suite in resolute trixie; do apps/ede/packaging/pack-deb.sh "$RUNNER_TEMP/stage" dist "$suite"; done
          ls -l dist
      # A throwaway runner: the noble Depends resolve, and the installed
      # compositor picks the bundled Xwayland.
      - name: Install and check
        run: |
          set -euo pipefail
          deb="$(ls dist/exponential-desktop_*~noble1_amd64.deb)"
          dpkg-deb -f "$deb" Depends
          sudo apt-get install -y "./$deb"
          /usr/lib/exponential-desktop/bin/Xwayland -version 2>&1 | grep 'Xwayland Version 24\.1\.'
          grep -q 'ExecStart=/usr/bin/exponential-ui supervise -- /usr/bin/exponential-shell' /usr/lib/systemd/user/exponential-shell.service
          systemd-analyze verify /usr/lib/systemd/user/exponential-shell.service || true
          exponential-compositor doctor | tee doctor.txt || true
          grep -E '^ok +Xwayland +/usr/lib/exponential-desktop/bin/Xwayland 24\.1\.' doctor.txt
      # Without the distro's xwayland this can only be the bundled one (the
      # test skips when it finds none: a failure here).
      - name: Headless Xwayland test against the bundled one
        working-directory: apps/ede
        run: |
          set -euo pipefail
          sudo apt-get remove -y xwayland || true
          if command -v Xwayland; then echo "a distro Xwayland is still on PATH" >&2; exit 1; fi
          PATH="/usr/lib/exponential-desktop/bin:$PATH" cargo test --locked -p ede-compositor an_x11_window_through_xwayland -- --nocapture 2>&1 | tee test.txt
          if grep -q 'skipped: no Xwayland' test.txt; then exit 1; fi
          grep -q '^test an_x11_window_through_xwayland.* ok$' test.txt
      - name: Keep the stage (modes intact)
        run: tar -C "$RUNNER_TEMP" -cf stage.tar stage
      - uses: actions/upload-artifact@v4
        with:
          name: stage
          path: stage.tar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-deb
          path: dist/*.deb
          if-no-files-found: error

  rpm:
    needs: [build]
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - run: dnf install -y -q rpm-build tar
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps/ede/packaging
      - uses: actions/download-artifact@v4
        with:
          name: stage
      - run: |
          tar -xf stage.tar -C /tmp
          apps/ede/packaging/pack-rpm.sh /tmp/stage dist
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-rpm
          path: dist/*.rpm
          if-no-files-found: error

  arch:
    needs: [build]
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps/ede/packaging
      - uses: actions/download-artifact@v4
        with:
          name: stage
      # makepkg refuses root.
      - run: |
          tar -xf stage.tar -C /tmp
          useradd -m builder
          mkdir -p dist && chown builder dist
          su builder -c "apps/ede/packaging/pack-arch.sh /tmp/stage dist"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-arch
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  # The signed repositories: on a publish, on top of what the host serves
  # (older versions stay up to PKG_KEEP); otherwise from scratch.
  repo:
    needs: [build, rpm, arch]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            apps/ede/packaging
            .github/actions/apt-mirror
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: incoming
          merge-multiple: true
      - uses: ./.github/actions/apt-mirror
      - run: sudo apt-get install -y apt-utils createrepo-c rpm gnupg rsync
      - name: The signing key
        env:
          PKG_SIGNING_KEY: ${{ secrets.PKG_SIGNING_KEY }}
        run: printf '%s\n' "$PKG_SIGNING_KEY" | gpg --batch --import
      - name: The host's current tree
        if: env.PUBLISH == 'true'
        env:
          PKG_SSH_KEY: ${{ secrets.PKG_SSH_KEY }}
          PKG_SSH_KNOWN_HOSTS: ${{ secrets.PKG_SSH_KNOWN_HOSTS }}
          PKG_SSH_TARGET: ${{ secrets.PKG_SSH_TARGET }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PKG_SSH_KEY" > ~/.ssh/pkg && chmod 600 ~/.ssh/pkg
          printf '%s\n' "$PKG_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -rltH -e "ssh -i ~/.ssh/pkg -o IdentitiesOnly=yes" "$PKG_SSH_TARGET:/" www/
      - run: apps/ede/packaging/repo/publish.sh incoming www
      - run: tar -cf www.tar www
      - uses: actions/upload-artifact@v4
        with:
          name: www
          path: www.tar
          if-no-files-found: error

  # #EDE-35: every distro of the matrix installs from the repositories the
  # repo job built, through the setup script they serve.
  smoke:
    needs: [repo]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - linuxmintd/mint22-amd64
          - ubuntu:26.04
          - debian:trixie
          - fedora:44
          - fedora:45
          - archlinux:latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps/ede/packaging
      - uses: actions/download-artifact@v4
        with:
          name: www
      - run: |
          set -euo pipefail
          tar -xf www.tar
          (cd www && python3 -m http.server 8080 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          docker run --rm --network host -e EXPONENTIAL_PKG_URL=http://127.0.0.1:8080 \
            -v "$PWD/apps/ede/packaging:/p:ro" "${{ matrix.image }}" sh /p/smoke.sh

  publish:
    needs: [repo, smoke]
    if: startsWith(github.ref, 'refs/tags/ede-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    concurrency:
      group: pkg-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps/ede/packaging
      - uses: actions/download-artifact@v4
        with:
          name: www
      - name: Upload (packages first, metadata at the end)
        env:
          PKG_SSH_KEY: ${{ secrets.PKG_SSH_KEY }}
          PKG_SSH_KNOWN_HOSTS: ${{ secrets.PKG_SSH_KNOWN_HOSTS }}
          PKG_SSH_TARGET: ${{ secrets.PKG_SSH_TARGET }}
        run: |
          set -euo pipefail
          tar -xf www.tar
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PKG_SSH_KEY" > ~/.ssh/pkg && chmod 600 ~/.ssh/pkg
          printf '%s\n' "$PKG_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -rltH --delete-after --delay-updates -e "ssh -i ~/.ssh/pkg -o IdentitiesOnly=yes" www/ "$PKG_SSH_TARGET:/"
      - name: Served
        run: |
          set -euo pipefail
          . apps/ede/packaging/repo.env
          for suite in $PKG_APT_SUITES; do curl -fsS "https://$PKG_HOST/apt/dists/$suite/InRelease" | grep -q "^Codename: $suite$"; done
          curl -fsS "https://$PKG_HOST/rpm/x86_64/repodata/repomd.xml.asc" >/dev/null
          curl -fsS "https://$PKG_HOST/arch/x86_64/exponential.db.sig" >/dev/null

  release:
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/ede-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: false
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
