name: macos-app
description: >-
  EXP-1430: assemble a macOS .app from built executable(s) (2+ slices → universal
  via lipo), codesign it (Developer ID + hardened runtime when a cert is given,
  ad-hoc otherwise) and package it: notarized + stapled .dmg when signed, an
  ad-hoc-signed .zip when the signing secrets are absent.

inputs:
  binaries:
    description: Built executable path(s), one per line; one per arch slice (2+ → `lipo -create` universal).
    required: true
  app-name:
    description: Bundle name (`<app-name>.app`, CFBundleName/DisplayName, default volume name).
    required: true
  bundle-id:
    description: CFBundleIdentifier.
    required: true
  executable:
    description: Executable name inside Contents/MacOS (CFBundleExecutable).
    required: true
  info-plist:
    description: Info.plist template; `${VERSION}`/`${BUILD}` are substituted. URL schemes (CFBundleURLTypes) live here.
    required: true
  version:
    description: CFBundleShortVersionString.
    default: 0.0.0
  build:
    description: CFBundleVersion.
    default: "0"
  entitlements:
    description: Entitlements plist for the hardened-runtime signature (optional).
    default: ""
  icon:
    description: App icon, .svg (rasterized with librsvg, installed when missing) or .icns (optional).
    default: ""
  frameworks-dir:
    description: Dir whose *.dylib / *.framework go to Contents/Frameworks, signed with the app identity (optional).
    default: ""
  resources:
    description: Files or dirs (a dir's contents) to copy into Contents/Resources before signing, one per line.
    default: ""
  lsuielement:
    description: "`true` → LSUIElement (tray-only app, no Dock icon / app switcher entry); `false` → key removed."
    default: "false"
  output-dir:
    description: Where the .app and the .dmg/.zip are written.
    default: dist
  dmg-name:
    description: File name of the signed .dmg (default `<app-name>.dmg`).
    default: ""
  zip-name:
    description: File name of the unsigned fallback .zip (default `<app-name>.zip`).
    default: ""
  volume-name:
    description: The .dmg volume name (default the app name).
    default: ""
  cert-p12:
    description: SECRET — base64 Developer ID Application .p12. Empty → ad-hoc .zip fallback.
    default: ""
  cert-password:
    description: SECRET — the .p12 password.
    default: ""
  notary-key-id:
    description: SECRET — App Store Connect API key id.
    default: ""
  notary-issuer-id:
    description: SECRET — App Store Connect issuer id.
    default: ""
  notary-key:
    description: SECRET — base64 App Store Connect API key (.p8). Any notary input empty → un-notarized .dmg.
    default: ""

outputs:
  app:
    description: Path of the built .app.
    value: ${{ steps.bundle.outputs.app }}
  artifact:
    description: Path of the .dmg (signed) or .zip (ad-hoc).
    value: ${{ steps.package.outputs.artifact }}
  signed:
    description: "`true` when Developer-ID signed (+ .dmg), `false` for the ad-hoc .zip."
    value: ${{ steps.signing.outputs.enabled }}

runs:
  using: composite
  steps:
    # Secrets can't drive `if:` directly: surface whether a cert was given.
    - id: signing
      shell: bash
      env:
        CERT: ${{ inputs.cert-p12 }}
      run: |
        if [ -n "$CERT" ]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        else
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "::warning::macos-app: no signing certificate — ad-hoc .zip fallback (no notarized .dmg)"
        fi

    - name: Icon rasterizer
      if: endsWith(inputs.icon, '.svg')
      shell: bash
      run: |
        command -v rsvg-convert >/dev/null 2>&1 || brew install librsvg \
          || echo "note: librsvg install failed — no custom icon"

    # Developer ID Application cert → a throwaway keychain; the identity hash
    # goes to codesign. Deleted again by the last step.
    - id: cert
      if: steps.signing.outputs.enabled == 'true'
      shell: bash
      env:
        CERT_P12: ${{ inputs.cert-p12 }}
        CERT_PASSWORD: ${{ inputs.cert-password }}
      run: |
        set -euo pipefail
        KEYCHAIN="$RUNNER_TEMP/macos-app-${GITHUB_RUN_ID}-${GITHUB_JOB}.keychain-db"
        KEYCHAIN_PW="$(uuidgen)"
        security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
        echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/macos-app-cert.p12"
        security import "$RUNNER_TEMP/macos-app-cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
          -T /usr/bin/codesign -T /usr/bin/security
        rm -f "$RUNNER_TEMP/macos-app-cert.p12"
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
        # Prepend our keychain to the search list so codesign finds the identity.
        security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
        IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
          | grep 'Developer ID Application' | head -1 | awk '{print $2}')"
        [ -n "$IDENTITY" ] || { echo "::error::no Developer ID Application identity in the .p12"; exit 1; }
        echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
        echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"

    - id: bundle
      shell: bash
      env:
        BINARIES: ${{ inputs.binaries }}
        RESOURCES: ${{ inputs.resources }}
        APP_NAME: ${{ inputs.app-name }}
        BUNDLE_ID: ${{ inputs.bundle-id }}
        EXECUTABLE: ${{ inputs.executable }}
        INFO_PLIST: ${{ inputs.info-plist }}
        APP_VERSION: ${{ inputs.version }}
        APP_BUILD: ${{ inputs.build }}
        ENTITLEMENTS: ${{ inputs.entitlements }}
        ICON: ${{ inputs.icon }}
        FRAMEWORKS_DIR: ${{ inputs.frameworks-dir }}
        LSUIELEMENT: ${{ inputs.lsuielement }}
        OUT_DIR: ${{ inputs.output-dir }}
        IDENTITY: ${{ steps.cert.outputs.identity }}
      run: |
        set -euo pipefail
        args=(--app-name "$APP_NAME" --bundle-id "$BUNDLE_ID" --executable "$EXECUTABLE"
              --plist "$INFO_PLIST" --out-dir "$OUT_DIR" --version "$APP_VERSION" --build "$APP_BUILD"
              --lsuielement "$LSUIELEMENT" --identity "$IDENTITY")
        while IFS= read -r b; do [ -n "$b" ] && args+=(--binary "$b"); done <<<"$BINARIES"
        while IFS= read -r r; do [ -n "$r" ] && args+=(--resource "$r"); done <<<"$RESOURCES"
        [ -n "$ENTITLEMENTS" ] && args+=(--entitlements "$ENTITLEMENTS")
        [ -n "$ICON" ] && args+=(--icon "$ICON")
        [ -n "$FRAMEWORKS_DIR" ] && args+=(--frameworks-dir "$FRAMEWORKS_DIR")
        app="$("$GITHUB_ACTION_PATH/bundle.sh" "${args[@]}")"
        echo "app=$app" >> "$GITHUB_OUTPUT"

    - id: package
      shell: bash
      env:
        SIGNED: ${{ steps.signing.outputs.enabled }}
        APP: ${{ steps.bundle.outputs.app }}
        APP_NAME: ${{ inputs.app-name }}
        OUT_DIR: ${{ inputs.output-dir }}
        DMG_NAME: ${{ inputs.dmg-name }}
        ZIP_NAME: ${{ inputs.zip-name }}
        VOLNAME: ${{ inputs.volume-name }}
        IDENTITY: ${{ steps.cert.outputs.identity }}
        NOTARY_KEY_ID: ${{ inputs.notary-key-id }}
        NOTARY_ISSUER_ID: ${{ inputs.notary-issuer-id }}
        NOTARY_KEY: ${{ inputs.notary-key }}
      run: |
        set -euo pipefail
        out="$(cd "$OUT_DIR" && pwd)"
        if [ "$SIGNED" = true ]; then
          dmg="$out/${DMG_NAME:-$APP_NAME.dmg}"
          if [ -n "$NOTARY_KEY" ]; then
            trap 'rm -f "$RUNNER_TEMP/macos-app-notary.p8"' EXIT
            echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/macos-app-notary.p8"
            export NOTARY_KEY_PATH="$RUNNER_TEMP/macos-app-notary.p8"
          fi
          "$GITHUB_ACTION_PATH/dmg.sh" --app "$APP" --dmg "$dmg" \
            --volname "${VOLNAME:-$APP_NAME}" --identity "$IDENTITY"
          echo "artifact=$dmg" >> "$GITHUB_OUTPUT"
        else
          # Unsigned fallback → ad-hoc .zip (keeps CI green pre-account).
          zip="$out/${ZIP_NAME:-$APP_NAME.zip}"
          rm -f "$zip"
          (cd "$(dirname "$APP")" && ditto -c -k --sequesterRsrc --keepParent "$(basename "$APP")" "$zip")
          echo "artifact=$zip" >> "$GITHUB_OUTPUT"
        fi

    - name: Remove the signing keychain
      if: always() && steps.cert.outputs.keychain != ''
      shell: bash
      env:
        KEYCHAIN: ${{ steps.cert.outputs.keychain }}
      run: security delete-keychain "$KEYCHAIN" || true
