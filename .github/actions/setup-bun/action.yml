name: setup-bun
description: >-
  Bun on the runner, outage-proof: oven-sh/setup-bun first; when its download
  from github.com fails (the 2026-11-08 release-download 504s blocked every
  PR's gate), the same Bun from npm's registry (the `bun` package carries the
  platform binary), into the job's temp dir and onto PATH.

inputs:
  bun-version:
    description: The Bun version; empty = setup-bun's default (the latest) and npm's `latest`.
    default: ''

runs:
  using: composite
  steps:
    - id: primary
      uses: oven-sh/setup-bun@v2
      continue-on-error: true
      with:
        bun-version: ${{ inputs.bun-version }}
    - if: steps.primary.outcome == 'failure'
      shell: bash
      env:
        VERSION: ${{ inputs.bun-version }}
      run: |
        set -euo pipefail
        echo "::warning::setup-bun's download failed; installing bun@${VERSION:-latest} from npm"
        prefix="$RUNNER_TEMP/bun-npm"
        for attempt in 1 2 3; do
          npm install --global --no-audit --no-fund --prefix "$prefix" "bun@${VERSION:-latest}" && break
          [ "$attempt" = 3 ] && exit 1
          sleep $((attempt * 10))
        done
        # POSIX npm links into <prefix>/bin, Windows into <prefix> itself.
        echo "$prefix/bin" >> "$GITHUB_PATH"
        echo "$prefix" >> "$GITHUB_PATH"
    - shell: bash
      run: bun --version
