name: glitchtip-debug-files
description: >-
  #LOGS-2: upload the desktop IDE's / CLI's Rust debug files (macOS dSYM,
  Linux ELF debug info, Windows PDB) to GlitchTip with `sentry-cli
  debug-files upload` (.github/scripts/glitchtip-debug-files.sh: the pinned
  binary, three attempts), so panics and hangs symbolicate. GlitchTip sits
  behind Cloudflare Access: the service-token headers ride every request.
  Any of the three secrets missing → skipped with a notice; a failed upload
  only warns (it never fails a release).

inputs:
  project:
    description: The GlitchTip project (desktop, ede, ...).
    default: desktop
  paths:
    description: Debug files or directories to upload, one per line.
    required: true
  auth-token:
    description: SECRET — GlitchTip auth token (upload-only).
    default: ""
  cf-access-client-id:
    description: SECRET — Cloudflare Access service token id.
    default: ""
  cf-access-client-secret:
    description: SECRET — Cloudflare Access service token secret.
    default: ""

runs:
  using: composite
  steps:
    - name: Upload debug files to GlitchTip
      shell: bash
      env:
        SENTRY_AUTH_TOKEN: ${{ inputs.auth-token }}
        CF_ACCESS_CLIENT_ID: ${{ inputs.cf-access-client-id }}
        CF_ACCESS_CLIENT_SECRET: ${{ inputs.cf-access-client-secret }}
        PROJECT: ${{ inputs.project }}
        PATHS: ${{ inputs.paths }}
      run: |
        set -uo pipefail
        files=()
        while IFS= read -r path; do
          [ -n "$path" ] && files+=("$path")
        done <<<"$PATHS"
        "$GITHUB_WORKSPACE/.github/scripts/glitchtip-debug-files.sh" "$PROJECT" "${files[@]}"
